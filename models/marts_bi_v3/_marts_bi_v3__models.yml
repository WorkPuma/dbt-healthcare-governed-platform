  # ─────────────────────────────────────────────────────────────────
  # mart_patient_outreach  (grain: one row per outreach record)
  # ─────────────────────────────────────────────────────────────────
  - name: mart_patient_outreach
    description: >
      One row per AI Outreach AI outreach attempt. Carries campaign, call outcome,
      and scheduling-success scope columns. Date column: submitted_at. Powers
      the AI Outreach Outreach dashboard (kpi_ai_outreach_scheduling_rate).
    config:
      contract:
        enforced: true
      meta:
        cube: true
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced"]
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]

    columns:
      - name: mart_patient_outreach_id
        data_type: string
        description: "Surrogate PK — MD5(CONCAT_WS('|', <grain cols>)) over the natural grain. Required by servingdb_sync.py for synced-table registration."
        constraints:
          - type: not_null
        tests:
          - unique
      - name: outreach_id
        data_type: string
        description: "AI Outreach AI outreach record identifier. Primary key for each outreach attempt."
      - name: account_id
        data_type: string
