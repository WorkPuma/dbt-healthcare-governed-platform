        description: "Scope column: patient_id when is_heartwise_candidate (clinic outreach pool)."
      - name: heartwise_declined_pid
        data_type: bigint
        description: "Scope column: patient_id when is_heartwise_declined."
      - name: heartwise_tagged_pid
        data_type: bigint
        description: "Scope column: patient_id when any Heartwise for Her tag exists (Enrolled OR Candidate OR Declined)."
      - name: eligible_enrolled_pid
