  # ─────────────────────────────────────────────────────────────────
  # mart_monthly_leakage_cohort  (grain: one row per cohort month)
  # ─────────────────────────────────────────────────────────────────
  - name: mart_monthly_leakage_cohort
    description: >
      One pre-aggregated row per cohort_month_start. Tracks patient leakage (no
      future engagement) and truly cancelled appointment rates for the active cohort.
    config:
      contract:
        enforced: false # contract deferred: column data_types not yet verified for enforcement
      meta:
        cube: true
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced"]
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]

    columns:
      - name: mart_monthly_leakage_cohort_id
        data_type: string
        description: "Surrogate PK — MD5(CONCAT_WS('|', <grain cols>)) over the natural grain. Required by servingdb_sync.py for synced-table registration."
        constraints:
          - type: not_null
        tests:
          - unique
      - name: cohort_month_start
        data_type: date
        description: "Start date of the cohort month. The mart's agg_time_dimension. Each row represents one calendar month of the 18-month engagement cohort."
      - name: cohort_eom
        data_type: date
        description: "End-of-month date for the cohort period."
      - name: engagement_cohort_18m_count
        data_type: bigint
        description: "CANONICAL column. Count of patients in the 18-month engagement cohort for this period (>=1 completed visit in trailing 548 days at EOM). Denominator for leakage rates. NOT the canonical Active Patient definition. See kpi_engagement_cohort_18m."
      - name: active_patient_count
        data_type: bigint
        description: "DEPRECATED back-compat alias of engagement_cohort_18m_count (identical value). Do NOT label as Active Patients — this is the 18-month engagement cohort, not the canonical Active Patient KPI."
      - name: leaked_patient_count
        data_type: bigint
        description: "Count of patients in the engagement cohort who had no future appointment at end of month."
      - name: patient_leakage_pct
        data_type: double
        description: "Patient leakage rate: leaked_patient_count / engagement_cohort_18m_count × 100. Share of the 18-month cohort with no future engagement."
      - name: no_future_engagement_count
        data_type: bigint
        description: "Count of patients with no future appointment scheduled as of cohort month end."
      - name: no_future_appt_pct
        data_type: double
        description: "No future appointment rate: no_future_engagement_count / engagement_cohort_18m_count × 100."
      - name: scheduled_appointment_count
        data_type: bigint
        description: "Total appointments scheduled within the cohort month. Denominator for truly cancelled rate."
      - name: truly_cancelled_appointment_count
        data_type: bigint
        description: "Appointments cancelled and not subsequently rescheduled within the cohort month."
      - name: appt_truly_cancelled_pct
        data_type: double
        description: "Truly cancelled appointment rate: truly_cancelled_appointment_count / scheduled_appointment_count × 100."
      - name: source_updated_at
        data_type: timestamp
        description: "CDF watermark — MAX(source_updated_at) of source rows. Drives ServingDB TRIGGERED sync."
    semantic_model:
      enabled: true
    agg_time_dimension: cohort_month_start

