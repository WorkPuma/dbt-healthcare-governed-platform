    agg_time_dimension: last_bh_visit_date
  - name: mart_hcc_assessment
    description: >
      Risk adjustment fact table of VendorNav AI HCC code suggestions per encounter.
      Grain: one row per HCC suggestion (patient × ICD-10 × HCC code × encounter date).
      Answers: How many HCC suggestions were accepted, rejected, or left unaddressed?
      Date column: encounter_date. Powers the HCC Assessment dashboard.
    config:
      contract:
        enforced: true # types verified via DESCRIBE QUERY + locked with explicit casts in SQL
      meta:
        cube: true
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced"]
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]

    columns:
      - name: mart_hcc_assessment_id
        data_type: string
        description: >
          Surrogate PK — null-safe MD5(CONCAT_WS('|', COALESCE(grain cols, '\0')))
          over (patient_id, icd10_code, hcc_code, encounter_date). Required by
          servingdb_sync.py for synced-table registration.
        constraints:
          - type: not_null
        tests:
          - unique
      - name: patient_id
        data_type: string
        description: "{{ doc('patient_id') }}"
        tests:
          - not_null:
              config:
                severity: warn
      - name: provider_name
        data_type: string
        description: "{{ doc('provider_name') }}"
      - name: department
        data_type: string
        description: "Athena department (clinic) where the HCC encounter occurred"
      - name: encounter_date
        data_type: date
        description: "Date of the clinical encounter for which HCC suggestions were generated"
        tests:
          - not_null:
              config:
                severity: warn
          - date_not_future:
              config:
                severity: warn
                tags: ["date_validity"]
      - name: insurance_group
        data_type: string
        description: "Patient insurance group associated with this encounter for risk adjustment"
      - name: icd10_code
        data_type: string
        description: "ICD-10 diagnosis code for this HCC suggestion generated by VendorNav AI risk stratification"
        tests:
          - not_null:
              config:
                severity: warn
      - name: icd_description
        data_type: string
        description: "Plain-text description of the ICD-10 code associated with this HCC suggestion"
      - name: hcc_code
        data_type: string
        description: "CMS Hierarchical Condition Category code mapped from the ICD-10 diagnosis"
        tests:
          - not_null:
              config:
                severity: warn
      - name: suggestion_status
        data_type: string
        description: "HCC coding workflow status: ACCEPTED, REJECTED, HELD, NOT ADDRESSED, or NA (system-excluded)"
      - name: suggestion_type
        data_type: string
        description: "Classification of the HCC suggestion (e.g., new condition, recapture from prior year)"
      - name: suggestion_source
        data_type: string
        description: "System that generated the suggestion (e.g., VendorNav AI, manual coder entry)"
      - name: documentation_strength
        data_type: string
        description: "VendorNav AI confidence level for this HCC suggestion (e.g., Strong, Moderate, Weak)"
      - name: is_accepted
        data_type: boolean
        description: "True when the provider accepted this HCC suggestion at the time of documentation"
      - name: is_gap
        data_type: boolean
        description: "True when suggestion was not addressed by the provider (status = NOT ADDRESSED)"
      - name: is_recapture_candidate
        data_type: boolean
        description: "True when this HCC was captured in a prior year and must be recaptured for CMS risk adjustment"
      - name: has_claim_diagnosis
        data_type: boolean
        description: "True when a claim has already been submitted with this ICD-10 diagnosis code"
      - name: hcc_coefficient
        data_type: double
        description: "Risk Adjustment Factor (RAF) coefficient for this HCC code per CMS mapping table"
      - name: market
        data_type: string
        description: "Market"
      - name: last_synced_at
        data_type: timestamp
        description: "Last sync timestamp"
      - name: accepted_int
        data_type: bigint
        description: "Integer flag (1/0) for accepted suggestion. Used by SUM() aggregations in the metric() runtime."
      - name: gap_int
        data_type: bigint
        description: "Integer flag (1/0) for NOT ADDRESSED status (coding gap). Used by SUM() aggregations in the metric() runtime."
      - name: system_excluded_int
        data_type: bigint
        description: "Integer flag (1/0) for NA status (system-excluded, not actionable). Used by SUM() aggregations in the metric() runtime."
      - name: actionable_int
        data_type: bigint
        description: "Integer flag (1/0) for actionable suggestion (status != NA). Used by SUM() aggregations in the metric() runtime."
      - name: recapture_int
        data_type: bigint
        description: "Integer flag (1/0) for accepted recapture candidate. Used by SUM() aggregations in the metric() runtime."
      - name: recapture_candidate_int
        data_type: bigint
        description: "Integer flag (1/0) for any recapture candidate regardless of acceptance. Used by SUM() aggregations in the metric() runtime."
      - name: accepted_hcc_value_num
        data_type: "decimal(10,0)"
        description: "RAF coefficient value when suggestion is accepted; 0 otherwise. Sums to total HCC value captured."
      - name: assessed_int
        data_type: bigint
        description: "Integer flag (1/0) for assessed suggestion (ACCEPTED, REJECTED, or HELD). Used by SUM() aggregations in the metric() runtime."
      - name: dismissed_int
        data_type: bigint
        description: "Integer flag (1/0) for rejected suggestion. Used by SUM() aggregations in the metric() runtime."
      - name: held_int
        data_type: bigint
        description: "Integer flag (1/0) for held suggestion (pending further review). Used by SUM() aggregations in the metric() runtime."
      - name: pending_closed_int
        data_type: bigint
        description: "Integer flag (1/0) for accepted suggestion with no claim diagnosis submitted yet. Used by SUM() aggregations in the metric() runtime."
      - name: one
        data_type: bigint
        description: "Constant 1 per suggestion row. Used as denominator in rate() aggregations in the metric() runtime."
      - name: source_updated_at
        data_type: timestamp
        description: "CDF watermark — max(source_updated_at, last_updated_at) across upstream refs. Required for ServingDB TRIGGERED sync mode."
        constraints:
          - type: not_null
        tests:
    # ─────────────────────────────────────────────────────────────────
    # mart_hcc_provider_contribution  (grain: provider × visit)
    # ─────────────────────────────────────────────────────────────────
    semantic_model:
      enabled: true
    agg_time_dimension: encounter_date
  - name: mart_hcc_provider_contribution
    description: >
      Summarizes HCC review and acceptance performance per provider visit.
      Grain: one row per provider x encounter (visit_id x provider_name).
      Answers: Which providers consistently review and accept HCC suggestions?
      Date column: encounter_date. Powers the HCC Assessment dashboard.
    config:
      contract:
        enforced: true # types verified via DESCRIBE QUERY + locked with explicit casts in SQL
      meta:
        cube: true
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced"]
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]

    columns:
      - name: mart_hcc_provider_contribution_id
        data_type: string
        description: "Surrogate PK — MD5(CONCAT_WS('|', <grain cols>)) over the natural grain. Required by servingdb_sync.py for synced-table registration."
        constraints:
          - type: not_null
        tests:
          - unique
      - name: provider_name
        data_type: string
        description: "{{ doc('provider_name') }}"
      - name: department
        data_type: string
        description: "Athena department (clinic) where the HCC encounter occurred"
      - name: encounter_date
        data_type: date
        description: "Date of the clinical encounter with HCC suggestions presented to the provider"
      - name: visit_id
        data_type: string
        description: "Visit identifier"
      - name: insurance_group
        data_type: string
        description: "Insurance group"
      - name: is_reviewed_by_provider
        data_type: boolean
        description: "Provider reviewed the HCC suggestions"
      - name: is_scrubbed
        data_type: boolean
        description: "Visit was scrubbed"
      - name: total_suggestions
        data_type: bigint
        description: "Total HCC suggestions for this visit"
      - name: accepted_count
        data_type: bigint
        description: "Number of accepted suggestions"
      - name: not_addressed_count
        data_type: bigint
        description: "Number of not-addressed suggestions"
      - name: hcc_value_captured
        data_type: double
        description: "Total RAF value from accepted HCC suggestions for this visit (sum of hcc_coefficient where accepted)"
      - name: acceptance_rate
        data_type: double
        description: "Pre-calculated accepted suggestions as a fraction of total actionable suggestions for this visit"
      - name: last_synced_at
        data_type: timestamp
        description: "Timestamp of the most recent sync from the VendorNav HCC source view"
      - name: reviewed_int
        data_type: bigint
        description: "Integer flag (1/0) for provider review of HCC suggestions. Used by SUM() aggregations in the metric() runtime."
      - name: one
        data_type: bigint
        description: "Constant 1 per visit row. Used as denominator in rate() aggregations in the metric() runtime."
      - name: source_updated_at
        data_type: timestamp
        description: "CDF watermark — max(source_updated_at, last_updated_at) across upstream refs. Required for ServingDB TRIGGERED sync mode."
        constraints:
          - type: not_null
        tests:
    # ─────────────────────────────────────────────────────────────────
    # mart_membership  (grain: one row per account/lead)
    # ─────────────────────────────────────────────────────────────────
    semantic_model:
      enabled: true
    agg_time_dimension: encounter_date
  - name: mart_membership
    description: >
