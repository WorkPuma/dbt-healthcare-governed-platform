      - name: as_of_date
        data_type: date
        description: "Snapshot build date (current_date at materialization)."
      - name: source_updated_at
        data_type: timestamp
        description: "CDF watermark — greatest of MDM patient, Heartwise custom demo, and Zio order timestamps."

  - name: mart_cadence_scheduling
    description: >
      One row per patient. PANEL-LEVEL current-snapshot cadence view (Goal B):
      "right now, is this patient on cadence, off cadence with a next qualifying
      visit booked, or off cadence with no next visit?" Patient-grain counterpart
      to mart_eov_cadence (Goal A, visit-grain). Both marts now share the SAME
      MDM-compliant qualifying-visit population (is_patient_visit AND NOT
      behavioral health AND NOT ancillary, core departments, parent slots) sourced
      via int_cadence_qualifying_visits. On/off cadence uses days-since-last-
      QUALIFYING-visit thresholds mirrored from vw_off_cadence_eligibility /
      OffCadenceBatch.cls: Highly Complex >23d, High Risk >45d, Rising Risk >68d,
      Low/No-Tier >182d for last qualifying visits on/after 2026-04-13 else >274d
      (the Low Risk policy change is gated on last_qualifying_completed_visit_date
      — NOT applied retroactively to pre-4/13 visits). Off-cadence patients split
      via cadence_status_detail into 'Off Cadence - No Next Visit' vs
      'Off Cadence - Next Beyond'. off_cadence_masked_by_nonqualifying measures
      the ancillary/BH "masking" delta vs the legacy any-visit logic. Re-tiering
      overlay columns (proposed_tier, tier_shift, clinical feature inputs) are
      appended from int_patient_tier_features. Contract enforced: this mart
      backs the Operating Review dashboard, so any column add/rename/retype must
      be reflected in this schema (that is the point).
    config:
      contract:
        enforced: true # enforced to protect the Operating Review dashboard (backs live BI)
      meta:
        cube: true
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced", "scheduling", "cadence"]
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]

    columns:
      - name: mart_cadence_scheduling_id
        data_type: string
        description: "Surrogate PK \u2014 MD5 over patient_id. Required by servingdb_sync.py for synced-table registration."
      - name: patient_id
        data_type: bigint
        description: "{{ doc('patient_id') }}"
      - name: golden_id
        data_type: string
        description: "MDM golden patient id."
      - name: salesforce_id
        data_type: string
        description: "Salesforce contact id."
      - name: is_active
        data_type: boolean
        description: "Whether the patient is active (>=1 completed visit within 548 days)."
      - name: patient_status
        data_type: string
        description: "Patient lifecycle status."
      - name: clinic
        data_type: string
        description: "Patient home clinic."
      - name: primary_care_provider
        data_type: string
        description: "Patient primary care provider."
      - name: primary_payor
        data_type: string
        description: "Primary payor."
      - name: primary_product_type
        data_type: string
        description: "Primary product/plan type."
      - name: membership_enrollment
        data_type: string
        description: "Membership enrollment status."
      - name: age
        data_type: int
        description: "Patient age (years)."
      - name: current_tier
        data_type: string
        description: "Normalized Salesforce risk tier (Low Risk / Rising Risk / High Risk / Highly Complex / No Tier). Source: Account.Risk_Tier__c."
      - name: last_completed_visit_date
        data_type: date
        description: "Date of last completed visit."
      - name: days_since_last_visit
        data_type: double
        description: "Days since the patient's last completed visit (from the patients dim / Salesforce)."
      - name: cadence_threshold_days
        data_type: int
        description: "Tier-implied max days between QUALIFYING visits before a patient is off cadence (Highly Complex 23 / High Risk 45 / Rising Risk 68 / Low & No-Tier 182 for last qualifying visits on/after 2026-04-13 else 274). Gated on last_qualifying_completed_visit_date (no retroactive re-tiering)."
      - name: proposed_cadence_threshold_days
        data_type: int
        description: >
          Cadence threshold (days) under the proposed auto-tier (falls back to
          current_tier when proposed_tier is NULL). Same bands as
          cadence_threshold_days (23/45/68/182|274).
      - name: expected_visits_per_year
        data_type: int
        description: "Tier-implied clinical visit target per year (2/4/6/12). NULL for No Tier."
      - name: completed_visits_ttm
        data_type: bigint
        description: "COMPLETED QUALIFYING visits in the trailing 365 days (the tier visit/yr target basis). Sourced from int_cadence_qualifying_visits so it matches the EOV qualifying-visit population."
      - name: future_appointment_count
        data_type: double
        description: "Count of future scheduled appointments (Salesforce)."
      - name: has_future_appt
        data_type: boolean
        description: "Whether the patient has at least one future appointment booked of ANY type (Salesforce-sourced). Descriptive only — cadence logic uses has_next_qualifying_visit."
      - name: last_qualifying_completed_visit_date
        data_type: date
        description: "Most recent COMPLETED MDM-compliant qualifying visit (lookback 730d). NULL = no qualifying visit in window (e.g. active only via ancillary/BH) — patient is Off Cadence and may be off_cadence_masked_by_nonqualifying."
      - name: days_since_last_qualifying_visit
        data_type: int
        description: "current_date() - last_qualifying_completed_visit_date. NULL when no qualifying visit. This is the Goal B cadence basis (not days_since_last_visit)."
      - name: earliest_future_qualifying_visit_date
        data_type: date
        description: "Earliest SCHEDULED (non-cancelled) qualifying visit strictly after today. NULL = no next qualifying visit booked."
      - name: has_next_qualifying_visit
        data_type: boolean
        description: "A scheduled (non-cancelled) qualifying visit is booked strictly after today (MDM-compliant). The Goal B 'no next visit' axis."
      - name: off_cadence_flag
        data_type: boolean
        description: "Patient is off cadence under the Goal B qualifying-visit logic: no qualifying baseline in the 730d lookback, OR days_since_last_qualifying_visit > cadence_threshold_days."
      - name: on_cadence_flag
        data_type: boolean
        description: "Patient is on cadence: qualifying baseline exists AND days_since_last_qualifying_visit <= cadence_threshold_days."
      - name: proposed_off_cadence_flag
        data_type: boolean
        description: >
          Off cadence under proposed-tier thresholds (COALESCE proposed_tier,
          current_tier). Same qualifying-visit logic as off_cadence_flag.
      - name: proposed_on_cadence_flag
        data_type: boolean
        description: >
          On cadence under proposed-tier thresholds (COALESCE proposed_tier,
          current_tier). Same qualifying-visit logic as on_cadence_flag.
      - name: meets_visit_target
        data_type: boolean
        description: "Trailing-12mo completed QUALIFYING visits >= the tier visit/yr target."
      - name: off_cadence_masked_by_nonqualifying
        data_type: boolean
        description: "Diagnostic: would appear ON cadence under the legacy any-visit logic (any-type last visit within threshold) but is OFF under the qualifying-visit logic. Measures the ancillary/BH 'masking' delta from the MDM alignment."
      - name: scheduled_on_tier
        data_type: boolean
        description: "A QUALIFYING visit is booked (alias of has_next_qualifying_visit). On-tier cadence = a next qualifying visit is scheduled."
      - name: cadence_status
        data_type: string
        description: "On Cadence / Off Cadence / Unknown (no qualifying baseline / No Tier)."
      - name: cadence_status_detail
        data_type: string
        description: "Goal B trichotomy: 'On Cadence' / 'Off Cadence - No Next Visit' / 'Off Cadence - Next Beyond' (booked but overdue) / 'Unknown'."
      - name: visit_target_status
        data_type: string
        description: "Meets Target / Below Target / Unknown."
      - name: active_pid
        data_type: bigint
        description: "Scope column: patient_id when is_active. count_distinct base for active panel metrics."
      - name: on_cadence_pid
        data_type: bigint
        description: "Scope column: patient_id when active AND on cadence."
      - name: off_cadence_pid
        data_type: bigint
        description: "Scope column: patient_id when active AND off cadence."
      - name: has_future_appt_pid
        data_type: bigint
        description: "Scope column: patient_id when active AND has a future appointment."
      - name: scheduled_on_tier_pid
        data_type: bigint
        description: "Scope column: patient_id when active AND a next qualifying visit is booked."
      - name: off_cadence_unscheduled_pid
        data_type: bigint
        description: "Scope column: patient_id when active AND off cadence AND no next qualifying visit (intervention target)."
      - name: off_cadence_next_beyond_pid
        data_type: bigint
        description: "Scope column: patient_id when active AND off cadence AND a next qualifying visit IS booked (overdue but scheduled)."
      - name: proposed_on_cadence_pid
        data_type: bigint
        description: "Scope column: patient_id when active AND on cadence under proposed-tier thresholds."
      - name: proposed_off_cadence_pid
        data_type: bigint
        description: "Scope column: patient_id when active AND off cadence under proposed-tier thresholds."
      - name: proposed_off_cadence_unscheduled_pid
        data_type: bigint
        description: "Scope column: patient_id when active AND proposed-off-cadence AND no next qualifying visit."
      - name: off_cadence_masked_by_nonqualifying_pid
        data_type: bigint
        description: "Scope column: patient_id when active AND off_cadence_masked_by_nonqualifying."
      - name: meets_visit_target_pid
        data_type: bigint
        description: "Scope column: patient_id when active AND meets the tier visit/yr target."
      - name: has_retier_data
        data_type: boolean
        description: >
          Alias of int_patient_tier_features.has_tier_data. TRUE when any of:
          DOB/age, chronic match, risk-factor ICD flags, active meds,
          nurse-validated ADT (ED/IP), PHQ-9, smoking status, SDOH screen, or
          curated severe V28 HCC. Labs alone (A1c/BP), Mini-Cog, STEADI, and
          TUG do not set this flag. Legacy "chronic OR HCC OR Katz OR ED/IP"
          wording is obsolete (Katz retired with the Excel-rubric rebuild).
      - name: n_chronic_conditions
        data_type: int
      - name: has_any_chronic
        data_type: boolean
        description: "True if the patient has >=1 AHRQ CCIR-chronic condition across claims + active problem list (chronic floor)."
      - name: n_active_meds
        data_type: int
      - name: polypharmacy
        data_type: boolean
      - name: hrm_any
        data_type: boolean
      - name: hrm_two_same_class
        data_type: boolean
      - name: long_term_steroid
        data_type: boolean
      - name: n_ip_365d
        data_type: bigint
        description: "Inpatient admits in trailing 365 days."
      - name: n_ed_365d
        data_type: bigint
        description: "ED visits in trailing 365 days."
      - name: n_ed_ip_365d
        data_type: bigint
      - name: last_a1c_pct
        data_type: double
      - name: last_systolic
        data_type: double
      - name: last_diastolic
        data_type: double
      - name: phq9_score
        data_type: int
      - name: minicog_score
        data_type: int
        description: "Latest scored Mini-Cog (0-5). NULL if not captured."
      - name: fall_risk_score
        data_type: int
      - name: tug_seconds
        data_type: int
      - name: pre_diabetes
        data_type: boolean
      - name: elevated_bp_no_htn_dx
        data_type: boolean
      - name: active_smoker
        data_type: boolean
      - name: osteopenia
        data_type: boolean
      - name: frequent_falls
        data_type: boolean
      - name: cognitive_impairment_icd
        data_type: boolean
      - name: urinary_incontinence
        data_type: boolean
      - name: positive_sdoh
        data_type: boolean
      - name: hearing_impairment
        data_type: boolean
      - name: visual_impairment
        data_type: boolean
      - name: a1c_out_of_range
        data_type: boolean
      - name: bp_out_of_range
        data_type: boolean
      - name: phq9_high
        data_type: boolean
      - name: minicog_low
        data_type: boolean
      - name: frailty_icd
        data_type: boolean
      - name: tug_abnormal
        data_type: boolean
      - name: med_escalator
        data_type: boolean
      - name: high_util
        data_type: boolean
      - name: frailty_present
        data_type: boolean
      - name: escalator_count
        data_type: int
      - name: risk_factor_present
        data_type: boolean
      - name: tier_band
        data_type: int
      - name: age_addon
        data_type: int
      - name: proposed_rank_band
        data_type: int
      - name: proposed_rank
        data_type: int
      - name: proposed_tier
        data_type: string
        description: "Proposed formalized tier from the clinical rubric (chronic acuity_score = Charlson + custom BH/osteoporosis + ED/IP utilization + Katz/Mini-Cog/dementia/MCI). NULL when has_retier_data is false."
      - name: low_subtype
        data_type: string
      - name: tier_shift
        data_type: string
        description: "Proposed vs current tier: Upgrade / Downgrade / No Change / Insufficient Data."
      - name: proposed_tier_pid
        data_type: bigint
        description: "Scope column: patient_id when active AND has_retier_data (proposed-tier cohort)."
      - name: tier_upgrade_pid
        data_type: bigint
        description: "Scope column: patient_id when active AND proposed tier is higher than current."
      - name: tier_downgrade_pid
        data_type: bigint
        description: "Scope column: patient_id when active AND proposed tier is lower than current."
      - name: tier_nochange_pid
        data_type: bigint
        description: "Scope column: patient_id when active AND proposed tier equals current."
      - name: low_risk_pid
        data_type: bigint
      - name: rising_risk_pid
        data_type: bigint
      - name: high_risk_pid
        data_type: bigint
      - name: highly_complex_pid
        data_type: bigint
      - name: polypharmacy_pid
        data_type: bigint
      - name: hrm_pid
        data_type: bigint
      - name: high_util_pid
        data_type: bigint
      - name: frailty_pid
        data_type: bigint
      - name: risk_factor_pid
        data_type: bigint
      - name: tier_insufficient_pid
        data_type: bigint
        description: >
          Scope column: patient_id when active AND (no clinical signal OR
          first completed visit <12 months ago / unknown). Counts toward
          cadence_tier_insufficient_patients. Aligns with tier_shift =
          Insufficient Data for the tenure gate (NULL has_sufficient_history
          treated as insufficient).
      - name: null_minicog_pid
        data_type: bigint
        description: "Scope column: patient_id when active AND missing Mini-Cog."
      - name: source_updated_at
        data_type: timestamp
        description: "CDF watermark \u2014 patients dim last_updated_at."
  - name: mart_eov_cadence
    description: >
      Visit-level End-of-Visit scheduling + cadence mart (DEV-4138). One row per
      COMPLETED qualifying patient visit. Denominator matches the provider-bonus
      NEXT_VISIT denominator (audit_bonus__encounter_detail:
      is_qualifying_patient_visit AND COMPLETED) so EOV KPIs reconcile 1:1 with the
      MOR - Patient Engagement report. Powers operations-eov-scheduling-cadence-v3.
      Measures: #9 Next Visit at EOV (has_next_visit_scheduled), #11 Next AWV at
      EOV (has_future_awv_scheduled over Medicare visits), #10 Scheduled on cadence
      (next qualifying visit booked within the tier threshold: Highly Complex 23 /
      High 45 / Rising 68 / else 182 if visit on/after 2026-04-13 else 274 days).
      Contract enforced: this mart backs the Operating Review dashboard, so any
      column add/rename/retype must be reflected in this schema (that is the point).
    config:
      contract:
        enforced: true # enforced to protect the Operating Review dashboard (backs live BI)
      meta:
        cube: true
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced", "scheduling", "cadence", "eov"]
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]

    columns:
      - name: mart_eov_cadence_id
        data_type: string
        description: "Surrogate PK — MD5 over appointment_id. Required by servingdb_sync.py for synced-table registration."
        tests:
          - unique
          - not_null
      - name: appointment_id
        data_type: bigint
        description: "Athena appointment ID of the completed qualifying visit (grain key)."
      - name: patient_id
        data_type: bigint
        description: "{{ doc('patient_id') }}"
      - name: provider_id
        data_type: bigint
        description: "Rendering provider ID for the encounter."
      - name: provider_name
        data_type: string
        description: "{{ doc('provider_name') }} (episodic — the encounter's rendering provider)."
      - name: department_id
        data_type: bigint
        description: "Athena department ID of the encounter."
      - name: clinic
        data_type: string
        description: "Provider's standardized home clinic (e.clinic_name from the encounter). Not episodic encounter clinic in this phase."
      - name: appointment_date
        data_type: date
        description: "Date of the completed qualifying visit."
      - name: appointment_week
        data_type: timestamp
        description: "Visit date truncated to ISO week start (weekly trend line)."
      - name: appointment_month
        data_type: timestamp
        description: "Visit date truncated to first of month."
      - name: appointment_year
        data_type: int
        description: "Year of the visit."
      - name: appointment_type_id
        data_type: bigint
        description: "Athena appointment type ID."
      - name: appointment_type_name
        data_type: string
        description: "Appointment type name (Visit Type filter)."
      - name: visit_category
        data_type: string
        description: "MDM-derived visit category (AWV / Office Visit / Telehealth / Behavioral Health / Ancillary / Other)."
      - name: risk_tier
        data_type: string
        description: "Canonical patients.risk_tier (Low Risk / Rising Risk / High Risk / Highly Complex / No Tier). Patient Tier filter + cadence threshold input."
      - name: attribution_status
        data_type: string
        description: "{{ doc('attribution_status') }} (from the patient's active attribution row in mart_attribution_detail)."
      - name: attributed_payor_analytics
        data_type: string
        description: "Analytics-bucketed attributed payor (Attribution Payer filter)."
      - name: is_visit_medicare
        data_type: boolean
        description: "Visit-time Medicare classification (denominator gate for the Next AWV at EOV metric)."
      - name: insurance_category
        data_type: string
        description: "Insurance category at time of visit."
      - name: has_next_visit_scheduled
        data_type: boolean
        description: "End-of-visit Next Visit flag — a future qualifying patient visit was booked as of the visit date (MOR metric #9). Same definition as the provider bonus NEXT_VISIT metric."
      - name: has_future_awv_scheduled
        data_type: boolean
        description: "End-of-visit AWV flag — a future AWV was booked as of the visit date within the 395-day window (MOR metric #11). Same definition as the provider bonus AWV metric."
      - name: next_qualifying_visit_date
        data_type: date
        description: "Earliest future qualifying patient visit booked as of the visit date (same definition as has_next_visit_scheduled). NULL when none scheduled."
      - name: days_to_next_visit
        data_type: int
        description: "DATEDIFF(next_qualifying_visit_date, appointment_date); NULL when no next visit scheduled."
      - name: tier_threshold_days
        data_type: int
        description: "Tier cadence threshold in days: Highly Complex 23 / High 45 / Rising 68 / else 182 (visit on/after 2026-04-13) or 274."
      - name: was_completed_on_cadence
        data_type: boolean
        description: "MOR metric #10 — next qualifying visit booked within tier_threshold_days of the visit. Strict subset of has_next_visit_scheduled."
      - name: qualifying_visit_aid
        data_type: bigint
        description: "Scope column: appointment_id for every qualifying completed visit (denominator for #9 and #10). Used by metric() for count_distinct."
      - name: next_visit_scheduled_aid
        data_type: bigint
        description: "Scope column: appointment_id when has_next_visit_scheduled, NULL otherwise."
      - name: medicare_visit_aid
        data_type: bigint
        description: "Scope column: appointment_id when is_visit_medicare (denominator for #11), NULL otherwise."
      - name: awv_scheduled_aid
        data_type: bigint
        description: "Scope column: appointment_id when Medicare visit AND has_future_awv_scheduled, NULL otherwise."
      - name: on_cadence_aid
        data_type: bigint
        description: "Scope column: appointment_id when was_completed_on_cadence, NULL otherwise."
      - name: source_updated_at
        data_type: timestamp
        description: "CDF watermark — max(patients last_updated_at, appointment_date)."

  - name: mart_raf_patient_score
    description: >
      RAF patient score (CMS-HCC V28 payment RAF). Grain: one row per
      patient_id x payment_year. Source: fct_raf__patient_summary. Powers RAF
      score reporting (raw vs payment RAF, component breakdown, demographic-only,
      MSSP carve-out). ServingDB SNAPSHOT mirror.
    config:
      contract:
        enforced: false # contract deferred: column data_types not yet verified for enforcement
      meta:
        cube: true
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced", "raf"]
    columns:
      - name: mart_raf_patient_score_id
        data_type: string
        description: "Surrogate PK — MD5(patient_id|payment_year). Required by servingdb_sync.py for synced-table registration."
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null
      - name: patient_id
        data_type: int
        description: "Athena patient id."
      - name: payment_year
        data_type: int
        description: "CMS payment year."
      - name: payment_raf_score
        data_type: decimal(18,4)
        description: "Normalized, coding-intensity-adjusted payment RAF."
      - name: raw_raf_score
        data_type: decimal(18,4)
        description: "Raw RAF before normalization / coding intensity."
      - name: is_demographic_only
        data_type: boolean
        description: "True when score has no disease/interaction/count contribution."

  - name: mart_raf_member_revenue
    description: >
      Financial RAF member revenue (projected vs CMS-paid). Grain: one row per
      patient_id x payment_year x payor x company. Source: fct_raf__member_revenue
      (reference Financial RAF model). Powers Medical Spend / revenue reporting:
      projected vs paid MA revenue, RAF yield PMPM, revenue variance. ServingDB
      SNAPSHOT mirror.
    config:
      contract:
        enforced: false # contract deferred: column data_types not yet verified for enforcement
      meta:
        cube: true
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced", "raf", "finraf"]
    columns:
      - name: mart_raf_member_revenue_id
        data_type: string
        description: "Surrogate PK — MD5(patient_id|payment_year|payor|company). Required by servingdb_sync.py for synced-table registration."
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null
      - name: patient_id
        data_type: string
        description: >
          Athena patient id when the member resolves to an Athena patient, else
          the immutable EMPI identity_id (H-number) for ghosts (paid-only, no
          our_payment_raf). See projection_basis.
        # Athena relationships check on the numeric subset lives in the singular test
        # tests/empi/test_spend_numeric_patient_ids_resolve.sql (non-numeric
        # identity_ids are non-Athena by design and cannot be cast to a patients() FK).
      - name: payment_year
        data_type: int
        description: "CMS payment year."
      - name: payor
        data_type: string
        description: "Payor (e.g. PAYOR_A, PAYOR_B)."
      - name: company
        data_type: string
        description: >
          Company book the member's paid dollars belong to ('Healthcare Org' or
          'VendorBlue'). Part of the grain so finance can split the PAYOR_B book.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Healthcare Org', 'VendorBlue']
      - name: projection_basis
        data_type: string
        description: >
          Which RAF factor drove projected_annual_revenue: 'OUR_RAF' (we scored
          the member), 'CMS_PAID_RAF' (no clinical data — VendorBlue ghost /
          unmatched — fell back to the payor's CMS-paid RAF so variance measures
          yield only), or 'NONE' (neither factor; projection is null and the row
          is surfaced, not silently nulled).
        tests:
          - accepted_values:
              arguments:
                values: ['OUR_RAF', 'CMS_PAID_RAF', 'NONE']
      - name: projected_annual_revenue
        data_type: decimal(18,2)
        description: "county_benchmark_pmpm x projection_factor x member_months, where projection_factor = coalesce(our_payment_raf, cms_paid_raf)."
      - name: paid_total_revenue
        data_type: decimal(18,2)
        description: "Actual CMS-paid revenue from the payor file."
      - name: revenue_variance
        data_type: decimal(18,2)
        description: "paid_total_revenue - projected_annual_revenue (uses projection_factor so VendorBlue rows measure yield vs the payor score)."

  - name: mart_raf_revenue_at_risk
    description: >
      Financial RAF revenue at risk (capture -> revenue bridge). Grain: one row
      per hcc_code x target_year. Source: rpt_finraf__revenue_at_risk. Monetizes
      open / un-recaptured HCC gaps (annual dollars at risk + actionable
      recapturable subset). Powers Medical Spend recapture reporting. ServingDB
      SNAPSHOT mirror.
    config:
      contract:
        enforced: false # contract deferred: column data_types not yet verified for enforcement
      meta:
        cube: true
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced", "raf", "finraf"]
    columns:
      - name: mart_raf_revenue_at_risk_id
        data_type: string
        description: "Surrogate PK — MD5(hcc_code|target_year). Required by servingdb_sync.py for synced-table registration."
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null
      - name: hcc_code
        data_type: string
        description: "CMS-HCC code."
      - name: target_year
        data_type: int
        description: "Payment / target year."
      - name: annual_dollars_at_risk
        data_type: decimal(18,2)
        description: "at_risk_raf_impact x blended_benchmark_pmpm x 12."
      - name: recapturable_dollars
        data_type: decimal(18,2)
        description: "Actionable subset (PENDING + NOT_YET_SEEN) monetized."

  - name: mart_medical_spending
    description: >
      Medical spending P&L, month over month. Grain: one row per payor x
      service_month. Source: fct_spend__patient_month (PAYOR_A + PAYOR_B). Published
      finance/actuarial surface (reference Financial RAF model) powering the BIPlatform
      BI reports and the Databricks medical-spend dashboard: revenue, paid cost by
      category, MLR, revenue/cost PMPM (total + by category), RAF-normalized cost
      PMPM, and expected (RAF x county benchmark) revenue + gap. ServingDB SNAPSHOT
      mirror.
    config:
      contract:
        enforced: true # verified: schema confirmed via dbt --empty build; backs a live dashboard
      meta:
        cube: true
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced", "spend", "finance"]
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: ["payor", "service_month"]
    columns:
      - name: mart_medical_spending_id
        data_type: string
        description: "Surrogate PK — MD5(payor|service_month). Required by servingdb_sync.py for synced-table registration."
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null
      - name: payor
        data_type: string
        description: >
          Book the P&L row is computed for: PAYOR_A, PAYOR_B (Healthcare's EMPI-matched
          at-risk lives), or VendorBlue (members on the same PAYOR_B H2001 contract
          attributed to VendorBlue NPIs). VendorBlue members are now carried in the
          EMPI (almost all as ghosts — no Athena patient) like the PAYOR_A members we
          hold no Athena id for, so they flow through fct_spend as PAYOR_B identities
          and are relabeled to 'VendorBlue' here via int_spend__uhc_identity_book —
          one deduped source, no double-count. RAF / expected-revenue columns are
          NULL for ghost (VendorBlue) lives.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PAYOR_A', 'PAYOR_B', 'VendorBlue']
      - name: service_month
        data_type: date
        description: "First-of-month date of the spend month."
        tests: [not_null]
      - name: payment_year
        data_type: int
        description: "Calendar payment year of the spend month."
      - name: members
        data_type: bigint
        description: "Distinct members with a PAID member-month (PMPM denominator population)."
      - name: member_months
        data_type: bigint
        description: "Paid member-months in the period (PMPM denominator)."
      - name: revenue_total
        data_type: decimal(18,2)
        description: "Total CMS-paid MA revenue (PAYOR_A tot_ma_pmt / PAYOR_B gross_revenue)."
      - name: total_cost
        data_type: decimal(18,2)
        description: "Total paid claim cost (GROSS, includes claim-only months so real cost is never dropped). Numerator for the headline MLR."
      - name: cost_part_d
        data_type: decimal(18,2)
        description: "TRUE Part D pharmacy paid (rx_part_d_indicator='Y'); ~$0 today. The only cost netted out for the ex-Part-D MLR."
      - name: total_cost_plan_liability
        data_type: decimal(18,2)
        description: "Paid cost net of TRUE Part D only (total_cost - cost_part_d). Equals gross today; the medical feed's pharmacy is Part B (plan liability)."
      - name: is_revenue_complete
        data_type: boolean
        description: "TRUE when the month's base CMS capitation is present (positive revenue and paid members not outnumbered by cost-only members). FALSE = missing-MMR month; MLR/PMPM not meaningful."
      - name: is_month_mature
        data_type: boolean
        description: "FALSE for recent service months whose claims have not run out (no IBNR completion factor); cost/MLR understated."
      - name: is_month_reportable
        data_type: boolean
        description: "TRUE only when revenue is complete AND claims are mature — the single flag the dashboard keys its data-quality indicator off."
      - name: spend_completeness_status
        data_type: string
        description: "Decision-readiness status: COMPLETE, COST_WITHOUT_REVENUE, CERTIFIED_UNAVAILABLE, or IMMATURE. MLR is populated only for COMPLETE months."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['COMPLETE', 'COST_WITHOUT_REVENUE', 'CERTIFIED_UNAVAILABLE', 'IMMATURE']
      - name: mlr
        data_type: decimal(9,4)
        description: "Headline GROSS medical loss ratio = total_cost / revenue_total (gross is the true MLR; the medical feed's pharmacy is Part B). Null when revenue incomplete."
      - name: mlr_plan_liability
        data_type: decimal(9,4)
        description: "Secondary ex-Part-D MLR = total_cost_plan_liability / revenue_total. Equals gross MLR today (Part D = $0). Null when revenue incomplete."
      - name: revenue_pmpm
        data_type: decimal(18,2)
        description: "Revenue per paid member-month."
      - name: cost_pmpm
        data_type: decimal(18,2)
        description: "Gross paid cost per paid member-month."
      - name: cost_pmpm_plan_liability
        data_type: decimal(18,2)
        description: "Plan-liability paid cost per paid member-month (Part D netted out)."
      - name: risk_adj_cost_pmpm
        data_type: decimal(18,2)
        description: "Cost PMPM normalized to RAF 1.0 (cost_pmpm / avg paid RAF)."
      - name: avg_payment_raf
        data_type: decimal(18,4)
        description: "Simple average paid (payment) RAF over paid member-months for the payor x month row."
      - name: payment_raf_score_sum
        data_type: decimal(18,4)
        description: "Member-month-weighted paid-RAF numerator = SUM(paid RAF * member_months). Numerator for the registered paid_raf measure (divided by SUM(member_months))."
      - name: expected_revenue
        data_type: decimal(18,2)
        description: "RAF x county-benchmark expected revenue over resolved member-months."
      - name: revenue_gap
        data_type: decimal(18,2)
        description: "Actual minus expected revenue over resolved member-months."
      - name: cms_paid_raf_score_sum
        data_type: decimal(18,4)
        description: "Member-month-weighted FINANCIAL paid-RAF numerator = SUM(cms_paid_raf * member_months). cms_paid_raf is the CMS-paid risk factor off the revenue file (present for every paid member-month including VendorBlue), distinct from the claims/HCC-derived payment_raf_score. Numerator for the financial_paid_raf measure (divided by SUM(member_months))."
      - name: expected_revenue_financial
        data_type: decimal(18,2)
        description: "FINANCIAL expected revenue = county benchmark x CMS-paid factor (cms_paid_raf) over member-months where both inputs resolved. Company-splittable (populated for VendorBlue), unlike expected_revenue which uses the Healthcare-only payment_raf_score."
      - name: revenue_gap_financial
        data_type: decimal(18,2)
        description: "Actual minus FINANCIAL expected revenue (cms_paid_raf basis) over resolved member-months."

      - name: claim_only_members
        data_type: bigint
        description: "Members with claims but no paid premium month (completeness gap counter)."
      - name: revenue_part_a
        data_type: double
        description: "CMS Part A revenue component."
      - name: revenue_part_b
        data_type: double
        description: "CMS Part B revenue component."
      - name: cost_inpatient
        data_type: decimal(34,2)
        description: "Paid claim cost, inpatient category."
      - name: cost_outpatient
        data_type: decimal(34,2)
        description: "Paid claim cost, outpatient category."
      - name: cost_emergency
        data_type: decimal(34,2)
        description: "Paid claim cost, emergency category."
      - name: cost_professional
        data_type: decimal(34,2)
        description: "Paid claim cost, professional category."
      - name: cost_pharmacy
        data_type: decimal(34,2)
        description: "Paid claim cost, pharmacy category (Part B + any Part D)."
      - name: cost_post_acute
        data_type: decimal(34,2)
        description: "Paid claim cost, post-acute category."
      - name: cost_other
        data_type: decimal(34,2)
        description: "Paid claim cost, other/uncategorized."
      - name: claim_line_count
        data_type: bigint
        description: "Count of paid claim lines in the month."
      - name: inpatient_pmpm
        data_type: decimal(35,2)
        description: "Inpatient paid cost PMPM."
      - name: outpatient_pmpm
        data_type: decimal(35,2)
        description: "Outpatient paid cost PMPM."
      - name: emergency_pmpm
        data_type: decimal(35,2)
        description: "Emergency paid cost PMPM."
      - name: professional_pmpm
        data_type: decimal(35,2)
        description: "Professional paid cost PMPM."
      - name: pharmacy_pmpm
        data_type: decimal(35,2)
        description: "Pharmacy paid cost PMPM."
      - name: post_acute_pmpm
        data_type: decimal(35,2)
        description: "Post-acute paid cost PMPM."
      - name: other_pmpm
        data_type: decimal(35,2)
        description: "Other paid cost PMPM."
      - name: last_synced_at
        data_type: timestamp
        description: "ServingDB sync watermark (UTC) set by the synced-table writer."
  - name: mart_uhc_settlement
    description: >
      PAYOR_B H2001 shared-risk SETTLEMENT (BCR), one row per statement release. The
      contract settlement headline on the Medical Spending P&L "PAYOR_B" tab: actual
      BCR vs the 85% budget target, CMS revenue, total RECOGNIZED medical cost
      (includes an IBNR reserve — so this reads higher than the paid-claims loss
      ratio on the same page), provider surplus/deficit share, PMPM, member-months
      (cumulative YTD), and the medical-cost composition (inpatient / outpatient /
      physician / ancillary / IBNR / admin). Source: int_spend__uhc_settlement
      (the statement 'Total' rollup). This is the FULL contract (Healthcare's
      risk-share view, which already includes VendorBlue members' costs — PAYOR_B
      settles the BCR on the combined population), so it is NOT split by company
      and does not respond to the dashboard's Company filter. Grain: one row per
      release_month. ServingDB SNAPSHOT mirror.
    config:
      contract:
        enforced: true # types locked with explicit casts in SQL (__contract_typed)
      meta:
        cube: true
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced", "spend", "finance", "PAYOR_B", "settlement"]
    columns:
      - name: uhc_settlement_id
        data_type: string
        description: "Surrogate key — the release_month rendered as a string (one row per release)."
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null
      - name: release_month
        data_type: date
        description: "First-of-month date of the settlement statement release (members are cumulative YTD; latest release = year-to-date)."
        tests:
          - not_null
      - name: actual_bcr
        data_type: decimal(9,4)
        description: "Actual benefit-cost ratio = recognized total medical cost / revenue to be allocated (e.g. 0.8813 = 88.1%)."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 3
      - name: bcr_target
        data_type: decimal(9,4)
        description: "Contract BCR budget target (0.85 = 85%)."
      - name: provider_risk_share
        data_type: decimal(9,4)
        description: "Healthcare's share of contract surplus/deficit (0.75 = 75%)."
      - name: cms_revenue
        data_type: decimal(18,2)
        description: "CMS revenue for the contract year (cumulative YTD)."
      - name: revenue_allocated
        data_type: decimal(18,2)
        description: "Revenue to be allocated (BCR denominator)."
      - name: total_medical_cost
        data_type: decimal(18,2)
        description: "Total RECOGNIZED medical cost, includes the IBNR reserve (BCR numerator)."
      - name: member_months
        data_type: bigint
        description: "Member-months on the contract (cumulative YTD)."
      - name: provider_share_amount
        data_type: decimal(18,2)
        description: "Provider surplus (+) / deficit (-) share dollars (Healthcare's 75% of surplus/deficit)."
      - name: revenue_pmpm
        data_type: decimal(18,2)
        description: "CMS revenue per member-month (cms_revenue / member_months)."
      - name: cost_pmpm
        data_type: decimal(18,2)
        description: "Recognized medical cost per member-month (total_medical_cost / member_months)."
      - name: ibnr_share
        data_type: decimal(9,4)
        description: "IBNR reserve as a share of total recognized medical cost (cost_ibnr / total_medical_cost)."
      - name: cost_inpatient
        data_type: decimal(18,2)
        description: "Recognized inpatient claims cost."
      - name: cost_outpatient
        data_type: decimal(18,2)
        description: "Recognized outpatient claims cost."
      - name: cost_physician
        data_type: decimal(18,2)
        description: "Recognized physician claims cost."
      - name: cost_ancillary
        data_type: decimal(18,2)
        description: "Recognized ancillary capitation cost."
      - name: cost_other_capitation
        data_type: decimal(18,2)
        description: "Recognized other capitation cost."
      - name: cost_ibnr
        data_type: decimal(18,2)
        description: "IBNR reserve (incurred-but-not-reported estimate, not paid claims)."
      - name: cost_admin_assessment
        data_type: decimal(18,2)
        description: "Recognized admin / assessment cost (Vatica, Synapse, ACO program support, advancements, home assessments, COI)."
      - name: last_synced_at
        data_type: timestamp
        description: "ServingDB sync watermark (UTC) set by the synced-table writer."
  - name: mart_uhc_settlement_by_company
    description: >
      PAYOR_B H2001 settlement DECOMPOSED by company, one row per
      (release_month, company) with company in {Healthcare Org, VendorBlue, Both}.
      Lets the Medical Spending P&L "PAYOR_B" tab's Company filter scope the
      settlement headline; the 'Both' rows reproduce the full-contract settlement
      and tie to mart_uhc_settlement / the statement Total row
      (assert_uhc_settlement_company_split_reconciles). IMPORTANT: the PAYOR_B BCR is
      contractually settled on the COMBINED population, so the per-company
      actual_bcr / provider-share are an INFORMATIONAL decomposition (actual_bcr
      derived = recognized cost / revenue allocated), not separately-settled
      figures. Cost is RECOGNIZED (includes IBNR). Source:
      int_spend__uhc_settlement_by_company. Grain: one row per
      (release_month, company). ServingDB SNAPSHOT mirror.
    config:
      contract:
        enforced: true # types locked with explicit casts in SQL (__contract_typed)
      meta:
        cube: true
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced", "spend", "finance", "PAYOR_B", "settlement", "VendorBlue"]
    columns:
      - name: uhc_settlement_company_id
        data_type: string
        description: "Surrogate key — release_month and company concatenated ('<date>|<company>')."
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null
      - name: release_month
        data_type: date
        description: "First-of-month date of the settlement statement release (members cumulative YTD; latest release = year-to-date)."
        tests:
          - not_null
      - name: company
        data_type: string
        description: "'Healthcare Org', 'VendorBlue', or 'Both' (the full-contract rollup)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Healthcare Org", "VendorBlue", "Both", "Unmapped"]
      - name: actual_bcr
        data_type: decimal(9,4)
        description: "Derived benefit-cost ratio for the slice = recognized total medical cost / revenue to be allocated (informational decomposition for non-Both rows)."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 3
      - name: bcr_target
        data_type: decimal(9,4)
        description: "Contract BCR budget target (0.85 = 85%)."
      - name: provider_risk_share
        data_type: decimal(9,4)
        description: "Healthcare's share of contract surplus/deficit (0.75 = 75%)."
      - name: cms_revenue
        data_type: decimal(18,2)
        description: "CMS revenue for the slice (cumulative YTD)."
      - name: revenue_allocated
        data_type: decimal(18,2)
        description: "Revenue to be allocated for the slice (BCR denominator)."
      - name: total_medical_cost
        data_type: decimal(18,2)
        description: "Total RECOGNIZED medical cost for the slice, includes the IBNR reserve (BCR numerator)."
      - name: member_months
        data_type: bigint
        description: "Member-months for the slice (cumulative YTD)."
      - name: provider_share_amount
        data_type: decimal(18,2)
        description: "Provider surplus (+) / deficit (-) share dollars for the slice."
      - name: pcp_count
        data_type: bigint
        description: "Number of PCP detail rows rolled into the slice."
      - name: revenue_pmpm
        data_type: decimal(18,2)
        description: "CMS revenue per member-month (cms_revenue / member_months)."
      - name: cost_pmpm
        data_type: decimal(18,2)
        description: "Recognized medical cost per member-month (total_medical_cost / member_months)."
      - name: ibnr_share
        data_type: decimal(9,4)
        description: "IBNR reserve as a share of total recognized medical cost (cost_ibnr / total_medical_cost)."
      - name: cost_inpatient
        data_type: decimal(18,2)
        description: "Recognized inpatient claims cost for the slice."
      - name: cost_outpatient
        data_type: decimal(18,2)
        description: "Recognized outpatient claims cost for the slice."
      - name: cost_physician
        data_type: decimal(18,2)
        description: "Recognized physician claims cost for the slice."
      - name: cost_ancillary
        data_type: decimal(18,2)
        description: "Recognized ancillary capitation cost for the slice."
      - name: cost_other_capitation
        data_type: decimal(18,2)
        description: "Recognized other capitation cost for the slice."
      - name: cost_ibnr
        data_type: decimal(18,2)
        description: "IBNR reserve (incurred-but-not-reported estimate, not paid claims) for the slice."
      - name: cost_admin_assessment
        data_type: decimal(18,2)
        description: "Recognized admin / assessment cost (Vatica, Synapse, ACO program support, advancements, home assessments, COI) for the slice."
      - name: last_synced_at
        data_type: timestamp
        description: "ServingDB sync watermark (UTC) set by the synced-table writer."
  - name: mart_payor_alpha_settlement
    description: >
      PAYOR_A MN Medicare Advantage ACTUALS (paid loss ratio), one row per roster
      snapshot. The PAYOR_A counterpart to mart_uhc_settlement backing the Medical
      Spending P&L "PAYOR_A" tab. ACTUALS-ONLY: PAYOR_A delivers no settlement statement,
      so actual_bcr is a PAID loss ratio (medical_paid / cms_revenue, NO IBNR — it
      reads LOWER than PAYOR_B's recognized BCR), and the contracted terms (bcr_target /
      provider_risk_share / provider_share_amount / net_settlement / IBNR) are NULL
      by design (surfaced on the dashboard as "pending Finance", never zero-filled).
      Source: int_spend__payor_alpha_settlement (Healthcare-attributed MA PPO panel,
      trailing-12 cumulative per snapshot). Plain CDF-enabled Delta table (inherits
      delta.enableChangeDataFeed=true from project default); NOT ServingDB-synced.
      Grain: one row per release_month.
    config:
      contract:
        enforced: true # types locked with explicit casts in SQL (__contract_typed)
      meta:
        cube: true
      tags: ["marts_bi_v3", "cube", "spend", "finance", "PAYOR_A", "settlement"]
    columns:
      - name: payor_alpha_settlement_id
        data_type: string
        description: "Surrogate key — the release_month rendered as a string (one row per release)."
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null
      - name: release_month
        data_type: date
        description: "First-of-month date of the roster snapshot (trailing-12 cumulative)."
        tests:
          - not_null
      - name: actual_bcr
        data_type: decimal(9,4)
        description: "PAID loss ratio = paid medical cost / CMS revenue (NO IBNR; reads lower than a recognized BCR)."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 3
      - name: bcr_target
        data_type: decimal(9,4)
        description: "Contracted BCR target — NULL (not contracted; pending Finance)."
      - name: provider_risk_share
        data_type: decimal(9,4)
        description: "Provider risk-share — NULL (not contracted; pending Finance)."
      - name: cms_revenue
        data_type: decimal(18,2)
        description: "CMS revenue (trailing-12 cumulative)."
      - name: total_medical_cost
        data_type: decimal(18,2)
        description: "Total PAID medical cost (no IBNR reserve)."
      - name: member_months
        data_type: bigint
        description: "Member-months on the panel (trailing-12 cumulative)."
      - name: provider_share_amount
        data_type: decimal(18,2)
        description: "Provider surplus/deficit share — NULL (no settlement)."
      - name: net_settlement
        data_type: decimal(18,2)
        description: "Net settlement dollars — NULL (no settlement)."
      - name: revenue_pmpm
        data_type: decimal(18,2)
        description: "CMS revenue per member-month."
      - name: cost_pmpm
        data_type: decimal(18,2)
        description: "Paid medical cost per member-month."
      - name: cost_ibnr
        data_type: decimal(18,2)
        description: "IBNR reserve — NULL (paid-only, no reserve in feed)."
      - name: ibnr_share
        data_type: decimal(9,4)
        description: "IBNR share — NULL (paid-only)."
      - name: cost_inpatient
        data_type: decimal(18,2)
        description: "Paid inpatient claims."
      - name: cost_outpatient
        data_type: decimal(18,2)
        description: "Paid outpatient claims."
      - name: cost_professional
        data_type: decimal(18,2)
        description: "Paid professional claims."
      - name: cost_rx
        data_type: decimal(18,2)
        description: "Paid pharmacy claims."
      - name: terms_source
        data_type: string
        description: "Provenance flag (derived_actuals_only:stg_payor__payor_alpha_members)."
      - name: last_synced_at
        data_type: timestamp
        description: "Build watermark (UTC) set at table build."
  - name: mart_uhc_diagnosis_by_company
    description: >
      PAYOR_B H2001 paid cost by PRIMARY diagnosis, split by company (Healthcare Org
      vs VendorBlue). Backs the "Top Primary Diagnoses by Company" tables on the
      Medical Spending P&L "PAYOR_B" page — the clinical drivers behind each book's
      paid cost and the IBNR reserve. Source: int_spend__uhc_diagnosis_by_company
      (PAYOR_B claim feed, latest cumulative release, H2001 contract period 2026-01-01+;
      company is the member's EMPI-identity book via int_spend__uhc_identity_book —
      'VendorBlue' = pure-VendorBlue identity, 'Healthcare Org' = any other PAYOR_B
      identity (Athena-matched or ghost) — the same split as the rest of the page so
      the tables reconcile). AGGREGATE only — no patient/member/claim
      identifier is exposed. The diagnosis text is PAYOR_B's own
      diagnosis_1_description as delivered, which masks 42 CFR Part 2 substance-use
      records as 'RESTRICTED INFORMATION'. Grain: one row per company x
      service_month x primary diagnosis. ServingDB SNAPSHOT mirror.
    config:
      contract:
        enforced: true # types locked with explicit casts in SQL (__contract_typed)
      meta:
        cube: true
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced", "spend", "finance", "PAYOR_B", "VendorBlue", "diagnosis"]
    columns:
      - name: mart_uhc_diagnosis_by_company_id
        data_type: string
        description: "Surrogate PK = md5(company|service_month|diagnosis_code|diagnosis_description). Required by servingdb_sync.py."
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null
      - name: company
        data_type: string
        description: "Contract book the member is attributed to: 'Healthcare Org' or 'VendorBlue' (from the PAYOR_B roster attribution TIN)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Healthcare Org", "VendorBlue"]
      - name: service_month
        data_type: date
        description: "First-of-month date of the claim service date (H2001 contract period, 2026-01-01+)."
        tests:
          - not_null
      - name: diagnosis_code
        data_type: string
        description: "Primary diagnosis code (ICD-10) from diagnosis_code_1; null when PAYOR_B delivered no code."
      - name: diagnosis_description
        data_type: string
        description: "Primary diagnosis text from PAYOR_B's diagnosis_1_description, as delivered. 42 CFR Part 2 substance-use records arrive masked as 'RESTRICTED INFORMATION'; blank descriptions are labeled 'UNCODED'."
        tests:
          - not_null
      - name: paid_amount
        data_type: decimal(18,2)
        description: "Sum of plan_paid_amount for the slice (reversal rows retained so the sum nets)."
      - name: claim_count
        data_type: bigint
        description: "Distinct paid-claim count (claim_audit_number) in the slice."
      - name: last_synced_at
        data_type: timestamp
        description: "ServingDB sync watermark (UTC) set by the synced-table writer."
  - name: mart_medical_spending_by_provider
    description: >
      Medical spending P&L by attributed provider, month over month. Grain: one
      row per payor x provider_id x service_month. Source:
      fct_spend__patient_month joined to the conformed `providers` dimension.
      Crosswalks payer claims + CMS revenue to the provider panel: panel size,
      revenue, paid cost (gross + plan-liability), blended MLR, paid RAF. Monthly
      grain so dashboard payor + date filters apply and rate measures
      re-aggregate as SUM(num)/SUM(denom). ServingDB SNAPSHOT mirror.
    config:
      contract:
        enforced: true # verified: schema confirmed via dbt --empty build; backs a live dashboard
      meta:
        cube: true
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced", "spend", "finance"]
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: ["payor", "provider_id", "service_month"]
    columns:
      - name: mart_medical_spending_by_provider_id
        data_type: string
        description: "Surrogate PK — MD5(payor|provider_id|service_month). Required by servingdb_sync.py."
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null
      - name: payor
        data_type: string
        description: "Payor the P&L row is computed for (PAYOR_A or PAYOR_B)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PAYOR_A', 'PAYOR_B']
      - name: provider_id
        data_type: bigint
        description: "Athena provider_id of the attributed provider (may be null/unattributed)."
      - name: provider_name
        data_type: string
        description: "Provider display name from the providers dimension ('Unattributed / Unknown' when no match)."
      - name: specialty
        data_type: string
        description: "Provider specialty from the providers dimension."
      - name: clinic_standardized
        data_type: string
        description: "Standardized clinic/site assignment from the providers dimension."
      - name: provider_group_name
        data_type: string
        description: "Provider group name from the providers dimension."
      - name: type_category
        data_type: string
        description: "MD/DO vs APP classification."
      - name: provider_is_active
        data_type: boolean
        description: "Whether the provider is currently active per MDM."
      - name: service_month
        data_type: date
        description: "First-of-month date of the spend month."
        tests: [not_null]
      - name: payment_year
        data_type: int
        description: "Calendar payment year of the spend month."
      - name: panel_members
        data_type: bigint
        description: "Distinct attributed members with a PAID member-month that month (panel size)."
      - name: member_months
        data_type: bigint
        description: "Paid member-months in the period (PMPM / rate denominator)."
      - name: claim_only_members
        data_type: bigint
        description: "Distinct members with cost but no paid premium record (MLR completeness guard)."
      - name: revenue_total
        data_type: decimal(18,2)
        description: "Total CMS-paid MA revenue attributed to the provider's panel."
      - name: total_cost
        data_type: decimal(18,2)
        description: "Total paid claim cost for the provider's panel (includes claim-only months)."
      - name: total_cost_plan_liability
        data_type: decimal(18,2)
        description: "Paid cost net of Part D pharmacy. Numerator for plan-liability MLR / cost PMPM."
      - name: claim_line_count
        data_type: bigint
        description: "Paid claim lines for the provider's panel."
      - name: is_revenue_complete
        data_type: boolean
        description: "TRUE when the month's base CMS capitation is present for the panel; FALSE = missing-MMR month (cost landed, premium did not)."
      - name: is_month_mature
        data_type: boolean
        description: "FALSE for recent service months whose claims have not run out (no IBNR completion factor); cost/MLR understated."
      - name: is_month_reportable
        data_type: boolean
        description: "TRUE only when revenue is complete AND claims are mature — same gate as mart_medical_spending / headline P&L KPIs."
      - name: mlr
        data_type: decimal(9,4)
        description: "Headline GROSS blended MLR = total_cost / revenue_total (gross is the true MLR). Null when revenue incomplete."
      - name: mlr_plan_liability
        data_type: decimal(9,4)
        description: "Secondary ex-Part-D blended MLR = total_cost_plan_liability / revenue_total. Equals gross today (Part D = $0)."
      - name: revenue_pmpm
        data_type: decimal(18,2)
        description: "Revenue per paid member-month."
      - name: cost_pmpm
        data_type: decimal(18,2)
        description: "Gross paid cost per paid member-month."
      - name: cost_pmpm_plan_liability
        data_type: decimal(18,2)
        description: "Plan-liability paid cost per paid member-month."
      - name: avg_payment_raf
        data_type: decimal(18,4)
        description: "Simple average paid RAF over paid member-months."
      - name: payment_raf_score_sum
        data_type: decimal(18,4)
        description: "Member-month-weighted paid-RAF numerator = SUM(paid RAF * member_months). Numerator for the provider_paid_raf measure (divided by SUM(member_months))."

      - name: last_synced_at
        data_type: timestamp
        description: "ServingDB sync watermark (UTC) set by the synced-table writer."
  - name: mart_pharmacy_spend
    description: >
      Pharmacy spend breakdown for plan-liability validation. Decomposes the
      cost_pharmacy bucket so the "pharmacy = Part D = not our risk" assumption is
      validated against real data. Grain: one row per payor x service_month x
      part_d_indicator x pharmacy_category x drug_class_description. Source:
      int_spend__claims_detail pharmacy lines (PAYOR_A only; PAYOR_B has no Rx feed). Part D
      ('Y') is the PBM / Part D sponsor's liability (paid $0 in our feed); non-Part-D
      paid pharmacy is Part B / medical (vaccines, CGM & diabetic supplies as DME,
      nebulizer drugs) and IS the MA plan's liability. ServingDB SNAPSHOT mirror.
    config:
      contract:
        enforced: true # verified: schema confirmed via dbt --empty build; backs a live dashboard
      meta:
        cube: true
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced", "spend", "finance", "pharmacy"]
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: ["payor", "service_month", "part_d_indicator", "pharmacy_category", "drug_class_description"]
    columns:
      - name: mart_pharmacy_spend_id
        data_type: string
        description: "Surrogate PK — MD5(payor|service_month|part_d_indicator|pharmacy_category|drug_class_description). Required by servingdb_sync.py."
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null
      - name: payor
        data_type: string
        description: "Payor the pharmacy line belongs to (PAYOR_A today; PAYOR_B supplies no Rx feed)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PAYOR_A', 'PAYOR_B']
      - name: service_month
        data_type: date
        description: "First-of-month date of the incurred service month."
        tests: [not_null]
      - name: payment_year
        data_type: int
        description: "Calendar payment year of the service month."
      - name: part_d_indicator
        data_type: string
        description: "Part D adjudication flag: 'Y' = Part D (PBM/sponsor pays), 'N' = not Part D (Part B/medical), 'Unknown' = missing flag."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Y', 'N', 'Unknown']
      - name: pharmacy_category
        data_type: string
        description: "Coarse clinical category from the payer drug-class grouping: Vaccine, Device & supply (DME), or Drug."
        tests:
          - accepted_values:
              arguments:
                values: ['Vaccine', 'Device & supply (DME)', 'Drug']
      - name: drug_class_description
        data_type: string
        description: "Payer drug-class description ('Unclassified' when the feed omits it)."
      - name: plan_responsibility
        data_type: string
        description: "Derived liability label: Part D (carved out), Part B / medical (plan liability), or Unknown - needs review."
      - name: is_plan_liability
        data_type: boolean
        description: "TRUE when the spend is the MA plan's liability (non-Part-D). FALSE for Part D."
      - name: claim_line_count
        data_type: bigint
        description: "Paid pharmacy claim lines in the group."
      - name: member_count
        data_type: bigint
        description: "Distinct patients with a pharmacy line in the group (re-aggregates only within the same group; not additive across categories)."
      - name: paid_amount
        data_type: decimal(18,2)
        description: "Total plan-paid pharmacy dollars in the group (gross)."
      - name: paid_amount_plan_liability
        data_type: decimal(18,2)
        description: "Plan-paid dollars that are the plan's liability (non-Part-D / Part B & medical)."
      - name: paid_amount_part_d
        data_type: decimal(18,2)
        description: "Plan-paid dollars adjudicated under Part D (expected ~0 — the Part D sponsor pays)."
      - name: is_revenue_complete
        data_type: boolean
        description: "Inherited from mart_medical_spending at (payor, service_month). TRUE when book-level CMS capitation is present."
      - name: is_month_mature
        data_type: boolean
        description: "Inherited from mart_medical_spending. FALSE for recent service months whose claims have not run out."
      - name: is_month_reportable
        data_type: boolean
        description: "Inherited from mart_medical_spending. TRUE only when book revenue is complete AND claims are mature."

      - name: last_synced_at
        data_type: timestamp
        description: "ServingDB sync watermark (UTC) set by the synced-table writer."
  - name: mart_medical_spending_by_specialty
    description: >
      Medical spend by specialty / service category, month over month (the cost
      breakdown reference reviews: specialty, inpatient, professional). Grain: one
      row per payor x service_month x service_category x provider_specialty x
      network_status.
      Source: int_spend__claims_detail (PAYOR_A + PAYOR_B line-level paid cost), with the
      pure-VendorBlue PAYOR_B identities relabeled to payor='VendorBlue' via
      int_spend__uhc_identity_book (VendorBlue members are now EMPI identities, so
      their claims already flow through claims_detail under PAYOR_B — one deduped
      source, no double-count). Cost only (no revenue at the specialty grain).
      ServingDB SNAPSHOT mirror.
    config:
      contract:
        enforced: true # verified: schema confirmed via dbt --empty build; backs a live dashboard
      meta:
        cube: true
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced", "spend", "finance"]
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: ["payor", "service_month", "service_category", "provider_specialty", "network_status"]
    columns:
      - name: mart_medical_spending_by_specialty_id
        data_type: string
        description: "Surrogate PK — MD5(payor|service_month|service_category|provider_specialty|network_status). Required by servingdb_sync.py."
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null
      - name: payor
        data_type: string
        description: "Payor (PAYOR_A, PAYOR_B, or VendorBlue — VendorBlue is the pure-VendorBlue EMPI-identity book of the same PAYOR_B H2001 contract, relabeled from PAYOR_B via int_spend__uhc_identity_book)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PAYOR_A', 'PAYOR_B', 'VendorBlue']
      - name: service_month
        data_type: date
        description: "First-of-month date of the spend month."
        tests: [not_null]
      - name: payment_year
        data_type: int
        description: "Calendar year of the spend month."
      - name: service_category
        data_type: string
        description: "Clinical service category (inpatient/outpatient/emergency/professional/pharmacy/post_acute/other)."
        tests: [not_null]
      - name: spend_bucket
        data_type: string
        description: "Display bucket for the risk-review framing (Inpatient/Professional/Outpatient/Emergency/Post-Acute/Pharmacy/Other)."
      - name: provider_specialty
        data_type: string
        description: "Servicing-provider specialty ('Unknown' when not supplied). The misleading PAYOR_B 'HOSPITAL NON-PAR OUT OF AREA HOSPITAL' bucket is renamed to 'Hospital (Facility)' — network status is carried separately in network_status, not inferred from this label."
      - name: network_status
        data_type: string
