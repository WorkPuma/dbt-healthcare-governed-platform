  # ─────────────────────────────────────────────────────────────────
  # mart_imaging  (grain: record_type | event_id | modality)
  # ─────────────────────────────────────────────────────────────────
  - name: mart_imaging
    description: >
      Imaging mart for Mammogram, DEXA, and Body Comp across Healthcare Org
      onsite clinics (Highland Park, Lyndale, Rosedale, Eagan). Each row is
      one imaging "event": a capacity slot, an imaging ORDER document, or
      an IMAGINGRESULT document. 504 (Mammo & DEXA) combined slots fan out
      to two rows so per-modality COUNT(DISTINCT slot_aid) is accurate.
      MDM-compliant — confirmed test/deleted patients are excluded.
      Powers the V3 Imaging Capacity / Utilization / Orders / Results
      dashboard.
    config:
      contract:
        enforced: true
      meta:
        cube: true
        # TRIGGERED — converted 2026-05-25. Each upstream subquery (slots,
        # orders, results) is filtered by APPOINTMENTLASTMODIFIEDDATETIME /
        # LASTUPDATED >= max(this.source_updated_at) - 7 days on incremental
        # runs. The 504 fan-out is preserved because both fanned rows share
        # the same source_modified_at and merge on (record_type, event_id,
        # modality) via the MD5 surrogate PK. Full-refresh is the recovery
        # path for rows that mutate only via the LEFT JOIN'd MDM patient
        # flags (rare; see SQL header).
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced", "imaging"]
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]

    columns:
      - name: mart_imaging_id
        data_type: string
        description: "Surrogate PK — MD5(record_type | event_id | modality). Required by servingdb_sync.py."
        constraints:
          - type: not_null
        tests:
          - unique
      - name: record_type
        data_type: string
        description: "Event type: capacity_slot (imaging appointment slot), order (imaging ORDER document), or result (IMAGINGRESULT document)."
        tests:
          - accepted_values:
              arguments:
                values: ["capacity_slot", "order", "result"]
      - name: modality
        data_type: string
        description: "Imaging modality: Mammogram, DEXA, or Body Comp. 504 combined slots fan out to one row per modality."
      - name: imaging_order_type
        data_type: string
        description: "Athena CLINICALORDERTYPE for order/result rows; slot appointment-type-derived label for slots."
      - name: event_date
        data_type: date
        description: "Event date: appointment date for slots, order/result document date otherwise."
      - name: week_start
        data_type: timestamp
        description: "Week bucket of event_date (DATE_TRUNC week)."
      - name: month_start
        data_type: timestamp
        description: "Month bucket of event_date (DATE_TRUNC month)."
      - name: patient_id
        data_type: decimal(12,0)
        description: "Athena patient ID. NULL for open capacity slots. Confirmed test/deleted MDM patients excluded."
      - name: department_id
        data_type: decimal(12,0)
        description: "Athena department of the event. Scope: onsite imaging clinics only (2 Highland Park, 4 Lyndale, 5 Rosedale, 6 Eagan)."
      - name: clinic
        data_type: string
        description: "Department display name of the event's clinic."
      - name: scheduling_provider_id
        data_type: decimal(38,0)
        description: "Athena provider ID who holds the slot (capacity_slot rows only)."
      - name: scheduling_provider
        data_type: string
        description: "Display name (Last, First) of the slot provider."
      - name: ordering_provider_id
        data_type: decimal(38,0)
        description: "Athena provider ID who placed the order (order/result rows)."
      - name: ordering_provider
        data_type: string
        description: "Display name of the ordering provider."
      - name: pcp_department_id
        data_type: decimal(12,0)
        description: "Patient's registration department (PCP home department)."
      - name: pcp_clinic
        data_type: string
        description: "Display name of the patient's PCP home clinic."
      - name: primary_care_provider_id
        data_type: decimal(12,0)
        description: "Patient's PCP (Athena PRIMARYPROVIDERID, current-state)."
      - name: primary_care_provider
        data_type: string
        description: "Display name of the patient's PCP."
      - name: provider_name
        data_type: string
        description: "Unified provider filter column: PCP for capacity slots, ordering provider for orders/results."
      - name: status_raw
        data_type: string
        description: "Raw source status: appointment status for slots, document STATUS for orders/results."
      - name: cancelled_datetime
        data_type: timestamp
        description: "Appointment cancellation timestamp (slots only; NULL for documents)."
      - name: open_int
        data_type: int
        description: "1 when slot is an open slot (capacity_slot rows; 0 otherwise)."
      - name: filled_int
        data_type: int
        description: "1 when slot is filled/scheduled (capacity_slot rows; 0 otherwise)."
      - name: completed_int
        data_type: int
        description: "1 when slot reached a completed status (capacity_slot rows; 0 otherwise)."
      - name: cancelled_int
        data_type: int
        description: "1 when slot was cancelled (capacity_slot rows; 0 otherwise)."
      - name: slot_aid
        data_type: string
        description: "Scope column: appointment_id for capacity_slot rows, NULL otherwise. COUNT(DISTINCT) = total capacity."
      - name: open_slot_aid
        data_type: string
        description: "Scope column: appointment_id for OPEN slots only."
      - name: filled_slot_aid
        data_type: string
        description: "Scope column: appointment_id for FILLED slots only."
      - name: completed_slot_aid
        data_type: string
        description: "Scope column: appointment_id for COMPLETED slots only."
      - name: cancelled_slot_aid
        data_type: string
        description: "Scope column: appointment_id for CANCELLED slots only."
      - name: order_did
        data_type: string
        description: "Scope column: document_id for order rows. COUNT(DISTINCT) = total imaging orders."
      - name: result_did
        data_type: string
        description: "Scope column: document_id for result rows. COUNT(DISTINCT) = total imaging results."
      - name: service_setting
        data_type: string
        description: "Where the imaging was performed (result rows only): 'In-house' (Healthcare Org onsite facility), 'Send-out' (outside radiology center), or 'Unknown facility' (no performing facility on the result). NULL on slot/order rows."
      - name: result_facility
        data_type: string
        description: "Name of the facility that performed the imaging (result rows only), from the result document's clinical provider. NULL on slot/order rows."
      - name: primary_payor
        data_type: string
        description: "Payer name of the patient's primary insurance (sequence 1), from MDM insurance. NULL on open slots."
      - name: primary_carrier
        data_type: string
        description: "Canonical insurance reporting category (e.g. PAYOR_A-MN, Medicare B-MN), falling back to payer name. Used to cut leakage by payor."
      - name: primary_plan_type
        data_type: string
        description: "MDM insurance product type for the patient's primary policy (e.g. Medicare PPO, PPO, Medicare HMO)."
      - name: primary_irc_group
        data_type: string
        description: "MDM insurance reporting-category group for the patient's primary policy."
      - name: sendout_result_did
        data_type: string
        description: "Scope column: document_id for SEND-OUT result rows (performed at an outside facility). COUNT(DISTINCT) = imaging results sent out (leakage)."
      - name: inhouse_result_did
        data_type: string
        description: "Scope column: document_id for IN-HOUSE result rows (performed at a Healthcare Org facility). COUNT(DISTINCT) = in-house imaging results."
      - name: one_slot
        data_type: int
        description: "1 for capacity_slot rows — non-distinct slot totals."
      - name: one_order
        data_type: int
        description: "1 for order rows — non-distinct order totals."
      - name: one_result
        data_type: int
        description: "1 for result rows — non-distinct result totals."
      - name: source_updated_at
        data_type: timestamp
        description: "CDF watermark — COALESCE(source_modified_at, '1900-01-01'). Required by tests/test_cdf_contract_audit.sql for servingdb_sync TRIGGERED models."
  - name: mart_heartwise_zio_patch
    description: >
      Heartwise eligibility / participation crossover with Zio Patch ordering.
      One row per active MDM patient who is either clinically eligible for Heartwise
      (HTN + (DM or CKD) per ICD10 on any encounter), enrolled in Heartwise via the
      athena 'Heartwise for Her' custom demographic, or has any Zio Patch order
      (athena document.clinicalordertype name LIKE 'ZIO%'). Binds to MDM Patient
      (active gate, identity), MDM Appointment Type (last completed visit
      classification), and MDM Insurance (primary payor / IRC / government flag).
    config:
      # Contract intentionally NOT enforced on first ship — promote to enforced
      # in a follow-up after column drift settles (see V3 dev guide §1.1).
      contract:
        enforced: true
      meta:
        cube: false
      tags:
        [
          "marts_bi_v3",
          "cube",
          "BIPlatform",
          "v3_synced",
          "heartwise",
          "zio_patch",
          "clinical_programs",
        ]
    columns:
      - name: mart_heartwise_zio_patch_id
        data_type: string
        description: "Surrogate PK — MD5(patient_id). Required by servingdb_sync.py for synced-table registration."
        constraints:
