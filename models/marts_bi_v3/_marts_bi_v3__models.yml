        description: "Total paid cost for the slice."
      - name: claim_line_count
        data_type: bigint
        description: "Paid claim lines in the slice."
      - name: members
        data_type: bigint
        description: "Distinct members (patient_id) in the slice. VendorBlue members now carry an EMPI identity (mostly ghosts), so the VendorBlue book has real member counts like every other book."
      - name: is_revenue_complete
        data_type: boolean
        description: "Inherited from mart_medical_spending at (payor, service_month). TRUE when book-level CMS capitation is present."
      - name: is_month_mature
        data_type: boolean
        description: "Inherited from mart_medical_spending. FALSE for recent service months whose claims have not run out."
      - name: is_month_reportable
        data_type: boolean
        description: "Inherited from mart_medical_spending. TRUE only when book revenue is complete AND claims are mature."

      - name: last_synced_at
        data_type: timestamp
        description: "ServingDB sync watermark (UTC) set by the synced-table writer."
  - name: mart_medical_spending_detail
    description: >
      Line-by-line medical claims detail (PAYOR_A + PAYOR_B) — the cleansed claim
      lines behind mart_medical_spending, NOT the raw payor files. One row per
      paid claim line in the latest release (Athena-matched or ghost/identity),
      carrying the full mapped detail of each feed (claim identity, member +
      Athena match, dates, providers, diagnoses 1-25, procedures + modifiers,
      DRG/revenue, facility/admission, Rx/pharmacy [PAYOR_A], categorization
      [PAYOR_A], and charge/allowed/paid amounts). Columns a payor does not supply
      are null. spend_bucket and plan_paid_amount tie to
      mart_medical_spending_by_specialty per payor x service_month x
      service_category. Grain: one row per claim line (claim_line_key).
      ServingDB SNAPSHOT mirror.
    config:
      contract:
        enforced: false # wide multi-payor union; enable after column types verified post-build
      meta:
        cube: true
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced", "spend", "finance"]
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: ["mart_medical_spending_detail_id"]
    columns:
      - name: mart_medical_spending_detail_id
        data_type: string
        description: "Surrogate PK — md5(claim_line_key). Required by servingdb_sync.py."
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null
      - name: claim_line_key
        data_type: string
        description: "Per-row line key (disambiguates PAYOR_B reversal rows that repeat the natural key)."
        tests:
          - not_null
      - name: payor
        data_type: string
        description: "Payor (PAYOR_A or PAYOR_B)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PAYOR_A', 'PAYOR_B']
      - name: patient_id
        data_type: string
        description: "Athena patient id the claim line resolved to (else EMPI identity / GHOST token)."
        # Athena relationships check on the numeric subset lives in the singular test
        # tests/empi/test_spend_numeric_patient_ids_resolve.sql (synthetic GHOST/identity
        # tokens are non-Athena by design and cannot be cast to a patients() FK).
        data_tests:
          - not_null
      - name: service_month
        data_type: date
        description: "First-of-month of the line's service date (date_trunc of claim_service_date)."
        tests: [not_null]
      - name: payment_year
        data_type: int
        description: "Calendar year of service_month."
      - name: claim_service_date
        data_type: date
        description: "Service date used for service_month (PAYOR_A service_date_last; PAYOR_B begin DOS)."
      - name: service_category
        data_type: string
        description: "Resolved clinical category (inpatient/outpatient/emergency/professional/pharmacy/post_acute/other)."
        tests: [not_null]
      - name: spend_bucket
        data_type: string
        description: "Display bucket (Inpatient/Professional/Outpatient/Emergency/Post-Acute/Pharmacy/Other)."
      - name: plan_paid_amount
        data_type: decimal(14,2)
        description: "Plan paid amount for the line (the spend cost metric; PAYOR_B reversals retained so SUM nets)."

  - name: mart_medical_spending_detail_uhc
    description: >
      PAYOR_B-only, normalized projection of mart_medical_spending_detail for ad-hoc
      analyst use. Same grain (one row per paid PAYOR_B claim line, keyed by
      claim_line_key), trimmed to the columns PAYOR_B populates: drops the 99
      PAYOR_A-only attributes that are always null for PAYOR_B (Rx/pharmacy, SDOH
      diagnoses, PAYOR_A clinical categorization, admission/facility,
      contracting/attending/operating/referring providers, allowed_amount, etc.)
      and 5 redundant/duplicate columns (payor [constant 'PAYOR_B'], is_latest_release
      [constant true], service_date_first [= claim_service_date],
      athena_match_is_unique [= athena_claim_matched], and
      mart_medical_spending_detail_id [md5(claim_line_key)]). plan_paid_amount
      still nets correctly (PAYOR_B reversal rows retained upstream). Cost is assigned
      to a single canonical incurred_month (admit month for inpatient confinements
      per the incurred-date convention, else the line service month); the prior
      service_month / payment_year / claim_month variants are removed to avoid
      ambiguity. Materialized as a table (managed Delta) so downstream Excel
      tooling can read its storage location. Grain: one row per paid PAYOR_B claim line
      (claim_line_key).
    config:
      tags: ["marts_bi_v3", "spend", "finance", "PAYOR_B"]
    columns:
      - name: claim_line_key
        data_type: string
        description: "Per-row line key from the parent detail mart; unique PK of this view."
        tests:
          - unique
          - not_null
      - name: patient_id
        data_type: string
        description: "Athena patient id the claim line resolved to (else EMPI identity / GHOST token)."
        tests: [not_null]
      - name: is_vendorblue_claim
        data_type: boolean
        description: "True when the claim's EMPI identity is the pure-VendorBlue book (uhc_book = 'VendorBlue' in int_spend__uhc_identity_book); false for Healthcare Org / out-of-scope identities."
        tests: [not_null]
      - name: company
        data_type: string
        description: "'Healthcare Org' or 'VendorBlue' (derived from is_vendorblue_claim), so claims split like the revenue/spend marts."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Healthcare Org", "VendorBlue"]
      - name: incurred_month
        data_type: string
        description: "Single canonical cost-attribution month as ISO text 'yyyy-MM-dd' (first-of-month) for Excel. Admit month for inpatient confinements (whole stay booked to admission per the incurred-date convention); the line's service month otherwise. Pivot cost on this (or incurred_month_label)."
        tests: [not_null]
      - name: incurred_month_label
        data_type: string
        description: "Excel-friendly 'YYYY-MM' text of incurred_month."
        tests: [not_null]
      - name: admit_date
        data_type: string
        description: "Inpatient confinement admission date as ISO text 'yyyy-MM-dd' = min(begin_dos) over the claim; null for non-inpatient lines."
      - name: discharge_date
        data_type: string
        description: "Inpatient confinement discharge date as ISO text 'yyyy-MM-dd' = max(end_dos) over the claim; null for non-inpatient lines."
      - name: los_days
        data_type: int
        description: "Inpatient length of stay in days (discharge - admit + 1); null for non-inpatient lines."
      - name: service_category
        data_type: string
        description: "Resolved clinical category (inpatient/outpatient/emergency/professional/post_acute/other)."
        tests: [not_null]
      - name: plan_paid_amount
        data_type: decimal(14,2)
        description: "Plan paid amount for the line (PAYOR_B reversals retained so SUM nets)."

  - name: mart_medical_revenue_detail_uhc
    description: >
      PAYOR_B-only, normalized analyst projection of the CMS-paid revenue extract —
      the revenue-side companion to mart_medical_spending_detail_uhc. One row per
      latest-release PAYOR_B revenue line (member_alt_id x service_month, plus retro
      lines), typed and cleaned, attributed to the immutable EMPI identity and
      labeled company (Healthcare Org / VendorBlue) so revenue splits exactly like
      the claims detail. Carries the CMS eligibility / risk-segment flags (hospice,
      institutional, LTI, ESRD, frailty, dual, risk-factor type) for monitoring
      hospice/inpatient overlap against the claims detail. gross_revenue nets
      correctly across retro-adjustment lines. Materialized as a view.
    config:
      tags: ["marts_bi_v3", "spend", "finance", "PAYOR_B", "revenue"]
    columns:
      - name: payor_member_id
        data_type: string
        description: "PAYOR_B member_alt_id (= indv_id), trimmed."
        tests: [not_null]
      - name: identity_id
        data_type: string
        description: "Immutable EMPI identity (or GHOST:PAYOR_B:<member id> when unmatched)."
        tests: [not_null]
      - name: company
        data_type: string
        description: "'Healthcare Org' or 'VendorBlue' (VendorBlue flag via int_spend__uhc_identity_book)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Healthcare Org", "VendorBlue"]
      - name: service_month
        data_type: date
        description: "First-of-month service month."
        tests: [not_null]
      - name: gross_revenue
        data_type: double
        description: "CMS-paid gross MA revenue for the line (sums correctly across retro rows)."
      - name: cms_paid_raf
        data_type: double
        description: "CMS risk_adjuster_factor_a (paid RAF) for the member-month."
      - name: hospice_flg
        data_type: string
        description: "CMS hospice election flag (Y = member in hospice status)."
      - name: institutional_flg
        data_type: string
        description: "CMS institutional status flag."
      - name: risk_adj_factor_typ_cd_desc
        data_type: string
        description: "CMS risk-adjustment factor type (Community / Institutional / Hospice / ESRD / New Enrollee)."

  - name: mart_population_history
    description: >
      Point-in-time population KPIs at monthly grain — Active Patients,
      Active Members, and the full status mix AS OF each month-end, by clinic
      and payor, back to the start of Athena history. Built on the
      models/historical backfill layer (status reconstructed from
      appointments + patientaudit; clinic from the most recent completed
      visit; payor from the appointment-level insurance waterfall). Encodes
      the canonical population hierarchy: Active Members are a strict subset
      of Active Patients (commercial membership population, Membership-dependent);
      active_member_raw_count carries the ungated membership-system view for
      reconciliation. Counts are EOM stocks — query with agg='latest', never
      summed across months. Grain: one row per status_month x clinic x
      payor_category x payor_brand. Materialized as a table and rebuilt in full
      on each run so removed or reclassified dimension combinations cannot remain
      as stale incremental rows; the published contract and surrogate key are
      unchanged.
    config:
      contract:
        enforced: true
      meta:
        owner: data_engineering
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]

    columns:
      - name: mart_population_history_id
        data_type: string
        description: "Surrogate PK — MD5(status_month | clinic | payor_category | payor_brand). Required by servingdb_sync.py."
        constraints:
          - type: not_null
        tests:
          - unique
      - name: status_month
        data_type: date
        description: "First-of-month date the EOM stocks apply to (as-of grain)."
      - name: clinic
        data_type: string
        description: "Clinic via the patient's most recent completed visit at EOM (hist_patient_provider_monthly). 'Unknown' when no visit history."
      - name: payor_category
        data_type: string
        description: "6-value payor category of the patient's resolved primary insurance at EOM (as-of classification when SCD2 coverage exists)."
      - name: payor_brand
        data_type: string
        description: "Normalized carrier brand of the resolved primary insurance at EOM."
      - name: patient_count
        data_type: bigint
        description: "Distinct patients in this month/clinic/payor cell (all statuses)."
      - name: active_patient_count
        data_type: bigint
        description: "CANONICAL Active Patients at EOM (548-day rule, deceased/deleted/manual-inactive honored, reconstructed)."
      - name: inactive_patient_count
        data_type: bigint
        description: "Patients canonically Inactive at EOM."
      - name: excluded_patient_count
        data_type: bigint
        description: "Patients canonically Excluded at EOM (no completed visit by then)."
      - name: active_member_count
        data_type: bigint
        description: "CANONICAL Active Members at EOM — strict subset of active_patient_count (Active enrollment + Membership + canonically Active patient)."
      - name: active_member_raw_count
        data_type: bigint
        description: "Membership-system-only active members at EOM (no patient gate) — reconciliation companion to active_member_count."
      - name: source_updated_at
        data_type: timestamp
        description: "CDF watermark for ServingDB TRIGGERED sync; only advances on rows whose counts actually changed (matched_condition)."

  - name: mart_voluntary_attribution_operational_review
    description: >
      Operational review of voluntary attribution (ISS) handling per completed
      appointment: did the visit qualify for the ISS voluntary-attribution
      worklist, and what did staff actually do during the visit week.
      One row per non-cancelled Salesforce appointment since 2026-03-31.
      POINT-IN-TIME BY DESIGN: account insurance/attribution fields are read
      from the Salesforce SCD2 history (__START_AT/__END_AT) AS OF the visit
      timestamp, and attribution status/stage/hold are replayed from
      attribution__history — this mart deliberately shows what the systems
      said AT THE VISIT, not current state. Payor mapping therefore uses the
      visit-time SF Primary_IRC_Group__c / Primary_Product_Type__c rather
      than current MDM (MDM has no pre-snapshot history; see
      models/historical/ for the go-forward MDM-as-of alternative).
      Grain: one row per appointment_id.
    config:
      meta:
        # contract deferred: column data_types not yet verified for
        # enforcement (table is rebuilt every run, so a wrong declared type
        # would fail prod immediately).
        owner: data_engineering
    columns:
      - name: mart_voluntary_attribution_operational_review_id
        description: "Surrogate PK — MD5 of appointment_id."
        constraints:
          - type: not_null
        tests:
          - unique
      - name: appointment_id
        description: "Salesforce Appointment__c Id (natural key)."
      - name: patient_id
        description: "Salesforce Account Id of the patient."
      - name: provider_user_id
        description: "Salesforce User Id of the visit provider (Physician__c)."
      - name: appointment_datetime_cst
        description: "Visit start datetime, America/Chicago, yyyy-MM-dd HH:mm."
      - name: appointment_date_cst
        description: "Visit date (CST)."
      - name: appointment_time_cst
        description: "Visit start time (CST)."
      - name: patient_name
        description: "Patient display name from the visit-time Account record."
      - name: source_system_identifier
        description: "Athena patient ID from the visit-time Account record (SourceSystemIdentifier)."
      - name: clinic_name
        description: "Salesforce Location name of the visit."
      - name: provider_name
        description: "Provider display name (Salesforce User)."
      - name: appointment_type
        description: "Salesforce appointment type (Type__c)."
      - name: appointment_status
        description: "Salesforce appointment status (Cancelled/Not Seen excluded upstream)."
      - name: attributed_payor_claims
        description: "Visit-time Account AttributedPayor__c (claims-based attribution)."
      - name: voluntary_alignment_flag
        description: "Visit-time Account Voluntary_Alignment__c."
      - name: primary_insurance_payor
        description: "Visit-time Account Primary_Insurance__c."
      - name: mapped_payor_type
        description: >
          Visit-time payor program mapping: Original Medicare when visit-time
          SF IRC group = medicare + product type Medicare B-Traditional, else
          the open ISS attribution payor type. Visit-time SF fields by design
          (see model description).
      - name: iss_target_program
        description: "Resolved ISS program target for the visit (attribution payor type, falling back to the visit-time insurance mapping)."
      - name: attribution_existed
        description: "Yes/No — any qualifying Attribution__c record existed at visit time."
      - name: sync_lag_suspected
        description: "Yes/No — visit-time insurance maps to an ISS program but no attribution record existed (SF sync lag signal)."
      - name: account_visit_time_source
        description: "Provenance of the visit-time account state (Databricks SCD2)."
      - name: flag_appt_not_cancelled
        description: "ISS gate: appointment not cancelled / not-seen."
      - name: flag_voluntary_payor_program
        description: "ISS gate: an open voluntary-attribution record exists for an ISS payor program."
      - name: iss_payor_type
        description: "Payor type of the picked attribution record (Original Medicare / PAYOR_B MA / Payor Epsilon MA)."
      - name: flag_needs_voluntary_attribution
        description: "ISS gate: not already attributed via claims (AttributedPayor null or Voluntary_Alignment false)."
      - name: flag_claims_pre_filter_pass
        description: "ISS gate: claims pre-filter pass (same condition as flag_needs_voluntary_attribution)."
      - name: flag_clinic_eligible
        description: "ISS gate: visit clinic on the ISS-eligible list (excludes Main Office, MIDI, Vaccine Clinic, BH, auto* clinics)."
      - name: flag_appointment_type_eligible
        description: "ISS gate: appointment type not ancillary-only (excludes Mammo/DEXA/Injection/Vaccination). Labwork is eligible as of TIC-7486 (2026-06), mirroring Salesforce TodayAppointmentsController."
      - name: flag_iss_record_open
        description: "ISS gate: the attribution record was OPEN at visit time (not Closed/Declined/Completed/portal-hold)."
      - name: flag_payor_specific_gate_pass
        description: "ISS gate: payor-specific claims gate (OM not voluntarily aligned; PAYOR_B/Payor Epsilon MA not already claims-attributed to that payor)."
      - name: flag_iss_included
        description: "Yes when ALL ISS gates pass — the visit should have been on the voluntary-attribution worklist."
      - name: inclusion_reason
        description: "'included' or the semicolon-joined reasons the visit fell out of ISS scope."
      - name: iss_attribution_status
        description: "Attribution Status__c in force at visit time (replayed from attribution__history; default Identified)."
      - name: iss_attribution_name
        description: "Name of the picked Attribution__c record."
      - name: program_attribution_status
        description: "All qualifying programs with their visit-time statuses, semicolon-joined (e.g. 'Original Medicare: In Progress')."
      - name: action_taken
        description: "Highest-ranked staff action on the attribution during the visit week (same-day preferred)."
      - name: action_taken_window
        description: "same-day | in-week — when the picked action happened relative to the visit."
      - name: action_taken_by
        description: "Staff member who performed the picked action."
      - name: action_taken_at_cst
        description: "Timestamp of the picked action (CST)."
      - name: actions_taken
        description: "All distinct staff action labels during the visit week, semicolon-joined."
      - name: action_edit_count
        description: "Count of attribution-history edits during the visit week."
      - name: action_user_count
        description: "Distinct staff members who edited during the visit week."
      - name: action_users
        description: "Names of staff who edited during the visit week."
      - name: last_action
        description: "Most recent action label in the visit week."
      - name: last_action_by
        description: "Staff member of the most recent action."
      - name: last_action_at_cst
        description: "Timestamp of the most recent action (CST)."
      - name: staff_action_verdict
        description: "Single-line operational verdict: picked action + edit count + last action, or NOT ACTIONED."
      - name: account_notes__pc
        description: "Visit-time Account Notes__pc."
      - name: account_pcp_switch_notes__c
        description: "Visit-time Account PCP_Switch_Notes__c."
      - name: attribution_completion_notes__c
        description: "Aggregated [COMPL] completion notes across qualifying attribution records."
      - name: attribution_decline_notes__c
        description: "Aggregated [DECL] decline notes across qualifying attribution records."
      - name: attribution_missed_interaction_notes__c
        description: "Aggregated [MISS] missed-interaction notes across qualifying attribution records."
      - name: notes_summary
        description: "All account + attribution notes concatenated (' || ' separated) for review display."
      - name: iss_submission_date
        description: >
          Submission_Date__c of the picked attribution, in CST. NULL when the
          submission date is in the future (garbage guard) or unset. Used to
          re-anchor PCP switches to when the switch actually happened rather
          than the visit week (Scenario 1 — backdated submissions).
      - name: iss_form_signature_date
        description: "Form_Signature_Date__c of the picked attribution (NULL when in the future or unset)."
      - name: switch_event_date
        description: >
          The date a switch is attributed to for reporting. When a submission
          or form-signature date exists, it is grounded only to the single
          nearest appointment for that patient × attribution (TIC-7899): abs
          day distance to the anchor, ties prefer on-or-before then earliest
          visit. Non-nearest appointments fall back to the visit date so one
          switch does not fan out across every historical/future visit.
          With no submission/form date, equals the appointment date.
      - name: switch_event_week
        description: >
          Month-clipped week-start (yyyy-MM-dd) of switch_event_date, matching
          the Weekly PCP Tracking week buckets. Switches bucket here so backdated
          submissions land in the historically-correct week.
      - name: is_backdated_switch
        description: >
          Yes only on the nearest-appointment switch row when the submission
          date is 7+ days before that visit (Scenario 1). Always No on
          non-nearest appointments (TIC-7899).
      - name: flag_has_switch_event
        description: >
          Yes only on the single nearest appointment to the submission/form
          signature date for that patient × attribution (TIC-7899). Lets
          closed/re-documented records surface as one switch event even when
          flag_iss_included = No (Scenario 2), without duplicating the switch
          onto every other appointment that shares the attribution.
