  # ─────────────────────────────────────────────────────────────────
  # mart_behavioral_health  (grain: one row per active BH patient)
  # ─────────────────────────────────────────────────────────────────
  - name: mart_behavioral_health
    description: >
      Tracks behavioral health panel outcomes for all active BH patients
      (is_active_bh_panel = true). One row per patient. Answers: Which BH patients
      are in PHQ/GAD remission, who has no next appointment, and who lacks a care plan?
      Grain: one row per active BH panel patient. Date column: last_bh_visit_date.
      Powers the Behavioral Health Dashboard. ServingDB TRIGGERED sync via
      source_updated_at propagated from v_bhpatientpanel through behavioral_health.
    config:
      contract:
        enforced: true
      meta:
        cube: true
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced"]
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]

    columns:
      - name: mart_behavioral_health_id
        data_type: string
        description: "Surrogate PK — MD5(CONCAT_WS('|', <grain cols>)) over the natural grain. Required by servingdb_sync.py for synced-table registration."
        constraints:
          - type: not_null
        tests:
          - unique
