version: 2

models:
  - name: mart_empi_golden_person
    description: >
      MDM Golden Record — one row per EMPI golden_id (the person). Identity
      backbone is empi_identity_profile; demographics from the primary golden
      record; primary/secondary attributed payor and As-Of Month are
      reviewer-honored (int_attribution_payor_slots -> backendbaas
      attribution_decisions). External identifiers are intentionally not
      flattened here — use mart_empi_identity_map for the long-format join keys.
    config:
      contract:
        enforced: true
      meta:
        cube: true
        mdm_exempt_appointment: true
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced", "empi"]
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]

    columns:
      - name: golden_id
        data_type: string
        description: "{{ doc('golden_id') }}"
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null
      - name: first_name
        data_type: string
        description: "Person first name from the primary golden record"
      - name: last_name
        data_type: string
        description: "Person last name from the primary golden record"
      - name: middle_initial
        data_type: string
        description: "Person middle initial from the primary golden record"
      - name: dob
        data_type: string
        description: "Date of birth (string as landed by the EMPI matcher)"
      - name: gender
        data_type: string
        description: "Gender from the primary golden record"
      - name: phone_1
        data_type: string
        description: "Primary phone number"
      - name: phone_2
        data_type: string
        description: "Secondary phone number"
      - name: email
        data_type: string
        description: "Email address"
      - name: address_street
        data_type: string
        description: "Mailing street address"
      - name: city
        data_type: string
        description: "Mailing city"
      - name: state
        data_type: string
        description: "Mailing state"
      - name: zip_code
        data_type: string
        description: "Mailing ZIP code"
      - name: is_test_patient
        data_type: boolean
        description: "True when the primary golden record is flagged as a test patient"
      - name: is_midi_patient
        data_type: boolean
        description: "True when the identity has a MIDI Athena chart (master_identity_type MIDI/MULTIPLE or midi athena identity count > 0)"
      - name: is_vaccine_dept_only_patient
        data_type: boolean
        description: "True when all of the person's Athena appointments are in the Vaccine Clinic department (id 10)"
      - name: master_identity_type
        data_type: string
        description: "EMPI master identity type: HERSELF_HEALTH, MIDI, MULTIPLE, or UNKNOWN"
      - name: primary_athena_id_herself_health
        data_type: string
        description: "Representative Healthcare Org Athena patient ID for this identity"
      - name: primary_athena_id_midi
        data_type: string
        description: "Representative MIDI Athena patient ID for this identity"
      - name: athena_id_count
        data_type: bigint
        description: "Distinct Athena patient IDs mapped to this golden identity"
      - name: primary_salesforce_id
        data_type: string
        description: "Representative Salesforce Account ID for this identity"
      - name: salesforce_id_count
        data_type: bigint
        description: "Distinct Salesforce Account IDs mapped to this golden identity"
      - name: mbi
        data_type: string
        description: "Medicare Beneficiary Identifier (from primary golden record)"
      - name: has_pending_merges
        data_type: boolean
        description: "True when this person still has multiple unmerged active identities (test/FP sandbox patients excluded)"
      - name: active_identity_count
        data_type: bigint
        description: "Count of ACTIVE EMPI identities resolving to this golden_id"
      - name: merged_identity_count
        data_type: bigint
        description: "Count of MERGED EMPI identities resolving to this golden_id"
      - name: primary_attribution_payor
        data_type: string
        description: "Reviewer-honored primary attributed payor (int_attribution_payor_slots)"
      - name: primary_attribution_as_of_month
        data_type: date
        description: "As-Of Month grounding the primary attribution roster"
      - name: secondary_attribution_payor
        data_type: string
        description: "Reviewer-honored secondary attributed payor (dual-attribution decisions only)"
      - name: secondary_attribution_as_of_month
        data_type: date
        description: "As-Of Month grounding the secondary attribution roster"
      - name: attribution_source
        data_type: string
        description: "Provenance: unattributed | single_payor | eligibility_decision | pending"
      - name: payor_attribution_count
        data_type: bigint
        description: "Count of distinct payors currently attributing this person"
      - name: athena_identity_count_herself_health
        data_type: bigint
        description: "Count of Healthcare Org Athena identities for this person"
      - name: athena_identity_count_midi
        data_type: bigint
        description: "Count of MIDI Athena identities for this person"
      - name: has_name_dob_collision
        data_type: boolean
        description: "EMPI flag: name+DOB collision with another identity"
      - name: has_shared_contact_with_other_identity
        data_type: boolean
        description: "EMPI flag: shared email/phone with another identity"
      - name: source_updated_at
        data_type: timestamp
        description: "Profile refresh timestamp (CDF watermark for ServingDB sync)"

  - name: mart_empi_identity_map
    description: >
      Long-format EMPI cross-reference — one row per (golden_id, source_system,
      source_id). The join-key spine for linking external files (payor claims,
      CMS rosters, Salesforce lists) to the golden identity. is_claims_join_key
      flags payor/CMS member-ID rows.
    config:
      contract:
        enforced: true
      meta:
        cube: true
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced", "empi"]
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]

    columns:
      - name: identity_map_id
        data_type: string
        description: "Surrogate PK — MD5(CONCAT_WS('|', golden_id, source_system, source_id)) with null-sentinel components."
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null
      - name: golden_id
        data_type: string
        description: "{{ doc('golden_id') }}"
      - name: identity_id
        data_type: string
        description: "Immutable EMPI business identity ID"
      - name: source_system
        data_type: string
        description: "Source system / payor for the identifier (ATHENA, SALESFORCE, MEMBERSHIP_PLATFORM, PAYOR_B, PAYOR_A, PAYOR_C, PAYOR_DELTA, AHA, MSSP)"
      - name: source_id
        data_type: string
        description: "Identifier value as used in the source system (the join key)"
      - name: identifier_kind
        data_type: string
        description: "Human-readable identifier category"
      - name: is_claims_join_key
        data_type: boolean
        description: "True for payor/CMS member-ID rows usable to join external claims files"
      - name: match_confidence
        data_type: double
        description: "Match confidence when sourced from a payor/Medicare match (else null)"
      - name: approval_status
        data_type: string
        description: "Match approval status: auto_approved, manually_approved, pending, data_quality_issue"
      - name: match_type
        data_type: string
        description: "Match methodology (e.g. MBI_DETERMINISTIC, SPLINK)"
      - name: assigned_at
        data_type: timestamp
        description: "When the source identity was assigned to the golden_id"
      - name: source_updated_at
        data_type: timestamp
        description: "Xref last-updated timestamp (CDF watermark for ServingDB sync)"

  - name: mart_appointments
    description: >
      One row per appointment. Enriched with patient membership flags and CASE-WHEN
      scope helper columns for count_distinct metric aggregations. Powers scheduling
      and patient experience dashboards.
    config:
      contract:
        enforced: true
      meta:
        cube: true
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced"]
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]

    columns:
      - name: mart_appointments_id
        data_type: string
        description: "Surrogate PK — MD5(CONCAT_WS('|', <grain cols>)) over the natural grain. Required by servingdb_sync.py for synced-table registration."
        constraints:
          - type: not_null
        tests:
          - unique
      - name: appointment_id
        data_type: "decimal(10,0)"
        description: "Unique appointment identifier (Athena)"
      - name: patient_id
        data_type: "decimal(10,0)"
        description: "{{ doc('patient_id') }}"
        data_tests:
          - relationships:
              arguments:
                to: ref('patients')
                field: patient_id
              config:
                severity: warn
      - name: provider_id
        data_type: string
        description: "Provider identifier"
      - name: department_id
        data_type: "decimal(10,0)"
        description: "Department/clinic identifier"
      - name: golden_id
        data_type: string
        description: "{{ doc('golden_id') }}"
      - name: salesforce_id
        data_type: string
        description: "Salesforce account ID"
      - name: enterprise_id
        data_type: string
        description: "{{ doc('enterprise_id') }}"
      - name: provider_group_id
        data_type: string
        description: "{{ doc('provider_group_id') }}"
      - name: provider_clinic
        data_type: string
        description: "{{ doc('assigned_clinic') }}"
      - name: clinic_name
        data_type: string
        description: "{{ doc('assigned_clinic') }}"
      - name: is_patient_facing
        data_type: boolean
        description: "Whether the clinic is patient-facing"
      - name: clinic_type
        data_type: string
        description: "Clinic type (e.g. Primary Care, BH)"
      - name: provider_name
        data_type: string
        description: "{{ doc('provider_name') }}"
      - name: is_physician
        data_type: boolean
        description: "True if provider is a physician (MD/DO)"
      - name: is_bh_provider
        data_type: boolean
        description: "True if provider is a behavioral health provider"
      - name: appointment_type_name
        data_type: string
        description: "Appointment type label (e.g. Annual Wellness Visit)"
      - name: visit_category
        data_type: string
        description: "Aggregated visit category (e.g. NPV, Established)"
      - name: is_npv
        data_type: boolean
        description: "{{ doc('initial_visit') }}"
      - name: is_awv
        data_type: boolean
        description: "{{ doc('awv_visit') }}"
      - name: is_telehealth
        data_type: boolean
        description: "Telehealth visit flag"
      - name: is_behavioral_health
        data_type: boolean
        description: "Behavioral health visit flag"
      - name: is_cancelled
        data_type: boolean
        description: "{{ doc('appointment_cancelled') }}"
      - name: is_completed
        data_type: boolean
        description: "{{ doc('appointment_completed') }}"
      - name: is_no_show
        data_type: boolean
        description: "{{ doc('no_show') }}"
      - name: is_future_appointment
        data_type: boolean
        description: "Appointment is scheduled in the future"
      - name: is_initial_visit
        data_type: boolean
        description: "{{ doc('initial_visit') }}"
      - name: is_rescheduled
        data_type: boolean
        description: "Appointment was rescheduled"
      - name: is_truly_cancelled
        data_type: boolean
        description: "Appointment was truly cancelled (not recovered)"
      - name: cancellation_category
        data_type: string
        description: "Category of cancellation reason"
      - name: appointment_date
        data_type: date
        description: "Calendar date of the appointment"
      - name: appointment_week
        data_type: date
        description: "ISO week start date of the appointment"
      - name: appointment_month
        data_type: date
        description: "Month start date of the appointment"
      - name: appointment_year
        data_type: bigint
        description: "Calendar year of the appointment"
      - name: scheduled_datetime
        data_type: timestamp
        description: "Timestamp when the appointment was scheduled"
      - name: scheduled_by
        data_type: string
        description: "Scheduling actor (PORTAL, staff, API, etc.)"
      - name: cancelled_by
        data_type: string
        description: "Cancelling actor"
      - name: rescheduled_by
        data_type: string
        description: "Rescheduling actor"
      - name: npv_recovery_category
        data_type: string
        description: "NPV recovery status (Truly Lost, Recovered, etc.)"
      - name: slot_status
        data_type: string
        description: "Slot fill status (Open, Filled)"
      - name: patient_is_membership
        data_type: boolean
        description: "Patient is an active membership patient at time of appointment"
      - name: patient_membership_member_since
        data_type: date
        description: "Date patient became a Membership member"
      - name: patient_membership_enrollment
        data_type: string
        description: "Patient Membership enrollment status. See {{ doc('enrollment_month') }} for cohort semantics."
      - name: is_membership_visit
        data_type: boolean
        description: "{{ doc('membership_visit') }}"
      - name: is_active_member_visit
        data_type: boolean
        description: "{{ doc('membership_visit') }}"
      - name: is_patient_active_member
        data_type: boolean
        description: "Patient is an active membership patient"
      - name: is_first_90d_member_visit
        data_type: boolean
        description: "Visit occurred within 90 days of membership start"
      - name: scheduling_channel
        data_type: string
        description: "Derived scheduling channel (Portal Scheduled, AI Outreach Scheduled, Staff Scheduled, etc.)"
      - name: completed_aid
        data_type: "decimal(10,0)"
        description: "Scope column: appointment_id when is_completed = true, NULL otherwise. Used by metric() for count_distinct aggregations."
      - name: cancelled_aid
        data_type: "decimal(10,0)"
        description: "Scope column: appointment_id when is_cancelled = true, NULL otherwise. Used by metric() for count_distinct aggregations."
      - name: noshow_aid
        data_type: "decimal(10,0)"
        description: "Scope column: appointment_id when is_no_show = true, NULL otherwise. Used by metric() for count_distinct aggregations."
      - name: rescheduled_aid
        data_type: "decimal(10,0)"
        description: "Scope column: appointment_id when is_rescheduled = true, NULL otherwise. Used by metric() for count_distinct aggregations."
      - name: truly_cancelled_aid
        data_type: "decimal(10,0)"
        description: "Scope column: appointment_id when is_truly_cancelled = true, NULL otherwise. Used by metric() for count_distinct aggregations."
      - name: iv_aid
        data_type: "decimal(10,0)"
        description: "Scope column: appointment_id when is_initial_visit AND is_completed, NULL otherwise. Used by metric() for count_distinct aggregations."
      - name: awv_aid
        data_type: "decimal(10,0)"
        description: "Scope column: appointment_id when is_awv AND is_completed, NULL otherwise. Used by metric() for count_distinct aggregations."
      - name: open_slot_aid
        data_type: "decimal(10,0)"
        description: "Scope column: appointment_id when slot_status = 'Open', NULL otherwise. Used by metric() for count_distinct aggregations."
      - name: filled_slot_aid
        data_type: "decimal(10,0)"
        description: "Scope column: appointment_id when slot_status = 'Filled', NULL otherwise. Used by metric() for count_distinct aggregations."
      - name: npv_truly_lost_aid
        data_type: "decimal(10,0)"
        description: "Scope column: appointment_id when npv_recovery_category = 'Truly Lost', NULL otherwise. Used by metric() for count_distinct aggregations."
      - name: membership_completed_aid
        data_type: "decimal(10,0)"
        description: "Scope column: appointment_id when active member, on/after membership_member_since, and completed. Used by metric() for count_distinct aggregations."
      # ── DEV-4139 Appointment Performance (operations-appointment-performance) ──
      - name: appointment_duration
        data_type: "decimal(10,0)"
        description: "Scheduled appointment duration in minutes (from Athena appointmentduration). Backs the avg-duration metric on the Appointment Performance dashboard."
      - name: ma_vs_provider
        data_type: string
        description: "MA vs Provider visit split. 'MA' when the MDM appointment type is an Ancillary visit, excluding imaging (Mammo/Dexa) and Behavioral Health; otherwise 'Provider'."
      - name: cancelled_lt_7d
        data_type: boolean
        description: "True when the appointment was cancelled within 7 days (604800s) of its scheduled start. Lead time computed from appointment_date + appointment_start_time vs cancelled_datetime."
      - name: cancelled_lt_48h
        data_type: boolean
        description: "True when the appointment was cancelled within 48 hours (172800s) of its scheduled start."
      - name: days_scheduled_to_cancelled
        data_type: int
        description: "Whole days between scheduled_datetime and cancelled_datetime for cancelled appointments; NULL otherwise."
      - name: cancelled_lt_7d_aid
        data_type: "decimal(10,0)"
        description: "Scope column: appointment_id when cancelled within 7 days of start, NULL otherwise. Used by metric() for count_distinct aggregations."
      - name: cancelled_lt_48h_aid
        data_type: "decimal(10,0)"
        description: "Scope column: appointment_id when cancelled within 48 hours of start, NULL otherwise. Used by metric() for count_distinct aggregations."
      # Membership-dashboard global filter columns — sourced from vw_membership_patients
      # via the `mem` LEFT JOIN. Required so the shared metric_dimensions whitelist
      # (patient_status, member_category, enrollment_status, payment_status,
      # membership_membership_status, clinic, primary_care_provider) resolves against
      # mart_appointments the same way it does against mart_membership_kpis_monthly.
      - name: patient_status
        data_type: string
        description: "{{ doc('patient_status') }}"
      - name: member_category
        data_type: string
        description: "Membership category (Net New Member, Established) at time of appointment"
      - name: enrollment_status
        data_type: string
        description: "Patient membership enrollment status at time of appointment. Mirror of mart_patients.enrollment_status; values: 'Active Member', 'Active Member - Waived', 'Inactive Member', 'Declined', 'Sent Contract', 'Scheduled', 'Cancelled - Not Rescheduled', etc."
      - name: payment_status
        data_type: string
        description: "Payment status (Paying Member, Grandmothered Member, Not Member) at time of appointment"
      - name: membership_membership_status
        data_type: string
        description: "Membership membership status at time of appointment"
      - name: clinic
        data_type: string
        description: "{{ doc('assigned_clinic') }}"
      - name: primary_care_provider
        data_type: string
        description: "{{ doc('provider_name') }}"
      - name: source_updated_at
        data_type: timestamp
        description: "CDF watermark — max(source_updated_at, last_updated_at) across upstream refs. Required for ServingDB TRIGGERED sync mode."
        constraints:
          - type: not_null
        tests:
    # ─────────────────────────────────────────────────────────────────
    # mart_patients  (grain: one row per patient)
    # ─────────────────────────────────────────────────────────────────
    semantic_model:
      enabled: true
    agg_time_dimension: appointment_date
  - name: mart_patients
    description: >
      One row per patient. Comprehensive roster with payor, membership, and
      engagement flags. Snapshot grain (no date column). Powers patient-level
      KPI dashboards (kpi_total_patients, kpi_active_patients,
      kpi_attributed_patients, kpi_medicare_patients, kpi_membership_active).
    config:
      contract:
        enforced: true
      meta:
        cube: true
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced"]
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]

    columns:
      - name: mart_patients_id
        data_type: string
        description: "Surrogate PK — MD5(CONCAT_WS('|', <grain cols>)) over the natural grain. Required by servingdb_sync.py for synced-table registration."
        constraints:
          - type: not_null
        tests:
          - unique
      - name: patient_id
        data_type: bigint
        description: "{{ doc('patient_id') }}"
      - name: golden_id
        data_type: string
        description: "{{ doc('golden_id') }}"
      - name: salesforce_id
        data_type: string
        description: "Salesforce account ID"
      - name: athena_enterprise_id
        data_type: string
        description: "Athena enterprise patient ID"
      - name: empi_enterprise_id
        data_type: string
        description: "EMPI enterprise patient ID"
      - name: enterprise_id
        data_type: string
        description: "{{ doc('enterprise_id') }}"
      - name: provider_group_id
        data_type: string
        description: "{{ doc('provider_group_id') }}"
      - name: chart_group_name
        data_type: string
        description: "Chart group / market name"
      - name: first_name
        data_type: string
        description: "Patient first name"
      - name: last_name
        data_type: string
        description: "Patient last name"
      - name: date_of_birth
        data_type: date
        description: "Patient date of birth"
      - name: gender
        data_type: string
        description: "Patient gender"
      - name: race
        data_type: string
        description: "Patient race"
      - name: ethnicity
        data_type: string
        description: "Patient ethnicity"
      - name: preferred_language
        data_type: string
        description: "Patient preferred language"
      - name: patient_status
        data_type: string
        description: "{{ doc('patient_status') }}"
      - name: is_active
        data_type: boolean
        description: "Patient is currently active"
      - name: has_completed_visit
        data_type: boolean
        description: "Patient has at least one completed visit"
      - name: primary_provider_id
        data_type: bigint
        description: "Primary care provider ID"
      - name: clinic
        data_type: string
        description: "{{ doc('assigned_clinic') }}"
      - name: primary_care_provider
        data_type: string
        description: "{{ doc('provider_name') }}"
      - name: tier
        data_type: string
        description: "Patient tier"
      - name: risk_tier
        data_type: string
        description: "Patient risk tier (coalesced, 'No Tier' if blank)"
      - name: primary_insurance
        data_type: string
        description: "Primary insurance plan name"
      - name: primary_payor
        data_type: string
        description: "Primary payor name"
      - name: primary_product_type
        data_type: string
        description: "Primary insurance product type (Medicare, Commercial, etc.)"
      - name: membership_enrollment
        data_type: string
        description: "Membership enrollment status (Active Member, Inactive Member, etc.)"
      - name: enrollment_status
        data_type: string
        description: "Alias for membership_enrollment so the shared metric_dimensions whitelist resolves against this mart. Same values: 'Active Member', 'Active Member - Waived', 'Inactive Member', 'Declined', 'Sent Contract', 'Scheduled', 'Cancelled - Not Rescheduled', etc."
      - name: visits_per_year_bucket
        data_type: string
        description: "Bucketed lifetime completed visit count from sf_completed_visit_count. Values: '0', '1-2', '3-5', '6-10', '11+'. Aligned with V2 Cube `patients.visits_per_year_bucket` so dashboards built against the federated cube continue to whitelist the same labels."
      - name: age_range
        data_type: string
        description: "Patient age bucket aligned to the membership-kpi-v3 dashboard filter whitelist. Values: '18-25', '26-40', '41-54', '55-60', '61-64', '65+'. NULL for ages < 18. Buckets MUST match the dashboard whitelist exactly so categorical group_by maps cleanly to the filter dropdown."
      - name: email
        data_type: string
        description: "Patient email address"
      - name: mobile_phone
        data_type: string
        description: "Patient mobile phone"
      - name: mailing_city
        data_type: string
        description: "Patient mailing city"
      - name: mailing_state
        data_type: string
        description: "Patient mailing state"
      - name: mailing_zip
        data_type: string
        description: "Patient mailing ZIP code"
      - name: registration_date
        data_type: date
        description: "Patient registration date"
      - name: first_scheduled_date
        data_type: timestamp
        description: "Date of first scheduled appointment"
      - name: first_completed_visit_date
        data_type: timestamp
        description: "Date of first completed visit"
      - name: last_completed_visit_date
        data_type: date
        description: "Date of most recent completed visit"
      - name: days_since_last_completed
        data_type: int
        description: "Days since last completed visit"
      - name: sf_completed_visit_count
        data_type: double
        description: "Salesforce completed visit count"
      - name: membership_member_since
        data_type: date
        description: "Date patient became a Membership member"
      - name: membership_membership_status
        data_type: string
        description: "Membership membership status"
      - name: inactive_date
        data_type: timestamp
        description: "Date patient became inactive"
      - name: payor_attribution_count
        data_type: int
        description: "Number of active payor attributions"
      - name: is_attributed
        data_type: boolean
        description: "Patient is attributed to a payor"
      - name: is_membership_patient
        data_type: boolean
        description: "Patient is a membership patient"
      - name: member_category
        data_type: string
        description: "Membership category (Net New Member, Established)"
      - name: membership_plan_type
        data_type: string
        description: "Membership plan type (Legacy, Her Membership)"
      - name: monthly_revenue
