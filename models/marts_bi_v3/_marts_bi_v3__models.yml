  # ─────────────────────────────────────────────────────────────────
  # mart_operating_review_worklist  (grain: one row per ACTIVE patient)
  # ─────────────────────────────────────────────────────────────────
  - name: mart_operating_review_worklist
    description: >
      Operating Review "What I Can Do" patient worklist. Row = one ACTIVE patient.
      Consolidated outreach table: identity/clinic/provider/tier/demographics, engagement
      signals (last NPS as an NPS-style percentage, open Service Recovery case, active TCM,
      active BH panel), fresh qualifying-visit vs any-appointment last/next dates, action
      flags (no-next, AWV gap, MD/DO gap, off/on cadence), and the highest upcoming
      appointment cancellation-risk score. Visit/appointment dates and no_next are computed
      fresh from the appointment fact (the operating_review mart's next_visit_date is
      incremental-stale on appointment changes). Operational table; not metric-view governed.
    config:
      tags: ["marts_bi_v3", "operating_review", "dashboard"]
    columns:
      - name: patient_id
        data_type: "decimal(10,0)"
        description: "{{ doc('patient_id') }}"
        tests:
          - unique
          - not_null
      - name: clinic
        description: "Patient's clinic (visit/home clinic)."
      - name: provider
        description: "Primary care provider name."
      - name: risk_tier
        description: "Patient risk tier."
      - name: last_nps_pct
        description: "Most recent post-visit survey as an NPS-style value: Promoter=1.0, Passive=0.0, Detractor=-1.0 (format as percent for display)."
      - name: last_nps_rating
        description: "Most recent survey raw 1-5 likelihood-to-recommend rating."
      - name: last_nps_category
        description: "Most recent survey NPS category (PROMOTER/PASSIVE/DETRACTOR)."
      - name: last_nps_date
        description: "Date of the most recent survey."
      - name: service_recovery_yn
        description: "True if the patient has an open Salesforce Service Recovery case."
      - name: tcm_yn
        description: "True if the patient has an active TCM episode (open case or recent discharge with TOC incomplete)."
      - name: bh_panel_yn
        description: "True if the patient is on the active behavioral-health panel."
      - name: last_visit_date
        description: "Date of the patient's last completed qualifying medical visit (excludes BH/ancillary)."
      - name: last_appointment_date
        description: "Date of the patient's last completed appointment of any type."
      - name: next_visit_date
        description: "Date of the patient's next scheduled qualifying medical visit (excludes BH/ancillary)."
      - name: next_appointment_date
        description: "Date of the patient's next scheduled appointment of any type."
      - name: patient_name
        description: "Patient full name."
      - name: dob
        description: "Patient date of birth."
      - name: age
        description: "Patient age."
      - name: phone
        description: "Patient mobile phone."
      - name: email
        description: "Patient email."
      - name: no_next_yn
        description: "True if the active patient has no future qualifying medical visit scheduled (computed fresh from the appointment fact)."
      - name: needs_awv_yn
        description: "True if the patient is AWV-eligible (Medicare) and has no AWV completed or scheduled this year."
      - name: needs_mddo_yn
        description: "True if the patient has MD/DO history and no MD/DO visit completed or scheduled this year."
      - name: off_cadence_yn
        description: "Salesforce Off_Cadence_Actual__c (current account row via stg_salesforce__account) — patient is past their tier cadence interval. NULL when no matching account (unknown)."
      - name: on_cadence_yn
        description: "Inverse of off_cadence_yn; NULL when off-cadence state is unknown (no matching account), rather than defaulting unknown patients to on-cadence."
      - name: at_risk_appt_score
        description: "Highest upcoming appointment cancellation probability (0-1) from the scheduling ML model."
      - name: at_risk_appt_tier
        description: "Cancellation-risk tier of the highest-risk upcoming appointment."
      - name: at_risk_appt_date
        description: "Date of the highest-risk upcoming appointment."

