      - name: row_count
        data_type: bigint
        description: "Number of by-specialty mart rows for this provider_specialty."

  - name: mart_medical_spending_filter_values_spend_bucket
    description: >
      Dropdown source for the `spend_bucket` filter on the Medical Spending P&L
      dashboard (by-specialty cost detail). The BIPlatform BFF selects value,
      row_count from the ServingDB facade view. Grain: one row per spend_bucket.
    config:
      contract:
        enforced: false
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced", "spend", "finance", "filter_values"]
    columns:
      - name: value
        data_type: string
        description: "Distinct spend_bucket (Inpatient / Professional / etc.)."
        constraints:
          - type: not_null
        tests:
          - not_null
          - unique
      - name: row_count
        data_type: bigint
        description: "Number of by-specialty mart rows for this spend_bucket."

  - name: mart_payor_unmatched_members
    description: >
      Ghost payor-identity roster. One row per (payor, identity_id) for EMPI
      identities carried in the spend / Financial-RAF revenue facts with paid
      revenue/cost but no Athena patient yet (is_ghost = true). Keyed on the
      IMMUTABLE identity_id, so a ghost and its later Athena match are the SAME
      identity over time: the instant the identity gains an Athena patient the
      fact's is_ghost flips false and the row leaves this mart on its own (no
      manual deletes). Shows per ghost identity: revenue (has_revenue/revenue_total),
      paid cost (has_cost/cost_total), RAF (has_our_raf — our computed payment RAF,
      NULL for ghosts; cms_paid_raf is the payor-reported factor), whether it would
      now resolve (now_resolvable / match_status). Backs the Medical Spending and
      RAF Lifecycle dashboard "Unmatched members" tabs.
      Grain: one row per (payor, identity_id). ServingDB SNAPSHOT mirror.
    config:
      contract:
        enforced: true
      meta:
        cube: true
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced", "spend", "finance", "raf"]
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: ["payor", "identity_id"]
    columns:
      - name: mart_payor_unmatched_members_id
        data_type: string
        description: "Surrogate PK — MD5(payor|identity_id). Required by servingdb_sync.py for synced-table registration."
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null
      - name: payor
        data_type: string
        description: "Payor the ghost identity is paid under (PAYOR_A, PAYOR_B, or VendorBlue)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PAYOR_A', 'PAYOR_B', 'VendorBlue']
      - name: identity_id
        data_type: string
        description: "IMMUTABLE EMPI identity (H-number) of the ghost. The mart grain — stable across the ghost->matched transition. A deterministic GHOST:<payor>:<member> token only for paid members with no EMPI cluster at all."
        tests: [not_null]
      - name: payor_member_id
        data_type: string
        description: "Representative payor-native member id (PAYOR_A person id / PAYOR_B member_alt_id) for this identity; the full set is in the facts."
        tests: [not_null]
      - name: payor_member_id_count
        data_type: bigint
        description: "Distinct payor member ids that resolve to this identity (>1 = the identity spans multiple payor member ids over time)."
      - name: first_service_month
        data_type: date
        description: "Earliest service month with spend activity for this ghost identity."
      - name: last_service_month
        data_type: date
        description: "Latest service month with spend activity for this ghost identity."
      - name: member_months
        data_type: bigint
        description: "Paid member-months carried for this ghost identity."
      - name: revenue_total
        data_type: decimal(18,2)
        description: "Total CMS-paid revenue we have for this ghost identity (spend fact)."
      - name: cost_total
        data_type: decimal(18,2)
        description: "Total paid claim cost we have for this ghost identity (spend fact)."
      - name: raf_paid_revenue
        data_type: decimal(18,2)
        description: "Paid revenue carried in the Financial-RAF reconciliation fact for this identity (no projection)."
      - name: has_revenue
        data_type: boolean
        description: "TRUE when we have any revenue for this ghost identity."
      - name: has_cost
        data_type: boolean
        description: "TRUE when we have any paid cost for this ghost identity."
      - name: cms_paid_raf
        data_type: double
        description: "Payor-reported risk factor (risk_adjuster_factor_a) from the member's file, if present."
      - name: has_cms_paid_raf
        data_type: boolean
        description: "TRUE when the payor file carried a risk factor for this identity."
      - name: has_our_raf
        data_type: boolean
        description: "TRUE only if our computed payment RAF exists. FALSE for true ghosts — an unmatched identity can't be risk-scored."
      - name: has_raf_projection
        data_type: boolean
        description: "TRUE when a benchmark x RAF projection exists in the RAF revenue fact (FALSE for ghosts)."
      - name: is_deterministic_floor
        data_type: boolean
        description: "TRUE when identity_id is a deterministic GHOST:<payor>:<member> floor token (paid member with no EMPI cluster / no demographics to match)."
      - name: now_resolvable
        data_type: boolean
        description: "TRUE when the EMPI spine already shows an Athena match for this identity — a build-lag ghost the next rebuild will auto-remove."
      - name: match_status
        data_type: string
        description: "MDM worklist class: DETERMINISTIC_FLOOR | RESOLVABLE_NOW | GHOST_NO_ATHENA."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['DETERMINISTIC_FLOOR', 'RESOLVABLE_NOW', 'GHOST_NO_ATHENA']
      - name: last_synced_at
        data_type: timestamp
        description: "Build timestamp of the snapshot row."

  - name: mart_payor_unmatched_summary
    description: >
      Headline rollup of the unmatched ("ghost") payor-member roster
      (mart_payor_unmatched_members). One row per payor scope — 'PAYOR_A', 'PAYOR_B',
      and an 'All' rollup — carrying ghost member counts, member-months, revenue,
      paid cost, RAF-paid revenue, and how many ghosts have revenue / cost /
      payor-reported RAF / our computed RAF, plus crosswalk-status counts. Exists
      so the Databricks AI/BI "Unmatched members" tabs can render governed
      counters by SELECTing a pre-computed column (no raw-mart aggregation in the
      dataset SQL, which the .lvdash linter rejects). Shrinks automatically as
      ghosts resolve to an Athena patient and drop off the roster.
      Grain: one row per payor scope (PAYOR_A | PAYOR_B | All).
    config:
      contract:
        enforced: true
      tags: ["marts_bi_v3", "spend", "finance", "raf"]
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: ["payor"]
    columns:
      - name: mart_payor_unmatched_summary_id
        data_type: string
        description: "Surrogate PK — MD5(payor)."
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null
      - name: payor
        data_type: string
        description: "Payor scope of the rollup row: PAYOR_A, PAYOR_B, VendorBlue, or the All rollup."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PAYOR_A', 'PAYOR_B', 'VendorBlue', 'All']
      - name: ghost_members
        data_type: bigint
        description: "Count of unmatched members in this scope."
      - name: ghost_member_months
        data_type: bigint
        description: "Total paid member-months across unmatched members in this scope."
      - name: ghost_revenue
        data_type: decimal(18,2)
        description: "Total CMS-paid revenue carried for unmatched members in this scope."
      - name: ghost_cost
        data_type: decimal(18,2)
        description: "Total paid claim cost carried for unmatched members in this scope."
      - name: ghost_raf_paid_revenue
        data_type: decimal(18,2)
        description: "Total Financial-RAF paid revenue carried for unmatched members in this scope."
      - name: members_with_revenue
        data_type: bigint
        description: "Unmatched members with any revenue."
      - name: members_with_cost
        data_type: bigint
        description: "Unmatched members with any paid cost."
      - name: members_with_cms_raf
        data_type: bigint
        description: "Unmatched members whose payor file carried a risk factor."
      - name: members_with_our_raf
        data_type: bigint
        description: "Unmatched members with our computed payment RAF (≈0 — ghosts can't be scored)."
      - name: members_deterministic_floor
        data_type: bigint
        description: "Ghost identities minted on the deterministic GHOST:<payor>:<member> floor (no EMPI cluster)."
      - name: members_resolvable_now
        data_type: bigint
        description: "Ghost identities the EMPI spine already shows matched to an Athena patient (next rebuild auto-removes them)."
      - name: last_synced_at
        data_type: timestamp
        description: "Build timestamp of the snapshot row."
