        description: "Duration of the slot in minutes."
      - name: departmentid
        data_type: "decimal(10,0)"
        description: "Athena department ID for the slot."
      - name: providerid
        data_type: "decimal(10,0)"
        description: "Athena provider ID for the slot."
      - name: appointmenttypeid
        data_type: "decimal(10,0)"
        description: "Athena appointment type ID for the slot."
      - name: clinic
        data_type: string
        description: "{{ doc('assigned_clinic') }}"
      - name: provider_name
        data_type: string
        description: "{{ doc('provider_name') }}"
      - name: bh_provider
        data_type: string
        description: "Canonical BH Provider filter dimension (alias of the slot provider_name) shared across all BH-summary marts so a single dashboard filter broadcasts to every metric."
      - name: is_bh_provider
        data_type: boolean
        description: "True if the slot belongs to a behavioral health provider."
      - name: appointment_type_name
        data_type: string
        description: "Full appointment type label for the slot."
      - name: appointment_type_short_name
        data_type: string
        description: "Short appointment type label for display."
      - name: is_telehealth
