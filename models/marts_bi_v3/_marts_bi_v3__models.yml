        description: "Scope column: clinically significant GAD patients (baseline >= 5) in remission (latest GAD < 5)."
      - name: phq_sig_response_pid
        data_type: "decimal(10,0)"
        description: "Scope column: clinically significant PHQ patients (baseline >= 5) with >= 50% score reduction."
      - name: gad_sig_response_pid
