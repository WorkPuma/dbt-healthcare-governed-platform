        data_type: string
        description: "Patient first name"
      - name: last_name
        data_type: string
        description: "Patient last name"
      - name: primary_payor
        data_type: string
        description: "Patient primary payor"
      - name: primary_product_type
        data_type: string
        description: "Patient primary product type"
      - name: primary_insurance
        data_type: string
