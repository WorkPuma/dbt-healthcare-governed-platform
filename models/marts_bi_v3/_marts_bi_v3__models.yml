      - name: unresolved_oid
        data_type: string
        description: "Scope column: outreach_id when call_outcome = unresolved, NULL otherwise. Used by metric() for count_distinct."
      - name: negative_oid
        data_type: string
        description: "Scope column: outreach_id when sentiment = negative, NULL otherwise. Used by metric() for count_distinct."
      - name: positive_oid
        data_type: string
        description: "Scope column: outreach_id when sentiment = positive, NULL otherwise. Used by metric() for count_distinct."
      - name: prov_unavail_oid
        data_type: string
        description: "Scope column: outreach_id when failure_category = provider_unavailable, NULL otherwise. Used by metric() for count_distinct."
      - name: pat_confused_oid
        data_type: string
        description: "Scope column: outreach_id when failure_category = patient_confused_by_ai, NULL otherwise. Used by metric() for count_distinct."
      - name: xfer_staff_oid
        data_type: string
        description: "Scope column: outreach_id when failure_category = transfer_to_staff, NULL otherwise. Used by metric() for count_distinct."
      - name: pat_unavail_oid
        data_type: string
        description: "Scope column: outreach_id when failure_category = patient_unavailable, NULL otherwise. Used by metric() for count_distinct."
      - name: contact_reached_pid
        data_type: string
        description: "Scope column: account_id when the patient contact was reached on this call, NULL otherwise. Used by metric() for count_distinct."
      - name: is_escalated_or_negative
        data_type: boolean
        description: "Boolean call disposition flag: true when the call was escalated to staff or had negative sentiment."
      - name: one
        data_type: int
        description: "Constant 1 for COUNT aggregations"
      - name: source_updated_at
        data_type: timestamp
        description: "CDF watermark — max(source_updated_at, last_updated_at) across upstream refs. Required for ServingDB TRIGGERED sync mode."
        constraints:
          - type: not_null
        tests:
    semantic_model:
      enabled: true
    agg_time_dimension: submitted_at
