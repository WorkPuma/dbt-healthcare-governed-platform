      - name: was_completed
        data_type: bigint
        description: "1 if the slot resulted in a completed (checked-in/out/charged) visit, else 0."
      - name: is_filled
        data_type: bigint
        description: "1 if the slot was filled (booked) at the time of extraction, else 0."
      - name: was_ever_booked
        data_type: bigint
        description: "1 if the slot was booked at any point, even if later cancelled, else 0."
      - name: has_open_slot
        data_type: bigint
        description: "1 if the slot remained open (never booked), else 0."
      - name: no_show_flag
        data_type: bigint
        description: "1 if the slot was a no-show ({{ doc('no_show') }}), else 0."
      - name: true_cancel_count
        data_type: bigint
        description: "Number of true cancellation events on this slot."
      - name: appointment_attempts
        data_type: bigint
        description: "Total booking attempts on this slot across its history."
      - name: slot_outcome
        data_type: string
        description: "Human-readable outcome label for the slot (e.g. Completed, Cancelled, No Show, Never Filled)."
      - name: slot_category
        data_type: string
        description: "Aggregated category used for capacity metrics: Scheduled, Cancelled, No Show, or Never Filled."
      - name: completed_int
        data_type: bigint
        description: "1 when was_completed = 1, else 0. Summable flag for completed slot counts."
      - name: scheduled_int
        data_type: bigint
        description: "1 when slot_category = 'Scheduled', else 0. Summable flag for scheduled slot counts."
      - name: cancelled_int
        data_type: bigint
        description: "1 when slot_category = 'Cancelled', else 0. Summable flag for cancelled slot counts."
      - name: no_show_int
        data_type: bigint
        description: "1 when slot_category = 'No Show', else 0. Summable flag for no-show slot counts."
      - name: never_filled_int
        data_type: bigint
        description: "1 when slot_category = 'Never Filled', else 0. Summable flag for never-filled slot counts."
      - name: utilized_int
        data_type: bigint
        description: "1 when is_filled = 1 OR was_ever_booked = 1, else 0. Denominator for utilization rate."
      - name: one
        data_type: bigint
        description: "Constant 1. Used as denominator in rate metrics (fill_rate, utilization_pct)."
      - name: source_updated_at
        data_type: timestamp
        description: "CDF watermark — max(source_updated_at, last_updated_at) across upstream refs. Required for ServingDB TRIGGERED sync mode."
        constraints:
          - type: not_null
        tests:
    # ─────────────────────────────────────────────────────────────────
    # mart_scheduling_daily_capacity  (grain: provider × clinic × dow × source)
    # SNAPSHOT sync — no date axis, monthly ML refresh.
    # ─────────────────────────────────────────────────────────────────
