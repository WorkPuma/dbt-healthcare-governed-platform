      - name: case_id
        data_type: string
        description: "Salesforce case ID linked to this AI Outreach outreach record."
      - name: case_number
        data_type: string
        description: "Salesforce case number"
      - name: athena_patient_id
        data_type: string
        description: "Athena patient ID (string, may need numeric parsing)"
      - name: patient_name
        data_type: string
        description: "Patient full name"
      - name: attempt_number
        data_type: int
        description: "Outreach attempt sequence number"
      - name: ai_outreach_sequence_id
        data_type: string
        description: "AI Outreach sequence identifier"
      - name: campaign_id
