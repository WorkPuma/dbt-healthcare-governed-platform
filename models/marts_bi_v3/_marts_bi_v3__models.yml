      month × payor. Tracks roster movement events (GAINED, RETAINED, LOST), payor shifts,
      tenure (consecutive_months), and dual-attribution. Time grain: as_of_month. Powers the
      Attribution Timeline and roster trend dashboards.
    config:
      contract:
        enforced: false # contract deferred: column data_types not yet verified for enforcement
      meta:
        cube: true
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced"]
    semantic_model:
      enabled: true
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]

    columns:
      - name: mart_attribution_timeline_id
        data_type: string
        description: "Surrogate PK — MD5(CONCAT_WS('|', <grain cols>)) over the natural grain. Required by servingdb_sync.py for synced-table registration."
