  - name: mart_tcm_visit
    description: >
      One row per TCM encounter (hospital discharge). Tracks transition-of-care
      appointment completion within 7/14/30 days of discharge plus exclusion
      reasons, readmissions, and high-utilizer flags. Date column:
      discharge_date. Powers the TCM dashboard.
    config:
      contract:
        enforced: false # contract deferred: column data_types not yet verified for enforcement
      meta:
        cube: true
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced"]
    semantic_model:
      enabled: true
    agg_time_dimension: discharge_date
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]

    columns:
      - name: mart_tcm_visit_id
        data_type: string
        description: "Surrogate PK — MD5(CONCAT_WS('|', <grain cols>)) over the natural grain. Required by servingdb_sync.py for synced-table registration."
        constraints:
          - type: not_null
        tests:
          - unique
      - name: patient_id
        data_type: string
        description: "{{ doc('patient_id') }}"
      - name: encounter_id
        data_type: string
        description: "Hospital ADT encounter identifier for this inpatient admission"
      - name: clinical_discharge_id
        data_type: string
        description: "Salesforce ClinicalEncounter ID (HealthCloudGA__EhrClinicalEncounter__c) for this discharge"
      - name: hospital
        data_type: string
        description: "Hospital or facility name where the patient was admitted"
      - name: source_system
        data_type: string
        description: "ADT feed source system (PointClickCare, PatientPing, or manual entry)"
      - name: admission_date
        data_type: date
        description: "Date the patient was admitted to the hospital"
      - name: discharge_date
        data_type: date
        description: "Date the patient was discharged from the hospital. Date column for time-based filtering."
      - name: length_of_stay
        data_type: bigint
        description: "Inpatient length of stay in days (discharge_date − admission_date)"
      - name: discharge_disposition
        data_type: string
        description: "Where the patient went at discharge (e.g., Home, SNF, Rehab)"
      - name: high_utilizer
        data_type: boolean
        description: "True when patient has 3+ hospital admissions in a rolling 12-month window"
      - name: readmission_flag
        data_type: boolean
        description: "True when this admission occurred within 30 days of a prior discharge"
      - name: primary_diagnosis_code
        data_type: string
        description: "Primary ICD-10 diagnosis code for this hospitalization"
      - name: diagnosis_description
        data_type: string
        description: "Human-readable description of the primary diagnosis code"
      - name: case_id
        data_type: string
        description: "Salesforce TCM Case ID linked to this discharge"
      - name: case_number
        data_type: string
        description: "Salesforce Case number for this TCM workflow"
      - name: case_status
        data_type: string
        description: "Current Salesforce TCM case status (Open, In Progress, Closed)"
      - name: toc_appointment_id
        data_type: string
        description: "Athena appointment ID for the scheduled transition-of-care visit"
      - name: toc_appointment_date
        data_type: date
        description: "Scheduled date of the transition-of-care follow-up appointment"
      - name: toc_completed_within_7_days
        data_type: boolean
        description: "True when a TOC visit was completed within 7 days of discharge"
      - name: toc_completed_within_14_days
        data_type: boolean
        description: "True when a TOC visit was completed within 14 days of discharge"
      - name: call_within_2_business_days
        data_type: boolean
        description: "True when the care team RN contacted the patient within 2 business days of discharge"
      - name: adt_disposition
        data_type: string
        description: "ADT feed disposition code from the source system"
      - name: adt_closed_reason
        data_type: string
        description: "Reason the ADT case was closed (e.g., Error ADT, Duplicate)"
      - name: delayed_notification
        data_type: boolean
        description: "True when the ADT notification arrived more than 24 hours after discharge"
      - name: days_to_toc
        data_type: bigint
        description: "Days from hospital discharge to completed transition-of-care appointment"
      - name: clinic
        data_type: string
        description: "Healthcare Org clinic the patient is attributed to"
      - name: is_excluded
        data_type: boolean
        description: "True when this encounter is excluded from the valid TCM denominator"
      - name: exclusion_reason
        data_type: string
        description: "Reason for exclusion (Error ADT, No Initial TCM Case, Test Patient, Duplicate)"
      - name: is_attributed
        data_type: boolean
        description: "True when patient is attributed to a Healthcare Org provider under a VBC contract"
      - name: attributed_payer
        data_type: string
        description: "VBC payor to which the patient is attributed (PAYOR_A, PAYOR_B, Medicare, etc.)"
      - name: valid_int
        data_type: bigint
        description: "Integer flag (1/0) for not excluded. Valid denominator. Used by SUM() in the metric() runtime."
      - name: excluded_int
        data_type: bigint
        description: "Integer flag (1/0) for is_excluded. Used by SUM() aggregations."
      - name: high_util_int
        data_type: bigint
        description: "Integer flag (1/0) for high_utilizer AND not excluded. Used by SUM() aggregations."
      - name: call_2d_int
        data_type: bigint
        description: "Integer flag (1/0) for call_within_2_business_days AND not excluded. Used by SUM() aggregations."
      - name: delayed_notif_int
        data_type: bigint
        description: "Integer flag (1/0) for delayed_notification AND not excluded. Used by SUM() aggregations."
      - name: toc_sched_7_int
        data_type: bigint
        description: "Integer flag (1/0) for TOC scheduled within 7 days AND not excluded. Used by SUM() aggregations."
      - name: toc_comp_7_int
        data_type: bigint
        description: "Integer flag (1/0) for TOC completed within 7 days AND not excluded. Used by SUM() aggregations."
      - name: toc_sched_14_int
        data_type: bigint
        description: "Integer flag (1/0) for TOC scheduled within 14 days AND not excluded. Used by SUM() aggregations."
      - name: toc_comp_14_int
        data_type: bigint
        description: "Integer flag (1/0) for TOC completed within 14 days AND not excluded. Used by SUM() aggregations."
      - name: toc_comp_30_int
        data_type: bigint
        description: "Integer flag (1/0) for TOC completed within 30 days AND not excluded. Used by SUM() aggregations."
      - name: toc_has_appt_int
        data_type: bigint
        description: "Integer flag (1/0) for has any TOC appointment AND not excluded. Used by SUM() aggregations."
      - name: toc_completed_int
        data_type: bigint
        description: "Integer flag (1/0) for any TOC completed AND not excluded. Used by SUM() aggregations."
      - name: readmission_int
        data_type: bigint
        description: "Integer flag (1/0) for readmission_flag AND not excluded. Used by SUM() aggregations."
      - name: admitted_not_disch_int
        data_type: bigint
        description: "Integer flag (1/0) for admitted with no discharge date yet. Used by SUM() aggregations."
      - name: excl_error_adt_int
        data_type: bigint
        description: "Integer flag (1/0) for exclusion_reason = 'Error ADT'. Used by SUM() aggregations."
      - name: excl_no_case_int
        data_type: bigint
        description: "Integer flag (1/0) for exclusion_reason = 'No Initial TCM Case'. Used by SUM() aggregations."
      - name: excl_test_int
        data_type: bigint
        description: "Integer flag (1/0) for exclusion_reason = 'Test Patient'. Used by SUM() aggregations."
      - name: excl_dup_int
        data_type: bigint
        description: "Integer flag (1/0) for exclusion_reason = 'Duplicate Case'. Used by SUM() aggregations."
      - name: disch_override_int
        data_type: bigint
        description: "Integer flag (1/0) for discharge date manually overridden. Used by SUM() aggregations."
      - name: source_updated_at
        data_type: timestamp
        description: "CDF watermark — max(source_updated_at, last_updated_at) across upstream refs. Required for ServingDB TRIGGERED sync mode."
        constraints:
          - type: not_null
        tests:
  # ─────────────────────────────────────────────────────────────────
  # mart_visit_type_cancellation_outcome  (grain: month × visit type)
  # ─────────────────────────────────────────────────────────────────
  - name: mart_visit_type_cancellation_outcome
    description: >
      Pre-aggregated monthly cohort — one row per cohort_month_start ×
      visit_type_class. Tracks hard leakage vs recovered cancellations by visit
      type to surface where patients drop out of care. Date column:
      cohort_month_start.
    config:
      contract:
        enforced: false # contract deferred: column data_types not yet verified for enforcement
      meta:
        cube: true
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced"]
    semantic_model:
      enabled: true
    agg_time_dimension: cohort_month_start
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]

    columns:
      - name: mart_visit_type_cancellation_outcome_id
        data_type: string
        description: "Surrogate PK — MD5(CONCAT_WS('|', <grain cols>)) over the natural grain. Required by servingdb_sync.py for synced-table registration."
        constraints:
          - type: not_null
        tests:
          - unique
      - name: cohort_month_start
        data_type: date
        description: "First day of the month this cancellation cohort was tracked. Date column for time-based filtering."
      - name: visit_type_class
        data_type: string
        description: "Visit type classification grouping (e.g., Routine, Initial Visit, AWV)"
      - name: cancelled_count
        data_type: bigint
        description: "Total appointments cancelled in this cohort month and visit type class"
      - name: recovered_count
        data_type: bigint
        description: "Cancelled appointments that were rescheduled and completed within the recovery window"
      - name: drift_count
        data_type: bigint
        description: "Cancelled appointments where patient rescheduled but outside the immediate recovery window"
      - name: hard_leakage_count
        data_type: bigint
        description: "Cancelled appointments never recovered — patient did not return for this visit type"
      - name: recovered_pct
        data_type: double
        description: "Recovery rate: recovered cancellations as a percentage of total cancellations"
      - name: drift_pct
        data_type: double
        description: "Drift rate: late-recovery cancellations as a percentage of total cancellations"
      - name: hard_leakage_pct
        data_type: double
        description: "Hard leakage rate: unrecovered cancellations as a percentage of total cancellations"
      - name: source_updated_at
        data_type: timestamp
        description: "Timestamp of last source update"

  # ─────────────────────────────────────────────────────────────────
  # mart_hcc_coder_contribution  (grain: visit_id × coder_name)
  # Powers HCC coder scrub metrics. CDF-synced via TRIGGERED.
  # ─────────────────────────────────────────────────────────────────
  - name: mart_hcc_coder_contribution
    description: >
      Tracks HCC coding scrub activity per coder per visit.
      Grain: one row per visit x coder (visit_id x coder_name). Answers: How many HCC
      codes did each coder auto-generate, manually add, or accept during a scrub session?
      Date column: encounter_date. Powers the HCC Assessment dashboard.
    config:
      contract:
        enforced: false
      meta:
        cube: true
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced"]
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]

    columns:
      - name: mart_hcc_coder_contribution_id
        data_type: string
        description: "Surrogate PK — MD5(visit_id|coder_name). Required by servingdb_sync.py."
        constraints:
          - type: not_null
        tests:
          - unique
      - name: coder_name
        data_type: string
        description: "Name of the HCC coder who performed the scrub for this visit"
      - name: provider_name
        data_type: string
        description: "{{ doc('provider_name') }}"
      - name: department
        data_type: string
        description: "Athena department (clinic) where the encounter occurred"
      - name: encounter_date
        data_type: date
        description: "Date of the clinical encounter that was scrubbed by the coder"
      - name: scrub_date
        data_type: date
        description: "Date the coder performed the HCC scrub review"
      - name: visit_id
        data_type: string
        description: "Athena appointment ID for the encounter being scrubbed"
      - name: is_reviewed_by_coder
        data_type: boolean
        description: "True when the coder completed a full review of HCC suggestions for this visit"
      - name: icd_autogenerated
        data_type: string
        description: "String boolean ('true'/'false'): whether VendorNav auto-generated any ICD-10 codes for this visit"
      - name: hcc_autogenerated
        data_type: string
        description: "String boolean ('true'/'false'): whether VendorNav auto-generated any HCC codes for this visit"
      - name: hcc_accepted
        data_type: string
        description: "String boolean ('true'/'false'): whether any HCC codes were accepted during the scrub session"
      - name: hcc_added_manually
        data_type: string
        description: "String boolean ('true'/'false'): whether the coder manually added any HCC codes"
      - name: codes_added_manually
        data_type: string
        description: "String boolean ('true'/'false'): whether the coder manually added any ICD-10 codes"
      - name: hcc_value_captured
        data_type: double
        description: "Total RAF value from HCC codes accepted during this coder scrub session"
      - name: coder_acceptance_rate
        data_type: double
        description: "Pre-calculated fraction of HCC suggestions accepted by the coder for this visit"
      - name: last_synced_at
        data_type: timestamp
        description: "Timestamp of the most recent sync from the VendorNav HCC coder source view"
      - name: reviewed_int
        data_type: bigint
        description: "Integer flag (1/0) for coder review completion. Used by SUM() aggregations in the metric() runtime."
      - name: icd_autogenerated_int
        data_type: bigint
        description: "Integer flag (1/0) for visits with VendorNav auto-generated ICD-10 codes. Used by SUM() aggregations in the metric() runtime."
      - name: hcc_autogenerated_int
        data_type: bigint
        description: "Integer flag (1/0) for visits with VendorNav auto-generated HCC codes. Used by SUM() aggregations in the metric() runtime."
      - name: hcc_accepted_int
        data_type: bigint
        description: "Integer flag (1/0) for visits where HCC codes were accepted. Used by SUM() aggregations in the metric() runtime."
      - name: hcc_added_manually_int
        data_type: bigint
        description: "Integer flag (1/0) for visits where the coder manually added HCC codes. Used by SUM() aggregations in the metric() runtime."
      - name: codes_added_manually_int
        data_type: bigint
        description: "Integer flag (1/0) for visits where the coder manually added ICD-10 codes. Used by SUM() aggregations in the metric() runtime."
      - name: source_updated_at
        data_type: timestamp
        description: "CDF watermark — max(source_updated_at, last_updated_at) across upstream refs. Required for ServingDB TRIGGERED sync mode."
        constraints:
          - type: not_null
        tests:
    # ─────────────────────────────────────────────────────────────────
    # mart_bh_scheduling_capacity  (grain: slot_id)
    # ─────────────────────────────────────────────────────────────────
    semantic_model:
      enabled: true
    agg_time_dimension: encounter_date
  - name: mart_bh_scheduling_capacity
    description: >
      BH slot utilization at the slot grain. Captures slot outcome
      (Scheduled/Cancelled/No Show/Never Filled). Powers the BH scheduling
      capacity dashboard.
    config:
      contract:
        enforced: true
      meta:
        cube: true
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced"]
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]

    columns:
      - name: mart_bh_scheduling_capacity_id
        data_type: string
        description: "Surrogate PK — MD5(slot_id). Required by servingdb_sync.py."
        constraints:
          - type: not_null
        tests:
          - unique
      - name: slot_id
        data_type: string
        description: "Natural slot key: CONCAT(appointmentdate, appointmentstarttime, departmentid, providerid)."
      - name: appointmentdate
        data_type: date
        description: "Calendar date of the slot."
      - name: appointmentstarttime
        data_type: string
        description: "Scheduled start time of the slot (HH:MM)."
      - name: slot_duration
