  # ─────────────────────────────────────────────────────────────────
  # mart_attribution_operations  (grain: one row per roster patient)
  # ─────────────────────────────────────────────────────────────────
  - name: mart_attribution_operations
    description: >
      Current-snapshot view of every attributed patient with effort vs. success scoring and
      operational segment classification. Row = one attributed patient. Answers questions about
      roster status, AWV/MDDO completion, and outreach effectiveness. No date column (snapshot).
      Powers the Attribution Operations dashboard and effort-gap analysis.
    config:
      contract:
        enforced: false # contract deferred: column data_types not yet verified for enforcement
      meta:
        cube: true
      tags: ["marts_bi_v3", "cube", "BIPlatform", "v3_synced"]
    semantic_model:
      enabled: true
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]

    columns:
      - name: mart_attribution_operations_id
        data_type: string
        description: "Surrogate PK — MD5(CONCAT_WS('|', <grain cols>)) over the natural grain. Required by servingdb_sync.py for synced-table registration."
        constraints:
          - type: not_null
        tests:
          - unique
      - name: patient_id
        data_type: bigint
        description: "{{ doc('patient_id') }}"
        data_tests:
          - relationships:
