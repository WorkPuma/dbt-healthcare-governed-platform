version: 2

models:
  - name: mv_attribution_self_service
    description: |
      **Unified Patient Attribution Self-Service Model**

      Single source of truth for all patient attribution data, consolidating
      Salesforce attribution records with patient demographics, clinical status,
      appointment tracking, and case management.

      **Key Features:**
      - Patient demographics and contact info
      - Attribution status and payor information
      - AWV (Annual Wellness Visit) tracking with actionability flags
      - MDDO (MD/DO Visit) tracking with actionability flags
      - Off-Cadence follow-up tracking
      - Appointment scheduling status
      - Portal access flags for all major payors
      - Data quality scoring
      - Derived action_required field for workflows

      **Used By:**
      - Volume Attribution Dashboard (Superset/BIPlatform)
      - WBR Ops Metrics Dashboard
      - AWV Scheduling Reports
      - Case Management Workflows
      - SemanticLayer Semantic Layer

      **Refresh Schedule:** Every 10 hours (table materialization)

    config:
      contract:
        enforced: true
      meta:
        cube: true
      tags: [ "attribution", "self_service", "vbc", "cube" ]

    tests:
      # MERGE-never-deletes drift: attribution_ids in target that no longer exist in
      # raw salesforce.attribution__c (hard-deleted from SF). 15,906 such phantoms were
      # cleaned 2026-04-28 (44% of table). Test prevents silent re-accumulation.
      - no_filter_drift:
          arguments:
            key_column: attribution_id
            source_database: databricks_prod
            source_schema: salesforce
            source_identifier: attribution__c
            source_key_column: Id
          config:
            severity: warn
            tags: [ "elementary", "filter_drift", "data_quality" ]

      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]
    columns:
      - name: attribution_id
        data_type: string
        description: Salesforce Attribution record ID (Primary Key)
        constraints:
          - type: not_null
        tests:
          - unique

      - name: account_id
        data_type: string
        description: Salesforce Account ID (Patient)
        constraints:
          - type: not_null

      - name: patient_id
        data_type: string
        description: Athena Patient ID (links to MDM)

      - name: patient_name
        data_type: string
        description: Full patient name from Account

      - name: clinic
        data_type: string
        description: Assigned clinic/department

      - name: provider_name
        data_type: string
        description: Primary Care Provider name

      - name: payor_category
        data_type: string
        description: Derived payor category (Original Medicare, Medicare Advantage,
          PAYOR_A, PAYOR_B, etc.)

      - name: payor_brand
        data_type: string
        description: Derived payor brand for dashboard filtering

      - name: attribution_status
        data_type: string
        description: Current attribution status

      - name: is_active
        data_type: boolean
        description: Whether attribution is currently active

      - name: workflow_type
        data_type: string
        description: Derived workflow type for case routing

      - name: data_quality_score
        data_type: int
        description: Calculated data quality score (0-100)

      - name: awv_visit_status
        data_type: string
        description: AWV visit status (Eligible, Scheduled, Completed, Not Required)

      - name: awv_is_actionable
        data_type: boolean
        description: Flag indicating if AWV action is needed

      - name: awv_is_completed
        data_type: boolean
        description: Flag indicating if AWV is completed

      - name: awv_is_scheduled
        data_type: boolean
        description: Flag indicating if AWV is scheduled

      - name: mddo_visit_status
        data_type: string
        description: MD/DO visit status

      - name: mddo_is_actionable
        data_type: boolean
        description: Flag indicating if MDDO action is needed

      - name: mddo_is_completed
        data_type: boolean
        description: Flag indicating if MDDO visit is completed

      - name: mddo_is_scheduled
        data_type: boolean
        description: Flag indicating if MDDO visit is scheduled

      - name: off_cadence_active
        data_type: boolean
        description: Flag indicating if patient is off-cadence

      - name: action_required
        data_type: string
        description: Derived action required (Off Cadence, Needs AWV, Needs MDDO, No
          Action Required)

      - name: next_scheduled_visit
        data_type: timestamp
        description: Next scheduled appointment datetime

      - name: source_updated_at
        data_type: timestamp
        description: Source-system timestamp tracking when upstream data last changed
          (replaces mv_refresh_timestamp for CDF-accurate change detection)

      - name: attribution_name
        data_type: string
        description: Attribution record name

      - name: patient_first_name
        data_type: string
        description: Patient first name

      - name: patient_last_name
        data_type: string
        description: Patient last name

      - name: patient_email
        data_type: string
        description: Patient email address

      - name: patient_dob
        data_type: date
        description: Patient date of birth

      - name: patient_gender
        data_type: string
        description: Patient gender

      - name: patient_status
        data_type: string
        description: Patient active status (a=active, i=inactive, p=prospect, d=deceased)

      - name: is_active_patient
        data_type: boolean
        description: Whether the patient is currently active

      - name: risk_tier
        data_type: string
        description: Patient risk tier classification

      - name: provider_id
        data_type: string
