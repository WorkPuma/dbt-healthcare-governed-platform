version: 2

# =============================================================================
# SAVED QUERIES
# Pre-built metric queries for common use cases, optimized for BI consumption.
#
# These centralize the metric + grain combinations that BI pulls repeatedly, so
# the definitions live in the semantic layer (single source of truth) instead of
# being re-expressed per dashboard. Intentionally declared WITHOUT `exports:` —
# they create no warehouse objects at build time; they are validated by
# `dbtf parse` in CI and queryable via the dbt Semantic Layer / `dbt sl`. Add an
# `exports:` block (with a target schema) only when a materialized copy is needed.
# =============================================================================

saved_queries:
  # New Patient Visits — weekly trend of the headline volume + rate metrics.
  # Uses metric_time (the primary agg-time dimension, period_start) only, which
  # is guaranteed valid for every NPV metric; categorical slices are added per
  # dashboard once declared as dimensions on the mart's semantic_model.
  - name: npv_weekly_overview
    description: |
      Weekly New Patient Visit volumes and conversion/recovery rates.
      Use for: NPV Dashboard headline trend, weekly operating review.
      Combines the simple measures (mart_npv_weekly) with the ratio metrics
      (sem_npv) so every consumer agrees on the rate math.
    label: "NPV Weekly Overview"
    query_params:
      metrics:
        - total_npv
        - completed_npv
        - cancelled_npv
        - total_recovered_npv
        - npv_completion_rate
        - npv_cancellation_rate
        - npv_recovery_rate
      group_by:
        - "TimeDimension('metric_time', 'week')"

  # Membership-segmented NPV monthly view for the MBR operating review.
  - name: npv_membership_monthly
    description: |
      Monthly NPV volumes scoped to the commercial-membership population.
      Use for: MBR operating review, membership funnel reporting.
    label: "NPV Membership (Monthly)"
    query_params:
      metrics:
        - mbr_total_npv
        - mbr_cancelled_npv
        - mbr_total_recovered_npv
        - mbr_npv_cancellation_rate
        - mbr_npv_recovery_rate
      group_by:
        - "TimeDimension('metric_time', 'month')"

