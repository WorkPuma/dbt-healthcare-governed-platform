      - name: disposition_name
        data_type: string
        description: '{{ doc("nice_disposition") }}'
      - name: disposition_outcome
        data_type: string
        description: "System-level outcome classification."
      - name: end_reason
        data_type: string
        description: "How the contact ended."
      - name: from_address
        data_type: string
        description:
          "Originating address (phone number, email, or chat handle) of the
          contact."
      - name: to_address
        data_type: string
        description:
          "Destination address (phone number, email, or chat handle) of the
          contact."
      - name: caller_first_name
        data_type: string
        description: "First name of the caller, if available from ANI lookup."
      - name: caller_last_name
        data_type: string
        description: "Last name of the caller, if available from ANI lookup."
      - name: is_outbound
