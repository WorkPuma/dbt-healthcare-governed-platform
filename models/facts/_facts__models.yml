  - name: attribution_timeline
    description: >
      Enriched longitudinal attribution fact combining attribution_history and
      attribution_movement. Adds is_truly_lost, dual-attribution, movement
      events, cross-payor shift detection, insurance change reasons, and
      consecutive tenure. Grain: one row per identity_id x attributed_payor x
      as_of_month.
    config:
      contract:
        enforced: true
      tags: ["fact", "cube", "BIPlatform", "attribution", "hourly"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - identity_id
              - attributed_payor
              - as_of_month
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: as_of_month
          config:
            severity: warn
            tags: ["elementary", "volume", "cube_contract"]
    columns:
      - name: golden_id
        data_type: string
        description: "EMPI golden record ID"
      - name: identity_id
        data_type: string
        description: "{{ doc('identity_id') }}"
      - name: entity_id
        data_type: string
        description: "{{ doc('entity_id') }}"
      - name: is_ghost
        data_type: boolean
        description: "True when the EMPI identity has no Athena chart (payor-origin roster member)."
      - name: is_vendorblue
        data_type: boolean
        description: >
          True when this PAYOR_B H2001 attribution row's effective attributed clinic
          TIN equals the VendorBlue TIN (204841281). Always false for non-PAYOR_B
          payors. Point-in-time per as_of_month.
      - name: match_status
        data_type: string
        description: "EMPI match state: MATCHED, ROSTER_ONLY, or approval workflow status."
      - name: patient_id
        data_type: bigint
        description: "Athena Patient ID"
      - name: salesforce_id
        data_type: string
        description: "Salesforce Account ID"
      - name: patient_name
        data_type: string
        description: "Patient full name"
      - name: patient_date_of_birth
        data_type: string
        description: "Patient date of birth"
      - name: preferred_clinic
        data_type: string
        description: "MDM-standardized clinic name from patient dimension"
      - name: primary_provider_id
        data_type: bigint
        description:
          "Athena PRIMARYPROVIDERID — canonical join key for the patient's
          primary care provider."
      - name: primary_care_provider
        data_type: string
        description:
          "Primary care provider display name (resolved from providers
          dimension via primary_provider_id)."
      - name: attributed_payor
        data_type: string
        description: "Payor from roster (PAYOR_A, PAYOR_B, MEDICARE, AHA, PAYOR_C, PAYOR_DELTA)"
      - name: payor_member_id
        data_type: string
        description: "Payor-assigned member ID"
      - name: market_segment
        data_type: string
        description: "Market segment from payor roster"
      - name: attribution_subtype
        data_type: string
        description: "Attribution subtype from the payor roster (e.g. PAYOR_B mbr_typ_cd; Medicare MSSP mbr_typ_cd such as Aged/Non-Dual)"
      - name: as_of_month
        data_type: date
        description: "Roster month"
      - name: attribution_year
        data_type: int
        description: "Year of the attribution month"
      - name: year_month
        data_type: string
        description: "Year-month string (yyyy-MM)"
      - name: is_current_attribution
        data_type: boolean
        description: "True if this is the most recent roster month for this payor"
      - name: patient_status
        data_type: string
        description: "MDM computed patient status"
      - name: is_active_patient
        data_type: boolean
        description: "True if patient is Active per MDM"
      - name: match_type
        data_type: string
        description: "EMPI match type"
      - name: file_source
        data_type: string
        description: "Source roster file"
      - name: attributed_provider_id
        data_type: decimal(38,0)
        description: >
          Resolved Athena provider_id from MDM provider master for the
          payor-attributed PCP (sourced from attribution_history via
          int_attribution_provider_match). NULL when no MDM match (typically
          external/referring providers).
      - name: attributed_provider_name
        data_type: string
        description: >
          Display name of the attributed provider — canonical MDM name when
          matched (e.g. "Leah Carver"), otherwise the raw payor-supplied string
          verbatim (e.g. "VELIN, LAUREN A") so external/referring providers stay
          visible.
      - name: attributed_provider_npi
        data_type: string
        description: >
          NPI of the attributed provider — canonical MDM NPI when matched,
          otherwise the raw payor-supplied NPI.
      - name: attributed_provider_match_method
        data_type: string
        description: >
          How the provider was resolved: 'npi', 'name', 'last_name', or
          'unmatched'. NULL for Medicare-FFS rows.
        tests:
          - accepted_values:
              arguments:
                values: ["npi", "name", "last_name", "unmatched"]
              config:
                severity: warn
      - name: movement_event
        data_type: string
        description: "GAINED, RETAINED, or LOST from month-over-month comparison"
      - name: shifted_from_payor
        data_type: string
        description: "Payor the patient shifted from (NULL if not a shift)"
      - name: shifted_to_payor
        data_type: string
        description: "Payor the patient shifted to (NULL if not a shift)"
      - name: is_payor_shift
        data_type: boolean
        description:
          "True if patient was LOST from one payor and GAINED at another in
          the same month"
      - name: is_truly_lost
        data_type: boolean
        description:
          "True if patient was on roster but not on the latest month for this
          payor"
      - name: payor_count_in_month
        data_type: bigint
        description: "Number of payors attributing this patient in the same month"
      - name: is_dual_attributed
        data_type: boolean
        description: "True if patient appears on 2+ payor rosters in the same month"
      - name: concurrent_payors
        data_type: string
        description: "Comma-separated list of concurrent payors in the same month"
      - name: consecutive_months
        data_type: int
        description: "Running count of consecutive months on this payor"
      - name: prior_payor
        data_type: string
        description: "Previous payor from prior month (for shift detection)"
      - name: insurance_change_reason
        data_type: string
        description:
          "Categorized reason: NEW_ATTRIBUTION, PAYOR_SWITCH, PAYOR_DROPPED,
          FULLY_LOST, STABLE"
      - name: data_freshness
        data_type: string
        description: "CURRENT if within 60 days, STALE otherwise"
      - name: source_updated_at
        data_type: timestamp
        description: "CDF watermark for downstream ServingDB TRIGGERED sync. Derived from upstream attribution_history.source_updated_at. Required for incremental merge mode; do not remove."

  - name: attribution_operations
    description: >
      Effort vs success attribution model. Marries roster/EMPI attribution data
      with Salesforce operational effort to track AWV, MDDO, off-cadence work
      and measure effort-to-outcome conversion. Includes operational segments
      and effort/success scoring. Grain: one row per patient_id (current
      snapshot). This operational patient fact intentionally requires a non-null
      Athena patient_id, so roster-only identities retained by attribution_history
      are excluded here while remaining available to relationship-grain
      attribution consumers.
    config:
      materialized: table
      contract:
        enforced: true
      tags: ["fact", "cube", "BIPlatform", "attribution", "hourly"]
    tests:
      # MERGE-never-deletes drift: patient_ids in target that no longer exist in
      # int_attribution_global. 92 phantoms cleaned 2026-04-28 (and 118 in the Fabric
      # wrapper view). Cascades from drift in upstream patient/EMPI sources.
      - no_filter_drift:
          arguments:
            key_column: patient_id
            source_model: int_attribution_global
          config:
            severity: warn
            tags: ["elementary", "filter_drift", "data_quality"]
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]
    columns:
      - name: patient_id
        data_type: bigint
        description: "Athena Patient ID (Primary Key)"
        constraints:
          - type: not_null
        data_tests:
          - unique
          - relationships:
              arguments:
                to: ref('patients')
                field: patient_id
              config:
                severity: warn

      - name: golden_id
        data_type: string
        description: "EMPI golden record ID"
      - name: salesforce_id
        data_type: string
        description: "Salesforce Account ID"
      - name: patient_name
        data_type: string
        description: "Patient full name"
      - name: patient_date_of_birth
        data_type: date
        description: "Patient date of birth"
      - name: patient_status
        data_type: string
        description: "MDM computed patient status"
      - name: preferred_clinic
        data_type: string
        description: "Patient preferred clinic"
      - name: primary_provider_id
        data_type: bigint
        description:
          "Athena PRIMARYPROVIDERID — canonical join key for the patient's
          primary care provider."
      - name: primary_care_provider
        data_type: string
        description:
          "Primary care provider display name (resolved from providers
          dimension via primary_provider_id)."
      - name: mdm_payor_category
        data_type: string
        description: "MDM canonical payor category"
      - name: mdm_payor_brand
        data_type: string
        description: "Primary payor brand from MDM"
      - name: is_empi_attributed
        data_type: boolean
        description: "True if patient appears on any current EMPI-matched payor roster"
      - name: primary_attributed_payor
        data_type: string
        description: "Highest-priority attributed payor"
      - name: secondary_attributed_payor
        data_type: string
        description: "Second-highest-priority attributed payor (multi-slot attribution), sourced from int_attribution_global."
      - name: attribution_slot_source
        data_type: string
        description: "Source of the attribution slot assignment (e.g. roster/claims vs voluntary), sourced from int_attribution_global."
      - name: primary_attribution_subtype
        data_type: string
        description: "Attribution subtype for primary payor"
      - name: is_voluntary
        data_type: boolean
        description: "True if primary attribution is voluntary alignment only"
      - name: is_net_attributed
        data_type: boolean
        description: "True if attributed minus Medicare voluntary"
      - name: population_segment
        data_type: string
        description: "Attributed - Voluntary, Attributed - Claims/Roster, or Unattributed"
      - name: roster_attributed_payor
