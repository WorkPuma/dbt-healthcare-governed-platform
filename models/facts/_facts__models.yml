  - name: heartwise
    description: >
      Heartwise (CHF) candidate identification fact. Identifies patients meeting
      CHF clinical criteria and tracks program enrollment. Enriched with EMPI
      identity. Source: healthcare.vw_heartwise_candidates. Grain: One row per
      patient candidate.
    config:
      contract:
        enforced: true
      meta:
        cube: true
        # Heartwise candidate identification runs weekly. Cache-saga freshness
        # watchdog SLO: warn after 7d, hard-fail after 14d.
        freshness_slo_hours: 168
        freshness_hard_fail_hours: 336
      tags: ["fact", "cube", "BIPlatform", "heartwise", "clinical_programs"]
    tests:
      # Schema drift blocks deploy — protects Heartwise dashboard cards
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]
    columns:
      - name: patient_id
        data_type: bigint
        description: "{{ doc('patient_id') }}"
        constraints:
          - type: not_null
        data_tests:
          - unique
          - relationships:
              arguments:
                to: ref('patients')
                field: patient_id
              config:
                severity: warn

      - name: golden_id
        data_type: string
        description: "{{ doc('golden_id') }}"
      - name: enterprise_id
        data_type: bigint
        description: "Enterprise ID from source"
      - name: first_name
        data_type: string
        description: "Patient first name"
      - name: last_name
        data_type: string
        description: "Patient last name"
      - name: date_of_birth
        data_type: date
        description: "Patient date of birth"
      - name: heartwise_status
        data_type: string
        description: "Heartwise program status"
      - name: source_updated_at
        data_type: timestamp
        description:
          "Source-system timestamp tracking when upstream data last changed.
          Used for CDF-accurate change detection."
      - name: provider_group_id
        data_type: string
        description: "Provider group assignment from EMPI"
      - name: chart_group_name
        data_type: string
        description: "Chart group name from EMPI identity bridge"
      - name: medicare_beneficiary_id
        data_type: string
        description: "Medicare Beneficiary Identifier (MBI)"

  - name: call_center_interactions
    description: >
      Call center interaction fact model. One row per NICE CXone contact (call,
      chat, email). Joins staged contacts with agent, skill, team, and campaign
      dimensions. Exposes timing metrics (queue wait, handle time, talk, hold,
      ACW), routing details, disposition, and service level flags. Tagged for
      BIPlatform / Lakeview / metric-view consumption. Source: stg_nice__contacts +
      stg_nice__agents + stg_nice__skills + nice.team + nice.campaign. Grain:
      One row per contact_id.
    config:
      contract:
        enforced: true
      meta:
        cube: true
      tags: ["fact", "cube", "BIPlatform", "nice", "call_center"]
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: contact_start_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]
    columns:
      - name: contact_id
        data_type: bigint
        description: '{{ doc("nice_contact_id") }}'
        constraints:
          - type: not_null
        tests:
          - unique:
              config:
