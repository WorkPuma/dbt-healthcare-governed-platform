version: 2

models:
  - name: appointments
    description: >
      Canonical appointment fact. Consolidates scheduling data from
      vw_operating_review_appointments enriched with conformed dimension keys
      for patient identity, provider, location, and appointment type. Includes
      initial visit derivation, NPV recovery logic, and slot status
      classification. Grain: One row per appointment_id.
    config:
      contract:
        enforced: true
      meta:
        cube: true
        servingdb_sync: true
        servingdb_mode: TRIGGERED
        # Source refreshes once per day after the Athenahealth share push
        # completes (~02:00-04:00 UTC). 4h global SLO is wrong for this cadence
        # and was generating ~hourly false-positive ErrorTracking alerts. Read by
        # prefect-jobs/cache_saga.py and surfaced to the BIPlatform freshness watchdog
        # via cube_dependency_map.json.
        freshness_slo_hours: 30
        freshness_hard_fail_hours: 48
      tags: ["fact", "cube", "BIPlatform"]
    tests:
      # Upstream schema drift blocks deploy — protects operating review dashboard cards
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: appointment_date
          config:
            severity: warn
            tags: ["elementary", "volume", "cube_contract"]
      # MERGE-never-deletes drift: appointment_ids in target that no longer exist in
      # vw_operating_review_appointments. 2,465 phantoms cleaned 2026-04-28; cascades
      # from athena.appointment hard-deletes (appointmentdeleteddatetime set after merge).
      - no_filter_drift:
          arguments:
            key_column: appointment_id
            source_model: vw_operating_review_appointments
          config:
            severity: warn
            tags: ["elementary", "filter_drift", "data_quality"]
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]
    columns:
      - name: appointment_id
        data_type: decimal(10,0)
        description: "Athena Appointment ID (Primary Key)"
        constraints:
          - type: not_null
        tests:
          - unique:
              config:
                severity: error
      - name: patient_id
        data_tests:
          - relationships:
              arguments:
                to: ref('patients')
                field: patient_id
              config:
                severity: warn
        data_type: decimal(10,0)
        description: "{{ doc('patient_id') }}"
      - name: golden_id
        data_type: string
        description: "{{ doc('golden_id') }}"
      - name: provider_id
        data_type: decimal(10,0)
        description: "Athena Provider ID"
        tests:
          - relationships:
              arguments:
                to: ref('providers')
                field: provider_id
              config:
                severity: warn
                where: "provider_id IS NOT NULL AND provider_id NOT IN
                  (22,23,24,25,30,41,43,77)"
                description:
                  "Excludes lab/imaging/system scheduling entities that are valid in
                  Athena but filtered from the providers dimension by MDM
                  (Non_Provider)."
                tags: ["referential_integrity", "provider_linkage"]
      - name: department_id
        data_type: decimal(10,0)
        description: "Athena Department ID"
      - name: appointment_type_id
        data_type: decimal(10,0)
        description: "Athena Appointment Type ID"
      - name: clinic_name
        data_type: string
        description: "{{ doc('patient_facing_clinic') }}"
      - name: visit_category
        data_type: string
        description: "Derived visit category from appointment_types dimension"
      - name: is_initial_visit
        data_type: boolean
        description: "{{ doc('initial_visit') }}"
      - name: is_npv
        data_type: boolean
        description: "True if this is a New Patient Visit (Initial Visit type)"
      - name: is_awv
        data_type: boolean
        description: "{{ doc('awv_visit') }}"
      - name: is_completed
        data_type: boolean
        description: "{{ doc('appointment_completed') }}"
      - name: is_cancelled
        data_type: boolean
        description: "{{ doc('appointment_cancelled') }}"
      - name: is_no_show
        data_type: boolean
        description:
          "True if appointment was cancelled on or after the appointment date
          (cancel_date >= appt_date). Subset of is_cancelled. Mutually exclusive
          with is_rescheduled and is_truly_cancelled."
      - name: is_rescheduled
        data_type: boolean
        description:
          "True if appointment was cancelled before the appointment date AND
          the patient scheduled another visit within 30 days. Subset of
          is_cancelled. Mutually exclusive with is_no_show and
          is_truly_cancelled."
      - name: is_truly_cancelled
        data_type: boolean
        description:
          "True if appointment was cancelled before the appointment date AND
          the patient did NOT schedule another visit within 30 days. Subset of
          is_cancelled. Mutually exclusive with is_no_show and is_rescheduled."
      - name: cancellation_category
        data_type: string
        description:
          "Universal cancellation classification: 'No Show' (cancelled
          on/after appt date), 'Rescheduled' (cancelled before appt date, new
          visit within 30 days), 'Truly Cancelled' (cancelled before appt date,
          no new visit within 30 days), or NULL (not cancelled)."
      - name: appointment_date
        data_type: date
        description:
          "Calendar date of the appointment from Athena APPOINTMENTDATE.
          Primary time dimension for appointment trending and scheduling
          analysis."
      - name: npv_recovery_category
        data_type: string
        description:
          "NPV recovery classification: Immediate Reschedule, Late Recovery,
          Truly Lost"
      - name: salesforce_id
        data_type: string
        description: "Salesforce Account ID from EMPI identity bridge"
      - name: enterprise_id
        data_type: "decimal(10,0)"
        description: "Enterprise patient ID from EMPI identity bridge"
      - name: provider_group_id
        data_type: string
        description: "Provider group assignment from EMPI"
      - name: chart_group_name
        data_type: string
        description: "Chart group name from EMPI identity bridge"
      - name: provider_clinic
        data_type: string
        description: "Provider's assigned clinic name"
      - name: is_patient_facing
        data_type: boolean
        description: "True if clinic is a patient-facing location"
      - name: clinic_type
        data_type: string
        description: "Clinic classification from clinics dimension"
      - name: service_location
        data_type: string
        description: "Service location / patient-facing clinic name"
      - name: provider_name
        data_type: string
        description: "{{ doc('provider_name') }}"
      - name: is_physician
        data_type: boolean
        description: "True if provider is a physician (MD/DO)"
      - name: is_mid_level
        data_type: boolean
        description: "True if provider is a mid-level (NP/PA)"
      - name: is_bh_provider
        data_type: boolean
        description: "True if provider is a behavioral health provider (MDM-curated flag)"
      - name: appointment_type_name
        data_type: string
        description: "Full appointment type name from Athena"
      - name: appointment_type_short_name
        data_type: string
        description: "Abbreviated appointment type name"
      - name: appointment_type_duration
        data_type: int
        description: "Default duration in minutes for the appointment type"
      - name: is_telehealth
        data_type: boolean
        description: "True if appointment is a telehealth visit"
      - name: is_behavioral_health
        data_type: boolean
        description: "Behavioral health visit flag from MDM appointment type classification"
      - name: is_open_slot
        data_type: boolean
        description: "True if slot status is Open"
      - name: is_filled_slot
        data_type: boolean
        description: "True if slot status is Filled/Booked"
      - name: is_checked_in
        data_type: boolean
        description: "True if patient has checked in"
      - name: is_future_appointment
        data_type: boolean
        description: "True if appointment date is in the future"
      - name: appointment_week
        data_type: timestamp
        description: "Truncated to week start for weekly trending"
      - name: appointment_month
        data_type: timestamp
        description: "Truncated to month start for monthly trending"
      - name: appointment_year
        data_type: int
        description: "Year extracted from appointment_date"
      - name: appointment_start_time
        data_type: string
        description: "Scheduled start time of the appointment"
      - name: appointment_duration_minutes
        data_type: decimal(10,0)
        description: "Actual duration of the appointment in minutes"
      - name: scheduled_datetime
        data_type: timestamp
        description: "Date/time the appointment was originally scheduled"
      - name: scheduled_by
        data_type: string
        description: "User who scheduled the appointment"
      - name: cancelled_datetime
        data_type: timestamp
        description: "Date/time the appointment was cancelled"
      - name: cancellation_week
        data_type: timestamp
        description: "Cancellation date truncated to week start"
      - name: cancellation_month
        data_type: timestamp
        description: "Cancellation date truncated to month start"
      - name: cancellation_reason
        data_type: string
        description: "Reason for appointment cancellation"
      - name: cancelled_by
        data_type: string
        description: "User who cancelled the appointment"
      - name: rescheduled_to_appointment_id
        data_type: decimal(10,0)
        description: "Appointment ID this was rescheduled to"
      - name: reschedule_datetime
        data_type: timestamp
        description: "Date/time the appointment was rescheduled"
      - name: rescheduled_by
        data_type: string
        description: "User who rescheduled the appointment"
      - name: check_in_datetime
        data_type: timestamp
        description: "Date/time the patient checked in"
      - name: check_out_datetime
        data_type: timestamp
        description: "Date/time the patient checked out"
      - name: primary_insurance_name
        data_type: string
        description: "Primary insurance package name (waterfall: claim billed →
          eligibility → appointment)"
      - name: primary_payor
        data_type: string
        description:
          "MDM payor_brand for the patient's current primary insurance (e.g.
          PAYOR_A, UCare, PAYOR_B, Medicare FFS). From patients dimension
          canonical_primary_payor_brand."
      - name: primary_insurance_category
        data_type: string
        description:
          "Primary insurance category classification (waterfall-resolved
          irc_group)"
      - name: primary_insurance_product_type
        data_type: string
        description:
          "Primary insurance product type (e.g. Medicare HMO, Medicare PPO,
          PPO, HMO)"
      - name: primary_insurance_source
        data_type: string
        description:
          "Source of primary insurance information (Claim, Eligibility,
          Appointment, None)"
      - name: secondary_insurance_name
        data_type: string
        description: "Secondary insurance package name"
      - name: secondary_insurance_category
        data_type: string
        description: "Secondary insurance category classification"
      - name: membership_status
        data_type: string
        description:
          "Salesforce Membership_Enrollment__c from the patients dimension.
          Values: Active Member, Active Member - Waived, Eligible, Sent
          Contract, Contract Signed, Scheduled, Declined, Inactive Member, Not
          Eligible, NULL."
      - name: member_category
        data_type: string
        description: "Membership category: Established (first scheduled before
          2025-11-03) or Net New Member. NULL for non-membership patients."
      - name: legacy_membership_eligible
        data_type: boolean
        description:
          "True if patient is grandfathered into the legacy (pre-launch)
          membership tier."
      - name: is_rescheduled_immediate
        data_type: boolean
        description: "True if appointment was immediately rescheduled after cancellation"
      - name: is_late_recovery
        data_type: boolean
        description:
          "True if appointment was recovered after initial cancellation (not
          immediate)"
      - name: slot_status
        data_type: string
        description: "Derived slot status: Open, Filled, Cancelled, Completed, or Other"
      - name: attributed_payor
        data_type: string
        description:
          "Reviewer-honored attributed payor effective in the appointment's
          month (int_attribution_payor_slots_pit -> backendbaas
          attribution_decisions). Null when unattributed or the dual-attribution
          decision is pending for that month."
      - name: attributed_payor_as_of_month
        data_type: date
        description: "Roster as-of month grounding the appointment's attributed payor"
      - name: source_updated_at
        data_type: timestamp
        description:
          "Source-system timestamp tracking when upstream data last changed
          (replaces refresh_timestamp for CDF-accurate change detection)"

  - name: wellness_visits
    description: >
      AWV wellness fact with eligible, completed, scheduled, and projected
      metrics by Attribution/Clinic/Provider. Pre-aggregated from Salesforce
      appointment data. Grain: One row per Attribution x Clinic x Provider
      combination.
    config:
      contract:
        enforced: true
      meta:
        cube: true
      tags: ["fact", "cube", "BIPlatform"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - report_date
              - attribution_payor
              - clinic_name
              - provider_name
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: report_date
          config:
            severity: warn
            tags: ["elementary", "freshness"]
    columns:
      - name: report_date
        data_type: date
        description: "Report date for AWV metrics snapshot"
      - name: attribution_payor
        data_type: string
        description: "{{ doc('payor_type') }}"
      - name: clinic_name
        data_type: string
        description: "{{ doc('patient_facing_clinic') }}"
      - name: provider_name
        data_type: string
        description: "{{ doc('provider_name') }}"
      - name: eligible_count
        data_type: bigint
        description: "{{ doc('eligible_patient') }} count"
      - name: completed_count
        data_type: bigint
        description: "AWV completed YTD count"
      - name: scheduled_count
        data_type: bigint
        description: "AWV appointments currently scheduled (future)"
      - name: not_scheduled_count
        data_type: bigint
        description: "Eligible patients with no scheduled AWV"
      - name: cancelled_count
        data_type: bigint
        description: "AWV appointments cancelled YTD"
      - name: completion_rate
        data_type: "decimal(10,0)"
        description: "{{ doc('awv_completion_rate') }}"
      - name: cancellation_rate
        data_type: "decimal(10,0)"
        description: "AWV cancellation rate (cancelled / eligible)"
      - name: projected_completed_count
        data_type: "decimal(10,0)"
        description: "Projected AWV completions accounting for scheduled × (1 -
          cancellation rate)"
      - name: projected_completion_rate
        data_type: "decimal(10,0)"
        description: "{{ doc('awv_projected_completion') }}"
      - name: schedules_needed_for_90pct
        data_type: "decimal(10,0)"
        description: "Additional AWV schedules needed to reach 90% completion target"

  - name: behavioral_health
    description: >
      Behavioral health patient panel fact with clinical outcome scores
      (PHQ-9/GAD-7), treatment response flags, and scheduling activity metrics.
      Grain: One row per patient MRN.
    config:
      contract:
        enforced: true
      meta:
        cube: true
      tags: ["fact", "cube", "BIPlatform"]
    tests:
      # Schema drift blocks deploy — protects patient attribution dashboard cards
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]
    columns:
      - name: patient_id
        data_type: decimal(10,0)
        description: "{{ doc('patient_id') }}"
        constraints:
          - type: not_null
        data_tests:
          - unique:
              config:
                severity: error
          - relationships:
              arguments:
                to: ref('patients')
                field: patient_id
              config:
                severity: warn

      - name: golden_id
        data_type: string
        description: "{{ doc('golden_id') }}"
      - name: baseline_phq_score
        data_type: int
        description: "First clinically significant PHQ-9 score (> 0)"
      - name: latest_phq_score
        data_type: int
        description: "Most recent PHQ-9 score"
      - name: phq_in_remission
        data_type: int
        description: "PHQ-9 remission flag (latest score < 5)"
      - name: phq_response
        data_type: int
        description: "PHQ-9 response flag (>= 50% reduction from baseline)"
      - name: has_next_bh_appointment
        data_type: boolean
        description: "True if patient has a future BH appointment scheduled"
      - name: salesforce_id
        data_type: string
        description: "Salesforce Account ID from EMPI identity bridge"
      - name: enterprise_id
        data_type: "decimal(10,0)"
        description: "Enterprise patient ID from EMPI identity bridge"
      - name: provider_group_id
        data_type: string
        description: "Provider group assignment from EMPI"
      - name: patient_last_name
        data_type: string
        description: "Patient last name"
      - name: patient_first_name
        data_type: string
        description: "Patient first name"
      - name: bh_provider_name
        data_type: string
        description: "Behavioral health provider name"
      - name: bh_provider_id
        data_type: decimal(10,0)
        description:
          "MDM-validated BH provider ID sourced from appointment scheduling
          provider mapping"
      - name: pcp_name
        data_type: string
        description: "Primary care provider name"
      - name: clinic_name
        data_type: string
        description: "{{ doc('patient_facing_clinic') }}"
      - name: program_name
        data_type: string
        description: "BH program name (e.g. CoCM, Traditional)"
      - name: patient_tier
        data_type: string
        description: "Patient risk tier"
      - name: bh_tier
        data_type: string
        description:
          "Behavioral health-specific tier classification (Low/Moderate/High
          from Athena Quickview)"
      - name: bh_program_status
        data_type: string
        description: >
          Athena Quickview "BH Program Participation" raw value: Low / Moderate
          / High (active panel) or Graduated / Disenrolled / Declined
          (inactive).
      - name: is_active_bh_panel
        data_type: boolean
        description: >
          True when patient is active in the BH panel (BH Program Participation
          is not Graduated/Disenrolled/Declined). Drives panel filtering for
          BIPlatform / metric-view measures and the BH No Next report so historical
          rows survive the incremental merge while disappearing from active
          dashboards.
      - name: has_bh_care_plan
        data_type: int
        description: "Legacy flag: 1 if patient has an active Athena Behavioral treatment plan (PLANTYPE = Behavioral), 0 otherwise"
      - name: has_bh_treatment_plan
        data_type: int
        description: "1 if patient has a BH treatment plan, 0 otherwise"
      - name: has_active_cm_care_plan
        data_type: int
        description: "1 if patient has any active CM care plan (Longitudinal or Behavioral), 0 otherwise"
      - name: has_active_cm_with_events
        data_type: int
        description: "1 if patient has an active CM care plan and at least one logged cmcareevent, 0 otherwise"
      - name: baseline_gad_score
        data_type: int
        description: "First clinically significant GAD-7 score (> 0)"
      - name: baseline_gad_date
        data_type: date
        description: "Date of baseline GAD-7 assessment"
      - name: baseline_phq_date
        data_type: date
        description: "Date of baseline PHQ-9 assessment"
      - name: intake_gad_score
        data_type: int
        description: "GAD-7 score at intake"
      - name: intake_phq_score
        data_type: int
        description: "PHQ-9 score at intake"
      - name: intake_date
        data_type: date
        description: "Date of BH intake assessment"
      - name: latest_gad_score
        data_type: int
        description: "Most recent GAD-7 score"
      - name: latest_gad_date
        data_type: date
        description: "Date of most recent GAD-7 assessment"
      - name: latest_phq_date
        data_type: date
        description: "Date of most recent PHQ-9 assessment"
      - name: gad_point_change
        data_type: int
        description: "Point change from baseline to latest GAD-7 score"
      - name: phq_point_change
        data_type: int
        description: "Point change from baseline to latest PHQ-9 score"
      - name: gad_pct_response
        data_type: decimal(10,0)
        description: "GAD-7 percentage reduction from baseline"
      - name: phq_pct_response
        data_type: decimal(10,0)
        description: "PHQ-9 percentage reduction from baseline"
      - name: gad_in_remission
        data_type: int
        description: "GAD-7 remission flag (latest score < 5)"
      - name: gad_reliable_change
        data_type: int
        description: "GAD-7 reliable change index flag"
      - name: phq_reliable_change
        data_type: int
        description: "PHQ-9 reliable change index flag"
      - name: gad_response
        data_type: int
        description: "GAD-7 response flag (>= 50% reduction from baseline)"
      - name: bh_visits_last_30d
        data_type: bigint
        description: "Count of BH visits in the last 30 days"
      - name: last_bh_visit_date
        data_type: date
        description: "Date of most recent BH visit"
      - name: cocm_minutes_current_month
        data_type: decimal(10,0)
        description: "CoCM minutes logged in the current month"
      - name: cocm_minutes_prior_month
        data_type: decimal(10,0)
        description: "CoCM minutes logged in the prior month"
      - name: bh_visits_current_month
        data_type: bigint
        description: "Count of BH visits in the current month"
      - name: bh_visits_prior_month
        data_type: bigint
        description: "Count of BH visits in the prior month"
      - name: next_bh_appointment_date
        data_type: date
        description: "Date of next scheduled BH appointment"
      - name: next_bh_provider
        data_type: string
        description: "Provider for next scheduled BH appointment"
      - name: prior_auth_status
        data_type: string
        description: "Status of the most recent Behavioral Health prior authorization"
      - name: prior_auth_start_date
        data_type: date
        description: "Start date of the BH prior authorization"
      - name: prior_auth_expiration_date
        data_type: date
        description: "Expiration date of the BH prior authorization"
      - name: prior_auth_visits_approved
        data_type: decimal(12,0)
        description: "Number of visits approved"
      - name: prior_auth_visits_left
        data_type: decimal(12,0)
        description: "Number of visits remaining on auth"
      - name: source_updated_at
        data_type: timestamp
        description: >
          CDF watermark — GREATEST of v_bhpatientpanel.source_updated_at and
          patients.last_updated_at. Required for ServingDB TRIGGERED sync mode.
        constraints:
          - type: not_null
        tests:
          - not_null

  - name: scheduling_capacity
    description: >
      Provider scheduling capacity fact. One row per appointment slot with
      provider, location, and appointment type dimension enrichment. Grain: One
      row per appointment slot.
    config:
      contract:
        enforced: true
      meta:
        cube: true
      tags: ["fact", "cube", "BIPlatform"]
    tests:
      # Daily scheduling slots — drop means provider template sync broke
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: appointment_date
            time_bucket:
              period: day
              count: 1
          config:
            severity: warn
            tags: ["elementary", "data_volume"]
      # MERGE-never-deletes drift: appointment_ids that no longer exist in vw_provider_capacity
      # (slots dropped from stg_scheduling__slots when appointmentdeleteddatetime is set or
      # department changes to 11). 2,752 phantoms cleaned 2026-04-28.
      - no_filter_drift:
          arguments:
            key_column: appointment_id
            source_model: vw_provider_capacity
            source_key_column: APPOINTMENT_ID
          config:
            severity: warn
            tags: ["elementary", "filter_drift", "data_quality"]
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]
    columns:
      - name: appointment_id
        data_type: decimal(10,0)
        description: "Appointment/Slot ID"
        constraints:
          - type: not_null
        tests:
          - unique
      - name: provider_id
        data_type: decimal(10,0)
        description: "Athena Provider ID"
      - name: provider_name
        data_type: string
        description: "{{ doc('provider_name') }}"
      - name: clinic_name
        data_type: string
        description: "{{ doc('patient_facing_clinic') }}"
      - name: is_open_slot
        data_type: boolean
        description: "True if slot status starts with 'o' (Open Slot). Uses
          is_athena_open_slot macro."
      - name: is_booked_slot
        data_type: boolean
        description: "True if slot status starts with 'f' (Filled/Booked). Uses
          is_athena_scheduled macro."
      - name: is_completed_slot
        data_type: boolean
        description:
          "True if appointment status is Checked In, Checked Out, or Charge
          Entered. Uses is_athena_completed macro."
      - name: is_cancelled_slot
        data_type: boolean
        description: "True if slot status starts with 'x' (Cancelled). Uses
          is_athena_cancelled macro."
      - name: slot_status
        data_type: string
        description:
          "Derived slot status: Open, Filled, Cancelled, Completed, or Other.
          Mapped from Athena status prefixes via healthcare_constants macros."
      - name: appointment_date
        data_type: date
        description:
          "Calendar date of the appointment slot from Athena. Used for
          capacity planning and scheduling window analysis."
      - name: provider_clinic
        data_type: string
        description: "Provider's assigned clinic name"
      - name: is_physician
        data_type: boolean
        description: "True if provider is a physician (MD/DO)"
      - name: is_mid_level
        data_type: boolean
        description: "True if provider is a mid-level (NP/PA)"
