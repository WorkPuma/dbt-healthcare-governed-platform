      - name: is_patient_facing
        data_type: boolean
        description: "True if clinic is a patient-facing location"
      - name: appointment_type_name
        data_type: string
        description: "Full appointment type name from Athena"
      - name: visit_category
        data_type: string
        description: "Derived visit category from appointment_types dimension"
      - name: is_patient_visit
        data_type: boolean
        description: "True if this is a qualifying patient visit per MDM classification"
      - name: is_awv
        data_type: boolean
        description: "{{ doc('awv_visit') }}"
      - name: is_behavioral_health
        data_type: boolean
        description: "Behavioral health visit flag from MDM appointment type classification"
      - name: is_telehealth
        data_type: boolean
        description: "True if appointment is a telehealth visit"
      - name: is_ancillary
        data_type: boolean
        description: "True if this is an ancillary visit (lab, imaging, etc.)"
      - name: appointment_status
        data_type: string
        description: "Raw Athena appointment status"
      - name: is_initial_visit_slot
        data_type: boolean
        description: "True if slot is for an initial/new patient visit"
      - name: is_future
        data_type: boolean
        description: "True if appointment date is in the future"
      - name: days_from_today
        data_type: int
        description: "Number of days from today to the appointment date"
      - name: slot_duration_minutes
        data_type: decimal(10,0)
        description: "Duration of the appointment slot in minutes"
      - name: source_updated_at
        data_type: timestamp
        description: >
          Source-system change-tracking timestamp passed through from
          vw_provider_capacity (originally athena.appointment.LASTUPDATED). Used
          for CDF-safe incremental merge via matched_condition.

  - name: attribution_history
    description: >
      Historical patient-payor attribution fact. Sourced from
      vw_historical_attribution (EMPI-matched payor files). Tracks patient-payor
      attribution over time for VBC reporting. Payors: PAYOR_A, PAYOR_B (includes MSSP
      ACO), PAYOR_C, Payor Delta, Medicare. Grain: One row per golden_id x
      payor x as_of_month. PAYOR_A roster-only identities are retained even without
      an Athena chart. The incremental post-hook deletes only PAYOR_A
      identity/payor/month rows that no longer exist in
      vw_historical_attribution; patient status does not filter attribution.
    config:
      contract:
        enforced: true
      meta:
        cube: true
      tags: ["fact", "cube", "BIPlatform", "attribution"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - identity_id
              - attributed_payor
              - as_of_month
      # Fail the model if payor member counts shift by more than 20% between months
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: as_of_month
            time_bucket:
              period: month
              count: 1
            sensitivity: 3
          config:
            severity: error
            tags: ["elementary", "shift_guard"]
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]
    columns:
      - name: golden_id
        data_type: string
        description: "{{ doc('golden_id') }}"
        # Nullable for roster-only ghosts without an approved EMPI golden record.
      - name: identity_id
        data_type: string
        description: >
          {{ doc('identity_id') }} This stable surviving identity is the
          referential-integrity key; historical golden_id aliases may remain after
          EMPI merges and are not valid current-identity relationship keys.
        constraints:
          - type: not_null
        tests:
          - relationships:
              arguments:
                to: ref('patient_identity')
                field: identity_id
              config:
                severity: error
                where: "match_status = 'MATCHED' and is_ghost = false"
                tags: ["referential_integrity", "empi"]
      - name: entity_id
        data_type: string
        description: "{{ doc('entity_id') }}"
      - name: is_ghost
        data_type: boolean
        description: "True when the EMPI identity has no Athena chart (payor-origin roster member)."
      - name: is_vendorblue
        data_type: boolean
        description: >
          True when this PAYOR_B H2001 attribution row's effective attributed clinic
          TIN equals the VendorBlue TIN (204841281). Always false for non-PAYOR_B
          payors. Point-in-time per as_of_month.
      - name: match_status
        data_type: string
        description: "EMPI match state: MATCHED, ROSTER_ONLY, or approval workflow status."
      - name: patient_id
        data_type: bigint
        description: "{{ doc('patient_id') }}"
      - name: salesforce_id
        data_type: string
        description: "Salesforce Account ID from EMPI identity bridge"
      - name: enterprise_id
        data_type: "decimal(10,0)"
        description: "Enterprise patient ID from EMPI identity bridge"
      - name: provider_group_id
        data_type: string
        description: "Provider group assignment from EMPI"
      - name: patient_first_name
        data_type: string
        description: "Patient first name from payor roster file"
      - name: patient_last_name
        data_type: string
        description: "Patient last name from payor roster file"
      - name: patient_name
        data_type: string
        description: "Full patient name (first + last) for drill-through display"
      - name: patient_date_of_birth
        data_type: string
        description: "Patient date of birth from payor roster file"
      - name: patient_gender
        data_type: string
        description: "Patient gender from payor roster file"
      - name: attributed_payor
        data_type: string
        description:
          "Standardized payor name: PAYOR_A, PAYOR_B, PAYOR_C, PAYOR_DELTA, AHA,
          MEDICARE"
        tests:
          - accepted_values:
              arguments:
                values:
                  ["PAYOR_A", "PAYOR_B", "PAYOR_C", "PAYOR_DELTA", "MEDICARE", "AHA"]
              config:
                severity: error
      - name: payor_member_id
        data_type: string
        description:
          "Payor-assigned member ID (MBI for Medicare, subscriber ID for
          commercial)"
      - name: market_segment
        data_type: string
        description: "Payor market segment classification"
      - name: attribution_subtype
        data_type: string
        description: >
          Payor-specific classification. PAYOR_A: value_program_indicator. PAYOR_B:
          mbr_typ_cd (M&R, GRP, CSNP, DSNP). Medicare: MSSP roster mbr_typ_cd
          (e.g. Aged/Non-Dual, Aged/Dual, Disabled) — not retired CMS CLAIMS_STEP labels.
      - name: attributed_provider_npi
        data_type: string
        description: >
          Payor-supplied 10-digit NPI of the attributed PCP. Populated for PAYOR_A
          (numeric provider_id), PAYOR_B (assoc_prov_npi, Healthcare Org TIN only),
          AHA (npi), and MSSP-when-numeric. NULL for PAYOR_C, Payor Delta,
          Medicare-FFS, and rows where the payor did not supply a valid NPI.
      - name: attributed_provider_name
        data_type: string
        description: >
          Payor-supplied raw attributed-provider name string (verbatim, e.g.
          "BAUER, N.P., LEAH R." or "TARA L MCCULLOUGH CNP (08235700)"). Use
          attributed_provider_id / attributed_provider_mdm_name for canonical
          display.
      - name: attributed_provider_id
        data_type: decimal(38,0)
        description: >
          Resolved Athena provider_id from MDM provider master. Sourced via
          int_attribution_provider_match (NPI-first, normalized-name fallback
          against providers.payor_match_keys, then unique-last-name fallback).
          NULL when no MDM match (typically external/referring providers). Use
          this for joins to providers / Salesforce Contact.
      - name: attributed_provider_mdm_name
        data_type: string
        description: >
          Canonical MDM provider_name for the resolved attributed provider (e.g.
          "Leah Carver"). NULL when unmatched.
      - name: attributed_provider_mdm_npi
        data_type: string
        description: >
          Canonical MDM NPI for the resolved attributed provider. NULL when
          unmatched.
      - name: attributed_provider_match_method
        data_type: string
        description: >
          How the attributed provider was resolved: 'npi' (exact NPI join),
          'name' (normalized full-name match against
          providers.payor_match_keys), 'last_name' (PAYOR_A-style row where only
          provider_last_name was given and exactly one MDM provider has that
          surname), or 'unmatched'. NULL for Medicare-FFS rows.
        tests:
          - accepted_values:
              arguments:
                values: ["npi", "name", "last_name", "unmatched"]
              config:
                severity: warn
      - name: as_of_month
        data_type: date
        description: "Attribution effective month (first of month date)"
        constraints:
          - type: not_null
      - name: attribution_year
        data_type: int
        description: "Year extracted from as_of_month for time-series filtering"
      - name: attribution_month
        data_type: int
        description: "Month extracted from as_of_month for time-series filtering"
      - name: year_month
        data_type: string
        description: "Attribution year-month (yyyy-MM format)"
      - name: is_current_attribution
        data_type: boolean
        description:
          "True if this is from the most recent attribution release for this
          payor"
      - name: match_type
        data_type: string
        description: "EMPI match method: MBI_DETERMINISTIC or PROBABILISTIC"
      - name: match_confidence
        data_type: double
        description: "EMPI match confidence score (1.0 for MBI, 0.70-1.0 for probabilistic)"
      - name: file_source
        data_type: string
        description: "Source payor roster file name for audit trail"
      - name: patient_status
        data_type: string
        description: "Patient status from patients dimension (Active, Inactive, etc.)"
      - name: is_active_patient
        data_type: boolean
        description:
          "True if patient is currently active (completed visit within 18
          months)"
      - name: source_updated_at
        data_type: timestamp
        description:
          "Source-system update watermark for CDF-safe incremental MERGE;
          greatest of underlying source timestamps."

  - name: operating_review
    description: >
      Operating review patient fact with status, location, insurance, tier,
      scheduling, and patient action flags. Enriched with EMPI identity bridge
      for cross-system lookup. Includes four point-in-time patient action flags
      (is_no_next, is_bh_no_next, is_pending_awv, is_pending_mddo) sourced from
      MDM appointment_type and provider classifications. All appointment status
      checks use centralized Athena status macros for consistency. Grain: One
      row per patient_id.
    config:
      contract:
        enforced: true
      meta:
        cube: true
      tags: ["fact", "cube", "BIPlatform"]
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]
    columns:
      - name: patient_id
        data_type: decimal(10,0)
        description: "{{ doc('patient_id') }}"
        constraints:
          - type: not_null
        data_tests:
          - unique:
              config:
                severity: error
          - relationships:
              arguments:
                to: ref('patients')
                field: patient_id
              config:
                severity: warn

      - name: golden_id
        data_type: string
        description: "{{ doc('golden_id') }}"
      - name: salesforce_id
        data_type: string
        description: "Salesforce Account ID (18-char) from EMPI identity bridge"
      - name: enterprise_id
        data_type: "decimal(10,0)"
        description: "{{ doc('enterprise_id') }}"
      - name: provider_group_id
        data_type: string
        description: "{{ doc('provider_group_id') }}"
      - name: patient_status
        data_type: string
        description: "{{ doc('patient_status') }}"
      - name: service_location
        data_type: string
        description: "{{ doc('patient_facing_clinic') }}"
      - name: clinic_name
        data_type: string
        description: "MDM-standardized clinic name from clinics dimension"
      - name: is_patient_facing
        data_type: boolean
        description:
          "True if clinic is a patient-facing location (excludes MIDI, Main
          Office, Vaccine Clinic)"
      - name: clinic_type
        data_type: string
        description: "Clinic classification from clinics dimension"
      - name: clinic_city
        data_type: string
        description: "City of the patient's assigned clinic"
      - name: clinic_state
        data_type: string
        description: "State of the patient's assigned clinic"
      - name: tier
        data_type: string
        description: "Patient risk tier (Highly Complex, High Risk, Rising Risk, Low Risk)"
      - name: primary_insurance
        data_type: string
        description: "Primary insurance name resolved via waterfall or patientinsurance"
      - name: payor_category
        data_type: string
        description: "{{ doc('payor_category') }}"
      - name: attributed_payor
        data_type: string
        description: "{{ doc('attributed_payor') }}"
      - name: has_next_visit
        data_type: int
        description:
          "1 if patient has a future qualifying medical visit scheduled, 0
          otherwise"
      - name: next_visit_date
        data_type: date
        description:
          "Date of the patient's next scheduled qualifying medical visit
          (Patient_Visit = true, NOT BH, NOT Ancillary per MDM). NULL if no
          future qualifying visit exists."
      - name: scheduling_status
        data_type: string
        description:
          "'Scheduled' if has_next_visit = 1, 'Not Scheduled' otherwise.
          Based on qualifying medical visits only — a patient with only a future
          BH or lab visit is 'Not Scheduled'."
      - name: cadence_status
        data_type: string
        description:
          "Patient visit cadence classification based on days since last
          visit vs. risk tier thresholds: Low Risk (274 days), Rising Risk (68
          days), High Risk (45 days), Highly Complex (23 days). Values: On
          Cadence, Overdue, or NULL."
      - name: is_no_next
        data_type: boolean
        description: '{{ doc("is_no_next") }}'
      - name: is_bh_no_next
        data_type: boolean
        description: '{{ doc("is_bh_no_next") }}'
      - name: is_pending_awv
        data_type: boolean
        description: '{{ doc("is_pending_awv") }}'
      - name: is_pending_mddo
        data_type: boolean
        description: '{{ doc("is_pending_mddo") }}'
      - name: next_bh_visit_date
        data_type: date
        description:
          "Date of the patient's next scheduled Behavioral Health visit (MDM
          Behavioral_Health_Visit = true, status = Filled). NULL if no future BH
          visit exists."
      - name: has_awv_completed_ytd
        data_type: int
        description:
          "1 if patient has a completed AWV (Checked In, Checked Out, or
          Charge Entered) in the current calendar year, 0 otherwise"
      - name: has_awv_scheduled_ytd
        data_type: int
        description:
          "1 if patient has a future AWV scheduled (status Filled) in the
          current calendar year, 0 otherwise"
      - name: has_mddo_completed_ytd
        data_type: int
        description:
          "1 if patient has a completed MD/DO visit (Checked In, Checked Out,
          or Charge Entered) with a PROVIDERTYPE IN (MD, DO) provider in the
          current calendar year, 0 otherwise"
      - name: has_mddo_scheduled_ytd
        data_type: int
        description:
          "1 if patient has a future MD/DO visit scheduled (status Filled)
          with a PROVIDERTYPE IN (MD, DO) provider in the current calendar year,
          0 otherwise"
      - name: last_completed_visit_date
        data_type: date
        description:
          "Date of the patient's most recent completed visit (Checked In,
          Checked Out, or Charge Entered). Drives 18-month active status rule
          and 12-month engagement calculation."
      - name: first_visit_date
        data_type: timestamp
        description:
          "Date of the patient's first completed visit at Healthcare Org
          (Checked In, Checked Out, or Charge Entered). Used for new patient
          cohort analysis and enrollment_month derivation."
      - name: enrollment_month
        data_type: timestamp
        description: "{{ doc('enrollment_month') }}"
      - name: source_updated_at
        data_type: timestamp
        description:
          "Source-system timestamp tracking when upstream data last changed
          (Athena, MDM, EMPI). Used for data freshness monitoring and
          pre-aggregation invalidation."

