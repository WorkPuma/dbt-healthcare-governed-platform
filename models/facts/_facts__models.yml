      - name: master_contact_id
        data_type: bigint
        description: "Parent contact ID for multi-leg interactions."
      - name: contact_start_at
        data_type: timestamp
        description: "Timestamp when the contact started."
      - name: contact_date
        data_type: date
        description: "Calendar date of the contact. Primary time dimension for trending."
      - name: media_type
        data_type: string
        description: '{{ doc("nice_media_type") }}'
      - name: point_of_contact_name
        data_type: string
