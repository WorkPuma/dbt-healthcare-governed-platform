        description: "Agent-to-customer conversation duration in seconds."
      - name: hold_seconds
        data_type: double
        description: "Total hold time in seconds."
      - name: hold_count
        data_type: int
        description: "Number of hold events."
      - name: acw_seconds
        data_type: double
        description: "After Call Work duration in seconds."
      - name: conference_seconds
