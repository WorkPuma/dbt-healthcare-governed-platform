  - name: patient_census
    description: >
      Daily patient census snapshot fact. All patients with engagement status,
      payor mix, membership flags, and EMPI payor attribution. Sources: patients
      dimension (enhanced active patient logic via int_patient_status_computed,
      canonical insurance via int_primary_insurance), athenahealth.appointment
      (next appointment), salesforce.contact (PCP name), stg_salesforce__account
      (tertiary/reference payor). Columns 0-31 preserve backward-compatible
      names and types for Azure SQL sync (dbo.VIW_PATIENT_CENSUS). EMPI payor
      attribution at position 32+. Grain: One row per entity_id (Athena
      patient_id or H-number) per snapshot_date.
    config:
      contract:
        enforced: true
      meta:
        cube: true
        servingdb_sync: true
        servingdb_mode: TRIGGERED
      tags: ["fact", "cube", "BIPlatform", "census", "operations"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - entity_id
              - snapshot_date
      # MERGE-never-deletes drift: patient_ids in census that no longer exist in patients
      # dimension. 159 phantoms cleaned 2026-04-28; cascades from dimensions.patients drift.
      # Census is keystone-sourced from patients, so any unknown patient_id is a true ghost.
      #
      # Scoped to the LATEST snapshot (latest_snapshot_column: snapshot_date). patient_census
      # is a daily-snapshot fact keyed on (entity_id, status_date); it intentionally retains
      # historical rows. When a patient is merged or removed upstream, `patients` cleans its
      # own phantoms via post_hook, but patient_census's pre_hook only removes is_ghost=true
      # rows for status_date=current_date() — historical non-ghost rows for the removed
      # patient persist (correctly, for historical reporting). Without snapshot scoping the
      # test would flag every historical row whose patient_id no longer exists in the
      # current-state patients dimension, producing false drift that grows monotonically
      # (seen 2026-07-26..31: 30 prod rows across 5 historical snapshots 07-20..07-25 for
      # 6 patients merged ~07-26; ZERO phantoms in the latest 07-30 snapshot). Scoping to
      # the latest snapshot restores the test's intended "true ghost in the current
      # population" semantics.
      - no_filter_drift:
          arguments:
            key_column: patient_id
            source_model: patients
            target_filter: "patient_id is not null and is_ghost = false"
            latest_snapshot_column: snapshot_date
          config:
            severity: warn
            tags: ["elementary", "filter_drift", "data_quality"]
      # Daily snapshot series; seasonality avoids false alarms when weekend
      # volumes differ from weekday averages (or weekend snapshots are skipped).
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: snapshot_date
            time_bucket:
              period: day
              count: 1
            seasonality: day_of_week
            fail_on_zero: false
          config:
            severity: warn
            tags: ["elementary", "volume", "cube_contract"]
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]
    columns:
      # -- Positions 0-31: backward-compatible schema --
      - name: patient_id
        data_type: string
        description: "{{ doc('patient_id') }}"
        data_tests:
          - relationships:
              arguments:
                to: ref('patients')
                field: patient_id
              config:
                severity: warn

      - name: patient_name
        data_type: string
        description: "Patient full name from athenahealth"
      - name: patient_status
        data_type: string
        description: "{{ doc('patient_status') }}"
      - name: status_date
        data_type: date
        description: "Date the patient status was last changed"
      - name: patient_tier
        data_type: string
        description: "Risk tier assignment (High Risk, Rising Risk, Low Risk)"
      - name: first_appointment_date
