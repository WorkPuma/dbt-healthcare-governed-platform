  - name: attribution_movement
    description: >
      Payor attribution movement analysis fact. Detects three event types per
      patient-payor: GAINED (new attribution), RETAINED (consecutive months),
      LOST (dropped from roster). Also identifies cross-payor SHIFTS where a
      patient moves between payors in the same period. Includes Salesforce
      attribution match flag for data quality monitoring. Grain: One row per
      golden_id x payor x as_of_month x attribution_event.
    config:
      contract:
        enforced: true
      meta:
        cube: true
      tags: ["fact", "cube", "BIPlatform", "attribution", "payor"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - golden_id
              - payor
              - as_of_month
              - attribution_event
      # Fail if LOST events exceed 25% of total events in any single month
      # (indicates possible bad file load or data corruption)
      - elementary.column_anomalies:
          arguments:
            column_name: attribution_event
          config:
            severity: warn
            tags: ["elementary", "shift_guard"]
    columns:
      - name: golden_id
        data_type: string
        description: "{{ doc('golden_id') }}"
        constraints:
          - type: not_null
      - name: athena_patient_id
        data_type: string
        description: "Athena patient ID from EMPI match"
      - name: patient_id
        data_type: bigint
        description: "{{ doc('patient_id') }} (cast from athena_patient_id)"
      - name: payor
        data_type: string
        description: "Payor name: PAYOR_A, PAYOR_B, PAYOR_C, PAYOR_DELTA, AHA, MEDICARE"
        tests:
          - accepted_values:
              arguments:
                values:
                  ["PAYOR_A", "PAYOR_B", "PAYOR_C", "PAYOR_DELTA", "MEDICARE", "AHA"]
              config:
                severity: error
      - name: as_of_month
        data_type: date
        description: "Attribution month this event pertains to"
        constraints:
          - type: not_null
      - name: prior_month
        data_type: date
        description: "Previous attribution month (NULL for first GAINED event)"
      - name: attribution_event
        data_type: string
        description: "Event type: GAINED, RETAINED, or LOST"
        tests:
          - accepted_values:
              arguments:
                values: ["GAINED", "RETAINED", "LOST"]
      - name: shifted_from_payor
        data_type: string
        description:
          "Payor the patient was LOST from (only populated for cross-payor
          shifts)"
      - name: shifted_to_payor
        data_type: string
        description: "Payor the patient GAINED to (only populated for cross-payor shifts)"
      - name: is_payor_shift
        data_type: boolean
        description: "True if this event is part of a cross-payor shift"
      - name: patient_status
        data_type: string
        description: "{{ doc('patient_status') }}"
      - name: clinic
        data_type: string
        description: "{{ doc('patient_facing_clinic') }}"
      - name: primary_care_provider
        data_type: string
        description: "Patient's assigned PCP"
      - name: sf_attributed_payor
        data_type: string
        description: "Salesforce-recorded attributed payor for comparison"
      - name: sf_attribution_matches
        data_type: boolean
        description: "True if Salesforce attribution matches this payor file attribution"

