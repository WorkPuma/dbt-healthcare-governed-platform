version: 2

sources:
  # ============================================
  # Salesforce Source - CRM and Patient Data
  # ============================================
  - name: salesforce
    description: "Salesforce CRM data synced via Databricks LakeFlow Connect"
    database: databricks_prod
    schema: salesforce
    config:
      loaded_at_field: "SystemModstamp"
      freshness:
        warn_after: { count: 24, period: hour }
        error_after: { count: 72, period: hour }
    tables:
      - name: account
        description: "Patient and provider accounts from Salesforce"
        columns:
          - name: Id
            description: "Salesforce Account ID (Primary Key)"
            tests:
              - unique:
                  config:
                    where: "__END_AT IS NULL AND IsDeleted = false"
              - not_null:
                  config:
                    where: "__END_AT IS NULL AND IsDeleted = false"
          - name: HealthCloudGA__SourceSystemId__c
            description: "Athena Patient ID (for patient accounts)"

      - name: attribution__c
        description: "Attribution records for value-based care tracking"
        columns:
          - name: Id
            description: "Attribution record ID"
            tests:
              # uniqueness is asserted one layer down on base_salesforce__attribution
              # (current-row grain). The raw source carries SCD Type 2 version rows
              # once Lakeflow change tracking is enabled, so unique does not hold here.
              - not_null

      - name: attribution__history
        description:
          "Attribution__c field change history (Salesforce Attribution__History
          object). Tracks Status__c / Attribution_Stage__c / Hold_Reason__c and
          related field edits for value-based care operational reporting."
        config:
          loaded_at_field: "CreatedDate"

      - name: appointment__c
        description:
          "Appointment records synced from Athena (STREAMING_TABLE — not
          ServingDB-syncable)"
        columns:
          - name: Id
            description: "Salesforce Appointment ID"
            tests:
              # uniqueness is asserted one layer down on base_salesforce__appointment
              # (current-row grain). The raw source carries SCD Type 2 version rows
              # once Lakeflow change tracking is enabled, so unique does not hold here.
              - not_null

      - name: ai_outreach_call__c
        description: "AI_Outreach AI call records synced from Salesforce. Each row
          represents one completed call attempt within a AI_Outreach sequence."
        config:
          freshness:
            warn_after: { count: 72, period: hour }
            # dbt-fusion partial-merge does not honor error_after: null when the
            # parent source config sets an explicit error_after. Use an effectively
            # infinite value (30 days) to suppress error events for this naturally
            # bursty source (calls can be quiet for days between campaigns).
            error_after: { count: 720, period: hour }
        columns:
          - name: Id
            description: "Salesforce AI_Outreach Call record ID"
            tests:
              - unique
              - not_null

      - name: communication_timeline__c
        description: >
          Unified patient communication event log (phone/SMS/email) written by
          Apex CommunicationTimelineService and Prefect communication_timeline_sync
          (NICE, SmsProvider, Marketing Cloud, Athena, Teams). Used by Patient
          Engagement Score event fact.
        config:
          loaded_at_field: "SystemModstamp"
          freshness:
            warn_after: { count: 48, period: hour }
            error_after: { count: 168, period: hour }
        columns:
          - name: Id
            description: "Salesforce Communication Timeline record ID"
            tests:
              - not_null
          - name: Account__c
            description: "Related Salesforce Account (patient)"
          - name: Direction__c
            description: "Inbound or Outbound"
          - name: Event_Type__c
            description: "Call/SMS/Email event class"
          - name: Source_System__c
            description: "NICE, SmsProvider, Marketing Cloud, Athena, Teams, Salesforce"
          - name: Event_Date__c
            description: "Event timestamp"

      - name: user
        description: "Salesforce user records"
        config:
          # Evidence (DEV-4549): median SystemModstamp gap ~14h, p95 ~141h, max 180h.
          # Slow-changing dim — widen warn so quiet weeks don't page.
          freshness:
            warn_after: { count: 336, period: hour }  # ~14d
            # dbt-fusion partial-merge does not honor error_after: null when the
            # parent source config sets an explicit error_after. Use an effectively
            # infinite value (30 days) — User records change very rarely (only on
            # new hires / role changes) so multi-day staleness is not an outage.
            error_after: { count: 720, period: hour }

      - name: accounthistory
        description: "Account field change history"
        config:
          loaded_at_field: "CreatedDate"

      - name: lead
        description: "Salesforce Lead records for membership program"
        columns:
          - name: Id
            description: "Salesforce Lead ID"
            tests:
              - unique
              - not_null

      - name: contact
        description: "Salesforce Contact records (includes providers)"
        config:
          # Evidence (DEV-4549): median gap ~4h, p95 ~26h — source-default 24h warn flaps.
          freshness:
            warn_after: { count: 48, period: hour }
            error_after: { count: 96, period: hour }
        columns:
          - name: Id
            description: "Salesforce Contact ID"
            tests:
              - unique
              - not_null

      - name: location
        description: "Salesforce Location records (HealthCloudGA__Location__c)
          representing clinic/department sites"
        config:
          freshness: null

      - name: case
        description: "Salesforce Case records for scheduling and care management"
        columns:
          - name: Id
            description: "Salesforce Case ID"
            tests:
              - unique
              - not_null

      - name: clinicalencounter
        description:
          "Salesforce HealthCloudGA__EhrClinicalEncounter__c — hospital
          encounters from ADT feeds (PointClickCare, PatientPing). Category =
          'Inpatient Encounter' for TCM."
        config:
          # Evidence (DEV-4549): median gap ~8h, p95 ~24h — source-default 24h warn flaps.
          freshness:
            warn_after: { count: 48, period: hour }
            error_after: { count: 96, period: hour }
        columns:
          - name: Id
            description: "Salesforce Clinical Encounter ID (Primary Key)"
            tests:
              - unique
              - not_null

  # ============================================
  # AthenaHealth Source - Delta Lake Replica (Analytics, Lower Cost)
  # ============================================
  - name: athenahealth
    description:
      "AthenaHealth EHR data - Local Delta Lake replica (preferred for
      analytics)"
    database: athenahealth
    schema: athenaone
    tables:
      - name: appointment
        description: |
          Athena appointment records (athenahealth.athenaone.appointment). Includes appointment
          stage, patient, provider, and claim data. Double-booked slots appear multiple times
          (each has unique Appointment ID). Point Values = practice-administered weighting.
          Delta Lake replica for analytics. See athena.metadata.transformation_tables.
        config:
          loaded_at_field: "lastupdated"
          freshness:
            warn_after: { count: 48, period: hour }
            error_after: { count: 168, period: hour }
        columns:
          - name: appointmentid
            description: "Athena-assigned ID for appointment slot; unique per CONTEXT_ID"
          - name: appointmentdate
            description: "Day of the appointment (local to practice timezone)"
          - name: appointmentstatus
            description:
              "f=Filled, 2=Checked In, 3=Checked Out, 4=Charge Entered,
              x=Cancelled, o=Open Slot"
          - name: patientid
            description: "Patient on which service was performed
              (athenahealth.athenaone.patient)"
          - name: providerid
            description: "Scheduling provider (athenahealth.athenaone.provider)"
          - name: departmentid
            description:
              "Department including CMS codes, provider/department group
              (athenahealth.athenaone.department)"
          - name: appointmenttypeid
            description:
              "Appointment type - defined and administered by practice
              (athenahealth.athenaone.appointmenttype)"

      - name: appointmenttype
        description: |
          Appointment type reference (athenahealth.athenaone.appointmenttype). Types are
          defined and administered by individual practices. Used with MDM for Patient_Visit,
          AWV_Visit, Behavioral_Health_Visit classifications.
        columns:
          - name: appointmenttypeid
            description: "Appointment type ID - practice-specific"
          - name: appointmenttypename
            description:
              "Appointment type name (e.g., Routine Visit, Annual Wellness
              Visit)"

      - name: appointmentview
        description: |
          Appointment view with extended scheduling fields (athenahealth.athenaone.appointmentview).
          Contains requirescancellationyn flag for mass-freeze cancellation tracking.
          Joined via parentappointmentid to appointment.appointmentid.
        columns:
          - name: parentappointmentid
            description: "Parent appointment ID (FK to appointment.appointmentid)"
          - name: requirescancellationyn
            description:
              "Y/N flag indicating appointment is marked for cancellation
              (mass-freeze workflow)"

      - name: procedurecodereference
        description: |
          Procedure code (CPT/HCPCS) reference (athenahealth.athenaone.procedurecodereference).
          One row per procedure code per context; carries DESCRIPTION / COMMONDESCRIPTION,
          TYPEOFSERVICE, RVU, and EM/status flags. Athena is licensed for the AMA CPT
          descriptor set, so deriving ref_claims__procedure_code from here keeps us inside
          our license boundary (no AMA-CPT seed to vendor). Latest, non-deleted context wins.
        columns:
          - name: procedurecode
            description: "CPT/HCPCS procedure code"
          - name: description
            description: "Full procedure description"
          - name: commondescription
            description: "Shorter, common-use description"
          - name: typeofservice
            description: "Athena type-of-service classification"

      - name: department
        description: |
          Department data (athenahealth.athenaone.department). Includes CMS codes, provider
          group and/or department group. Join to mdm.reference_data.location for Patient_Department.
        columns:
          - name: departmentid
            description: "Athena-assigned department ID (Primary Key)"
          - name: departmentname
            description: "Department/clinic name"

      - name: provider
        description: |
          Provider data (athenahealth.athenaone.provider). Join to mdm.reference_data.provider
          for Physician flag, assigned_clinic, Non_Provider. PROVIDERTYPE/PROVIDERTYPENAME
          indicate physician vs non-physician.
        columns:
          - name: providerid
            description: "Athena-assigned provider ID (Primary Key)"
          - name: providerfirstname
            description: "Provider first name"
          - name: providerlastname
            description: "Provider last name"
      - name: providerenrollmentstatus
        description: |
          Provider payer enrollment status (athenahealth.athenaone.providerenrollmentstatus).
          Tracks per-provider, per-payer credentialing enrollment. EFFECTIVEDATEDATETIME is
          the credentialing effective date; EXPIRATIONDATEDATETIME is the expiration. Used
          to derive hire_date for MIDI providers via the earliest payer enrollment date.
        columns:
          - name: providerenrollmentstatusid
            description: "Primary key for provider enrollment status record"
          - name: providerid
            description: "Athena provider ID (FK to provider.providerid)"
          - name: enrollmentcategoryid
            description: "Payer enrollment category (FK to enrollmentcategory)"
          - name: effectivedatedatetime
            description: "Credentialing enrollment effective date"
          - name: expirationdatedatetime
            description: "Credentialing enrollment expiration date"
          - name: billingokyn
            description: "Y/N flag indicating billing is approved for this enrollment"
          - name: deleteddatetime
            description: "Soft delete timestamp"
      - name: patient
        description: |
          Patient demographic data (athenahealth.athenaone.patient). Includes race, language,
          ethnicity, guardian/guarantor, privacy notice delivery, signatures/consents.
          TESTPATIENTYN='Y' excludes test patients. CURRENTDEPARTMENTID = active department.
        config:
          loaded_at_field: "lastupdated"
          freshness:
            warn_after: { count: 48, period: hour }
            error_after: { count: 168, period: hour }
        columns:
          - name: patientid
            description: "Athena-assigned patient ID (Primary Key)"
          - name: currentdepartmentid
            description: "Patient's current department assignment"

      - name: patientinsurance
        description: |
          Patient insurance data (athenahealth.athenaone.patientinsurance). Includes
          expiration, employer, and insurance package for patient policy. Sequencenumber
          1=primary. Join to insurancepackage for payor name; join to mdm.insurance for IRC.
        columns:
          - name: patientid
            description: "Athena Patient ID - patient on which policy is assigned"
          - name: sequencenumber
            description: "Insurance sequence (1=primary, 2=secondary, etc.)"
          - name: insurancepackageid
            description: "Reference to athenahealth.athenaone.insurancepackage"

      - name: pcautomatedmessagelog
        description: |
          Athena Patient Communicator automated outbound message log
          (athenahealth.athenaone.pcautomatedmessagelog). One row per outbound
          appointment-related call/text/voicemail attempt sent by the Athena
          Patient Communicator (PMQ). Used by reminder reachability and
          engagement-history models.
        columns:
          - name: appointmentid
            description:
              "Athena appointment ID the message is associated with (FK to
              appointment.appointmentid)"
          - name: calltimedatetime
            description: "Time the outbound call/message was placed"
          - name: createddatetime
            description: "Row creation timestamp"
          - name: keypress
            description: "Patient IVR keypress response ('1' = confirm)"
          - name: pmqresultcode
            description:
              "PMQ result code (SUCCESS, NOTIFICATIONSUCCESS, NOANSWER, BUSY,
              FAILED, INVALID, VOICEMAIL, NOTIFICATIONFAILED, etc.)"
          - name: deleteddatetime
            description: "Soft delete timestamp"

      - name: referralauthorization
        description: |
          Prior authorization and referral data (athenahealth.athenaone.referralauthorization).
          Includes status, start date, expiration date, and visits approved/left.
        columns:
          - name: referralauthid
            description: "Primary key for referral authorization"
          - name: patientinsuranceid
            description: "Foreign key to patientinsurance"

      - name: insurancepackage
        description: |
          Insurance package reference (athenahealth.athenaone.insurancepackage). Payor and
          plan data. Map to mdm.reference_data.insurance for irc_group, government_funded_type.
        columns:
          - name: insurancepackageid
            description: "Insurance package ID (Primary Key)"
          - name: name
            description: "Insurance package / payor name"

      - name: claim
        description: |
          Athena claims (athenahealth.athenaone.claim). Links to appointments via
          CLAIMAPPOINTMENTID. Contains claim-level primary and secondary insurance
          (CLAIMPRIMARYPATIENTINSID, CLAIMSECONDARYPATIENTINSID) which represent what
          was actually billed. Join to patientinsurance for insurance details.
        config:
          # DEV-4549: claimcreateddatetime is create-time and misses claim updates.
          # LASTUPDATED exists on athenaone.claim; measured median update gap ~1h,
          # max observed gap ~80h — pad warn past that tail.
          loaded_at_field: "lastupdated"
          freshness:
            warn_after: { count: 96, period: hour }
            error_after: { count: 168, period: hour }
        columns:
          - name: claimid
            description: "Athena claim ID (Primary Key)"
          - name: claimappointmentid
            description: "Appointment this claim was generated from"
          - name: claimprimarypatientinsid
            description: "Primary patient insurance ID on the claim (FK to
              patientinsurance)"
          - name: claimsecondarypatientinsid
            description: "Secondary patient insurance ID on the claim (FK to
              patientinsurance)"
          - name: claimcreateddatetime
            description: "When the claim was created"
          - name: claimservicedate
            description: "Date of service for the claim"

      - name: eligibilitytrack
        description: |
          Athena eligibility verification records (athenahealth.athenaone.eligibilitytrack).
          Tracks real-time eligibility checks per appointment. PATIENTINSURANCEID is the
          insurance verified. Join to patientinsurance for insurance details.
          DELETEDDATETIME IS NULL = active records.
        columns:
          - name: eligibilitytrackid
            description: "Eligibility track record ID (Primary Key)"
          - name: appointmentid
            description: "Appointment this eligibility check applies to"
          - name: patientinsuranceid
            description: "Patient insurance ID that was verified (FK to patientinsurance)"
          - name: insurancepackageid
            description: "Insurance package that was checked"
          - name: eligibleresult
            description: "Result of eligibility check"
          - name: createddatetime
            description: "When the eligibility check was performed"
          - name: deleteddatetime
            description: "Soft delete timestamp (NULL = active)"

      - name: transaction
        description: "Athena billing transactions (Delta Lake replica)"

      - name: document
        description: "Athena document records (Delta Lake replica)"
        columns:
          - name: documentid
            description: "Document ID (Primary Key)"

      - name: documentaction
        description: |
          Athena document action audit trail (athenahealth.athenaone.documentaction).
          One row per action taken on a document (assign, reply, approve, deny,
          close, route, etc.). Drives the RN inbox productivity models. ASSIGNEDTO
          is the bucket/user the action routed to; DOCUMENTACTIONREASONID joins to
          documentactionreason for the routing rule. DELETEDDATETIME IS NULL = active.
        columns:
          - name: documentactionid
            description: "Document action ID (Primary Key)"
          - name: documentid
            description: "Document the action was taken on (FK to document.documentid)"
          - name: documentactionreasonid
            description: "Routing reason / rule applied (FK to documentactionreason)"
          - name: assignedto
            description: "Bucket or user the action assigned/routed the document to"
          - name: actiongroup
            description: "Action group label (e.g. Approve, Deny, Close)"
          - name: action
            description: "Action label within the action group"
          - name: createdby
            description: "Username (or system principal) that performed the action"
          - name: createddatetime
            description: "When the action occurred (Athena local Eastern time)"
          - name: deleteddatetime
            description: "Soft delete timestamp (NULL = active)"

      - name: documentactionreason
        description: |
          Athena document action reason / routing-rule reference
          (athenahealth.athenaone.documentactionreason). Defines the resulting
          NEXTSTATUS / NEXTDOCUMENTCLASS / DEFAULTASSIGNTO for an action.
        columns:
          - name: documentactionreasonid
            description: "Document action reason ID (Primary Key)"
          - name: nextstatus
            description: "Document status the action transitions the document to"
          - name: defaultassignto
            description: "Default bucket the routing rule assigns to"
          - name: deleteddatetime
            description: "Soft delete timestamp (NULL = active)"

      - name: medication
        description: |
          Athena medication catalog (athenahealth.athenaone.medication). One row per
          cataloged medication with FDB / RxNorm / NDC / HIC therapeutic class / generic
          concept / GCN classification. Joined to patientmedication (via medicationid) and
          by name-match to recover classification for polypharmacy de-dup and Beers HRM
          matching in stg_athena__patientmedication.
        columns:
          - name: medicationid
            description: "Athena medication catalog ID (join key to patientmedication)"
          - name: medicationname
            description: "Medication display name (name-match join key)"
          - name: rxnorm
            description: "RxNorm concept code"
          - name: ndc
            description: "National Drug Code"
          - name: fdbmedid
            description: "First Databank medication ID"
          - name: hic3code
            description: "HIC 3-char therapeutic class code"
          - name: hic2code
            description: "HIC 2-char therapeutic class group"
          - name: hic1code
            description: "HIC 1-char therapeutic class section"
          - name: genericmedconceptid
            description: "FDB generic medical concept ID (de-dup key for distinct-drug counting)"
          - name: gcnclinicalforumulationid
            description: "GCN clinical formulation ID"

      - name: patientmedication
        description: |
          Athena patient medication records (athenahealth.athenaone.patientmedication).
          One row per medication on a patient's chart. DEACTIVATIONDATETIME IS NULL =
          currently active medication. Used for RN inbox per-patient clinical summary.
        columns:
          - name: patientid
            description: "Athena Patient ID"
          - name: deactivationdatetime
            description: "When the medication was deactivated (NULL = active)"
          - name: deleteddatetime
            description: "Soft delete timestamp (NULL = active)"

      - name: interfacemessage
        description: "Athena interface message records (Delta Lake replica)"
        columns:
          - name: interfacemessageid
            description: "Interface Message ID (Primary Key)"

      - name: interfacemessageparam
        description: "Athena interface message parameters (Delta Lake replica)"
        columns:
          - name: interfacemessageid
            description: "Interface Message ID (Foreign Key)"
          - name: paramname
            description: "Parameter name"

      - name: interfacemessagedata
        description:
          "Athena interface message data payloads (Delta Lake replica).
          Contains structured HL7/CCDA message content linked to interface
          messages."
        columns:
          - name: interfacemessagedataid
            description: "Interface Message Data ID (Primary Key)"
          - name: interfacemessageid
            description: "Interface Message ID (Foreign Key to interfacemessage)"
          - name: contextid
            description: "Context/department ID"

      - name: interfacemessagedataclob
        description:
          "Athena interface message CLOB payloads (Delta Lake replica).
          Contains large-object message content (full CCDA XML, HL7 segments)
          for interface messages exceeding standard field length."
        columns:
          - name: interfacemessagedataid
            description: "Interface Message Data ID (Foreign Key to interfacemessagedata)"
          - name: contextid
            description: "Context/department ID"
          - name: clobdata
            description: "Large-object message content (CCDA XML, HL7 segments)"

      - name: patientaudit
        description:
          "Patient audit trail - tracks changes to patient records (Delta
          Lake replica)"
        columns:
          - name: sourceid
            description: "Patient ID that was changed"
          - name: fieldname
            description: "Field that was changed"
          - name: oldvalue
            description: "Previous value"
          - name: newvalue
            description: "New value"
          - name: eventdatetime
            description: "When the change occurred"

      - name: insuranceproducttype
        description: "Insurance product type reference data (Delta Lake replica)"
        columns:
          - name: insuranceproducttypeid
            description: "Insurance Product Type ID (Primary Key)"
          - name: name
            description: "Product type name (e.g., Medicare HMO, Medicare PPO)"

      - name: governmentfundedtype
        description: "Government funded insurance type reference (Delta Lake replica)"
        columns:
          - name: governmentfundedtypeid
            description: "Government Funded Type ID (Primary Key)"
          - name: name
            description: "Government funded type name (e.g., Medicare, Medicaid)"

      - name: insurancereportingcategory
        description: "Insurance reporting category reference (Delta Lake replica)"
        columns:
          - name: insurancereportingcategoryid
            description: "Insurance Reporting Category ID (Primary Key)"
          - name: name
            description: "Reporting category name (payor group)"

      - name: userprofile
        description:
          "Athena user profile data (Delta Lake replica). Contains user
          credentials, positions, department assignments. Used for BH provider
          attribution via care plan enrollment."
        columns:
          - name: username
            description: "Login username (e.g. jsmith)"
          - name: userposition
            description: "User's position (e.g. Provider, Staff)"
          - name: departmentname
            description: "User's assigned department"
          - name: firstname
            description: "User's first name"
          - name: lastname
            description: "User's last name"
          - name: deleteddatetime
            description: "Soft delete timestamp"

      - name: chroniccaremanagement
        description: "Chronic Care Management enrollment records (Delta Lake replica)"
        columns:
          - name: chroniccaremanagementid
            description: "CCM ID (Primary Key)"
          - name: patientinsuranceid
            description: "Patient Insurance ID (Foreign Key)"
          - name: chroniccarestatusid
            description: "CCM Status ID (Foreign Key)"
          - name: effectivedatedatetime
            description: "CCM effective date"
          - name: expirationdatedatetime
            description: "CCM expiration date"

      - name: chroniccarestatus
        description: "Chronic Care Status reference (Delta Lake replica)"
        columns:
          - name: chroniccarestatusid
            description: "CCM Status ID (Primary Key)"
          - name: name
            description: "Status name (Enrolled, Unenrolled, etc.)"

      - name: customdemographics
        description: "Custom demographics/fields for patients (Delta Lake replica)"
        columns:
          - name: patientid
            description: "Athena Patient ID"
          - name: customfieldname
            description: "Custom field name (e.g., Patient Tier)"
          - name: customfieldvalue
            description: "Custom field value"

      - name: clinicalencounter
        description: "Clinical encounter records (Delta Lake replica)"
        columns:
          - name: clinicalencounterid
            description: "Clinical Encounter ID (Primary Key)"
          - name: patientid
            description: "Patient ID"
          - name: appointmentid
            description: "Related appointment ID"
          - name: clinicalencountertype
            description: "Type of clinical encounter"
          - name: encounterstatus
            description: "Encounter status"

      - name: clinicalencounterdiagnosis
        description:
          "Clinical encounter diagnosis records with SNOMED codes (Delta Lake
          replica)"
        columns:
          - name: clinicalencounterid
            description: "Clinical Encounter ID (Foreign Key)"
          - name: snomedcode
            description: "SNOMED code for the diagnosis"
          - name: deleteddatetime
            description: "Soft delete timestamp"

      - name: clinicalencounterdxicd10
        description: "Clinical encounter ICD-10 diagnosis records (Delta Lake replica)"
        columns:
          - name: clinicalencounterdxid
            description: "Diagnosis record ID"
          - name: clinicalencounterid
            description: "Clinical Encounter ID (Foreign Key)"
          - name: icdcodeid
            description: "ICD Code ID (Foreign Key)"
          - name: deleteddatetime
            description: "Soft delete timestamp"

      - name: icdcodeall
        description: "ICD code reference data (Delta Lake replica)"
        columns:
          - name: icdcodeid
            description: "ICD Code ID (Primary Key)"
          - name: diagnosiscode
            description: "ICD diagnosis code"
          - name: diagnosiscodeset
            description: "Code set (ICD9, ICD10)"
          - name: isdeleted
            description: "Deleted flag"

      - name: clinicalordertype
        description: |
          Reference catalog of clinical order types (athenahealth.athenaone.clinicalordertype).
          Used to identify orders by `name` (e.g. ZIO%, HOLTER%, cardiac monitoring devices)
          via document.clinicalordertypeid join. ORDERTYPECLASS distinguishes lab vs imaging
          vs DME vs procedure.
        columns:
          - name: clinicalordertypeid
            description: "Clinical Order Type ID (Primary Key)"
          - name: name
            description: "Order type name (e.g., 'ZIO XT HEART MONITOR PATCH')"
          - name: ordertypeclass
            description: "Order class (LAB, IMAGING, DME, PROC, etc.)"
          - name: deleteddatetime
            description: "Soft delete timestamp"

      - name: clinicalprovider
        description:
          "Clinical provider reference data for external referrals (Delta
          Lake replica)"
        columns:
          - name: clinicalproviderid
            description: "Clinical Provider ID (Primary Key)"
          - name: plcname
