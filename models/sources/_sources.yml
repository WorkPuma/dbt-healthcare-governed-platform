  # ============================================
  # AthenaHealth Financials Source - Billing/Transaction Data
  # ============================================
  - name: athenahealth_financials
    description:
      "AthenaHealth financial/billing data - Delta Lake replica synced
      from Snowflake ATHENA.FINANCIALS"
    database: athenahealth
    schema: financials
    tables:
      - name: activityfact
        description: |
          Athena billing activity/transaction fact table (athenahealth.financials.activityfact).
          Contains charges, payments, adjustments, and refunds for claims. TYPE column
          indicates the transaction type (CHARGE, PAYMENT, ADJUSTMENT, TRANSFERIN, etc.).
          STATUS1 indicates billing status (BILLED, CLOSED, HOLD, etc.). Used for CPT code
          population on the intake roster via E&M procedure codes (99202-99215).
        config:
          loaded_at_field: "CAST(created AS TIMESTAMP)"
          freshness:
            warn_after: { count: 48, period: hour }
            error_after: { count: 168, period: hour }
        columns:
          - name: id
            description: "Activity fact record ID (Primary Key)"
          - name: patientid
            description: "Athena Patient ID"
          - name: appointmentid
            description: "Related appointment ID"
          - name: procedurecode
            description: "CPT/procedure code (e.g., 99213, 99214)"
          - name: type
            description:
              "Transaction type: CHARGE, PAYMENT, ADJUSTMENT, TRANSFERIN,
              TRANSFEROUT, REFUND"
          - name: status1
            description: "Billing status: BILLED, CLOSED, HOLD, VOID, DENIED"
          - name: fromdate
            description: "Service date (date of service for the charge)"
          - name: created
            description: "When the transaction record was created"
          - name: lastupdated
            description: "When the transaction was last modified"

  # ============================================
  # Healthcare Source - Analytics Tables/Views
  # ============================================
  - name: healthcare
    description: "Healthcare analytics schema with patient, appointment, and RAF data"
    database: databricks_prod
    schema: healthcare
    tables:
      - name: public_reputation_snapshot
        description: >
          Daily snapshots of public business-listing aggregates per clinic
          (databricks_prod.healthcare.public_reputation_snapshot). One row per
          (source, clinic_name, snapshot_date) with overall_rating and
          review_count from Google Places and Yelp Fusion. MANAGED Delta table
          produced outside dbt by the Prefect public-reputation-snapshot flow.
          Public data only, no PHI; never joined to patient records.

      - name: public_review_raw
        description: >
          Recent public review excerpts per clinic
          (databricks_prod.healthcare.public_review_raw). Upserted by stable
          review_id (Google up to 5, Yelp up to 3 per pull), bound to
          review_published_at. MANAGED Delta table produced outside dbt by the
          Prefect public-reputation-snapshot flow. Public data only, no PHI.

      - name: fact_provider_nps
        description: >
          Provider-level NPS survey response aggregates (databricks_prod.healthcare.fact_provider_nps).
          One row per provider × survey date. Source of nps_score and nps_category used in Provider Bonus.

      - name: ai_outreach_outreach
        description: >
          AI_Outreach AI outreach call records (databricks_prod.healthcare.ai_outreach_outreach).
          MANAGED Delta table produced outside dbt (ML/notebook pipeline). Used by
          marts_bi_v3.mart_patient_outreach. One row per outreach attempt; carries
          campaign_name, appt_attribution, athena_patient_id, account_id, sentiment,
          and call_outcome fields.

      - name: appointments
        description: >
          Healthcare-schema appointment fact table (databricks_prod.healthcare.appointments).
          Curated appointment grain used by membership KPI marts. Source of truth for
          is_completed, is_membership_visit, is_telehealth, is_behavioral_health flags.

      - name: patient_experience
        description: >
          Patient experience / NPS survey responses (databricks_prod.healthcare.patient_experience).
          One row per survey response with nps_category in (Promoter, Passive, Detractor).
          Used by membership KPI marts for monthly NPS aggregation.

      - name: mv_attribution_self_service
        description: >
          Materialized view of patient-level VBC attribution joined with
          demographics, primary insurance, assigned provider, and AWV/MDDO case
          status. One row per active attribution. Refreshed every 10 hours from
          Salesforce attribution objects and the MDM patient master.

      - name: mv_cbp_selfservice
        description: >
          Materialized view powering Controlling Blood Pressure (CBP) quality
          reporting. One row per attributed hypertensive patient with most
          recent systolic/diastolic readings, control flag, and clinical
          exclusion reasons. Sourced from Athena observation + problem-list
          tables.

      - name: vw_appointmentview_patient_visits
        description: >
          Athena appointmentview-derived patient-visit feed (one row per
          appointment) used by legacy Tableau/Snowflake-era visit reports.
          Joins patient demographics, provider, department, and Athena
          appointment status. Source system: Athena One.

      - name: v_cbp_selfservice
        description: >
          View wrapper over mv_cbp_selfservice used by Tableau / self-service
          consumers. One row per attributed hypertensive patient with current
          BP control status and exclusion flags. Source system: Athena One via
          MDM dimensions.

      - name: v_scheduling_capacity_selfservice
        description: >
          Provider scheduling capacity self-service view — one row per provider
          × clinic × day with template slots, booked slots, fill rate, and open
          slot counts. Sourced from Athena appointment + scheduling-template
          tables; used by capacity-planning dashboards.

      - name: v_tcm_selfservice
        description: >
          Transition-of-Care self-service view — one row per hospital discharge
          (ADT event) with linked Salesforce TCM case, scheduled and completed
          TOC appointments, and 2-business-day RN-call flag. Source: ADT feed
          (PointClickCare / PatientPing) joined to Athena and Salesforce.

      - name: bhpatient_appointments
        description: >
          DEPRECATED 2026-04-28. Snowflake-derived BH appointment export that
          stopped refreshing on 2026-01-12 when its upstream materialized view
          was disabled. Replaced by live queries against athenahealth.athenaone
          (appointment + chartquestionnaire + cmcareplan + customdemographics)
          inside v_bhpatientpanel. Retained as a source for historical lineage
          only — do not use in new models.

      - name: mv_bhpatientpanel
        description: >
          DEPRECATED 2026-04-28. Legacy materialized view that no longer exists.
          Replaced by v_bhpatientpanel dbt view. Retained for lineage only.

      - name: vw_tcm_dashboard
        description: >
          TCM dashboard metric view — one row per hospital discharge with TOC
          completion at 7/14/30 days, RN call within 2 business days, and
          exclusion reasons. Drives the TCM Tableau dashboard. Source: ADT
          feed + Salesforce TCM cases + Athena appointments.

      - name: vw_npv_self_service_report
        description: >
          New Patient Visit (NPV) self-service report — one row per NPV
          appointment with scheduling, cancellation, immediate-reschedule, and
          60-day late-recovery flags. Source: Athena appointment + MDM
          appointment_type master.

      - name: vw_referral_management
        description: >
          Clinical orders and referrals view — one row per Athena clinical
          order with order type, ordering provider, target specialty, status,
          and result tracking. Source: Athena One clinical-order tables.

      - name: vw_heartwise_candidates
        description: >
          Heartwise cardiac-risk-program candidate identification view — one
          row per patient meeting cardiac-risk inclusion criteria, with risk
          flags and existing program-enrollment status. Source: Athena
          problem-list, lab, and medication tables.

      # ── ML Output Tables (scheduling_pattern_detection.py) ──
      - name: scheduling_pattern_slots
        description: >
          All 151K+ appointment slots scored by Isolation Forest anomaly
          detection. Each slot has an anomaly_score and is_anomalous flag.
          Populated by the scheduling_pattern_detection Databricks ML notebook.
        columns:
          - name: appointment_id
            description: "Athena appointment slot ID (Primary Key)"
            tests:
              - unique
              - not_null
          - name: anomaly_score
            description: "Isolation Forest anomaly score. More negative = more anomalous."
          - name: is_anomalous
            description: "True if the slot was flagged as anomalous by the ML model"
          - name: slots_same_day_provider
            description: "Number of slots this provider has on the same day"
          - name: slot_density_ratio
            description: "Ratio of this provider's daily slots vs their median"

      - name: scheduling_provider_daily_capacity
        description: >
          ML-inferred provider scheduling templates. One row per provider ×
          clinic × day-of-week with predicted daily slot counts, working hours,
          and visit type breakdown. Generated by Isolation Forest anomaly
          removal + K-Means clustering.
        columns:
          - name: inferred_daily_slots
            description: "Predicted total schedulable slots for this provider/day"
          - name: capacity_confidence
            description: "Model confidence (0-1). Higher = more consistent historical data."
          - name: capacity_source
            description:
              "How capacity was inferred: template_based, historical_median, or
              historical_sparse"
          - name: schedule_consistency
            description: "Week-to-week consistency of the provider's schedule (0-1)"

      - name: scheduling_drift_detection
        description:
          "ML-detected scheduling drift at Organization and Provider levels.
          Compares recent scheduling patterns against baselines."
        columns:
          - name: entity
            description: "Drift entity type: Organization or Provider"
            tests:
              - not_null
          - name: entity_name
            description: "Name of the organization or provider"
            tests:
              - not_null
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - entity
                  - entity_name

      - name: scheduling_overbook_recommendations
        description:
          "ML-generated overbooking recommendations per provider, clinic, and
          appointment date."
        columns:
          - name: provider_id
            description: "Athena provider ID"
            tests:
              - not_null
          - name: clinic_name
            description: "Clinic name"
            tests:
              - not_null
          - name: appointment_date
            description: "Appointment date"
            tests:
              - not_null
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - provider_id
                  - clinic_name
                  - appointment_date

      - name: scheduling_heatmap_data
        description: >
          Hourly scheduling density aggregated at Organization, Clinic, and
          Provider levels. Generated by the ML scheduling pipeline for heat map
          visualization.
        columns:
          - name: heatmap_level
            description: "Aggregation level: Organization, Clinic, or Provider"
            tests:
              - not_null
          - name: entity_name
            description: "Name of the entity at the given heatmap level"
            tests:
              - not_null
          - name: day_of_week
            description: "Day of week (0=Monday)"
            tests:
              - not_null
          - name: start_hour
            description: "Hour of day (0-23)"
            tests:
              - not_null
          - name: avg_slots_per_day
            description: "Average slots per calendar day in this hour window"
          - name: utilization_rate
            description: "Ratio of completed slots to total slots"
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - heatmap_level
                  - entity_name
                  - day_of_week
                  - start_hour

      # ── ML Output Tables (scheduling_ml_v2 pipeline) ──
      - name: scheduling_noshow_predictions
        description: "Per-slot no-show probability from LightGBM model"
        columns:
          - name: appointment_id
            description: "Athena appointment slot ID (Primary Key)"
            tests:
              - unique
              - not_null

      - name: scheduling_cancel_predictions
        description: "Per-slot cancellation probability from LightGBM model"
        columns:
          - name: appointment_id
            description: "Athena appointment slot ID (Primary Key)"
            tests:
              - unique
              - not_null

      - name: scheduling_demand_forecast
        description:
          "12-week demand forecast per clinic from Prophet model with flu
          season and AEP regressors"
        columns:
          - name: clinic_name
            description: "Clinic name"
            tests:
              - not_null
          - name: forecast_date
            description: "Forecast target date"
            tests:
              - not_null
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - clinic_name
                  - forecast_date

      - name: scheduling_burnout_risk
        description: "Composite burnout risk score per provider-clinic"
        columns:
          - name: provider_id
            description: "Athena Provider ID"
            tests:
              - not_null
          - name: clinic_name
            description: "Clinic name"
            tests:
              - not_null
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - provider_id
                  - clinic_name

      - name: scheduling_utilization_alerts
        description:
          "Capacity utilization alerts: NEAR_CAPACITY, APPROACHING_CAPACITY,
          UNDERUTILIZED, PROVIDER_OVERLOADED"
        columns:
          - name: alert_entity
            description: "Entity type generating the alert"
            tests:
              - not_null
          - name: entity_name
            description: "Name of the alerting entity"
            tests:
              - not_null
          - name: alert_type
            description: "Alert category"
            tests:
              - not_null
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - alert_entity
                  - entity_name
                  - alert_type

      - name: scheduling_load_balance
        description:
          "Cross-clinic load balancing opportunities identifying overloaded
          windows"
        columns:
          - name: overloaded_clinic
            description: "Clinic that is overloaded"
            tests:
              - not_null
          - name: receiving_clinic
            description: "Clinic with available capacity"
            tests:
              - not_null
          - name: hour
            description: "Hour of day"
            tests:
              - not_null
          - name: day_name
            description: "Day of week name"
            tests:
              - not_null
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - overloaded_clinic
                  - receiving_clinic
                  - hour
                  - day_name

      - name: scheduling_ma_staffing
        description:
          "Per provider-day concurrent appointment overlap analysis for MA
          staffing"

      - name: scheduling_provider_archetypes
        description:
          "GMM-derived provider scheduling archetypes with soft cluster
          assignments"

      - name: empi_golden_records_raw
        description:
          "Raw EMPI Golden Record identity clusters landed by the Splink
          probabilistic-matching notebook (empi_splink_matching_v2). Links
          ATHENA, SALESFORCE, MEMBERSHIP_PLATFORM, AHA, MEDICARE, etc. via golden_id. Natural
          key is (source_system, source_id) — the same source_id can recur
          across systems. The deduped ServingDB-synced surface is
          int_empi_golden_records_clean (healthcare.empi_golden_records)."
        config:
          loaded_at_field: updated_at
          # Evidence (DEV-4549): median updated_at batch gap ~48h, p95 ~149h.
          freshness:
            warn_after: { count: 96, period: hour }
            error_after: { count: 336, period: hour }  # ~14d
        # Soft warn on raw grain: Splink may emit within-system dups that the
        # clean model collapses. Never declare single-column unique on source_id.
        columns:
          - name: golden_id
            description: "Golden Record ID — unique identity cluster identifier"
          - name: source_system
            description: "Source system (ATHENA, SALESFORCE, AHA, MEDICARE, …)"
            tests:
              - not_null:
                  config:
                    severity: warn
          - name: source_id
            description: "Patient ID from the source system"
            tests:
              - not_null:
                  config:
                    severity: warn
          - name: mbi
            description: "Medicare Beneficiary Identifier"
          - name: cluster_size
            description: "Number of source records in this identity cluster"
          - name: is_test_patient
            description: "Flag indicating test patient"
          - name: is_primary
            description: "Flag indicating primary record in cluster"

      - name: empi_identity_profile
        description: "EMPI identity-level profile attributes keyed by golden_id,
          including immutable identity_id and deterministic matching flags."
        config:
          # Evidence (DEV-4549): row updated_at shows a single batch — column-based
          # freshness cannot measure write cadence. Use Delta commit history instead.
          loaded_at_query: "{{ delta_history_freshness('databricks_prod', 'healthcare', 'empi_identity_profile') }}"
          freshness:
            warn_after: { count: 96, period: hour }
            error_after: { count: 336, period: hour }
        columns:
          - name: golden_id
            description: "EMPI Golden Record ID"
          - name: identity_id
            description:
              "Immutable business identity ID in H#### format (stable across
              golden_id churn)"
          - name: updated_at
            description: "Last profile refresh timestamp from EMPI pipeline"

      - name: empi_identity_xref
        description:
          "EMPI source-to-golden cross-reference. One row per
          (source_system, source_id) mapping every external identity
          (ATHENA, SALESFORCE, MEMBERSHIP_PLATFORM, PAYOR_B, PAYOR_A, PAYOR_ALPHA_MMR, PAYOR_C,
          PAYOR_DELTA, AHA, MSSP) to its golden_id and immutable
          identity_id. PAYOR_ALPHA_MMR keys on the CMS payor_alphamn_pers_id person id
          (distinct from PAYOR_A member_subscriber_id) so CMS-paid persons earn
          an immutable H and resolve person_id -> identity inside EMPI."
        config:
          loaded_at_field: updated_at
          # Evidence (DEV-4549): median gap ~48h, p95 ~68h.
          freshness:
            warn_after: { count: 96, period: hour }
            error_after: { count: 336, period: hour }
        # (source_system, source_id) is the documented grain and the basis for
        # mart_empi_identity_map's surrogate PK; uniqueness here is what makes
        # that PK trustworthy. golden_id is the EMPI hinge every downstream join
        # relies on, so it must never be null.
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - source_system
                  - source_id
        columns:
          - name: source_system
            description: "Originating system / payor for the source_id"
          - name: source_id
            description: "Identifier as used in the source system"
          - name: identity_id
            description: "Immutable EMPI business identity ID"
          - name: golden_id
            description: "EMPI Golden Record ID"
            tests:
              - not_null

      - name: empi_identity_registry
        description:
          "EMPI identity lifecycle registry — source of truth for the permanent
          identity_id (H-#) assigned by the Databricks empi_splink_matching_v2
          notebook. One row per identity_id with its current_golden_id, status
          (ACTIVE / MERGED), lifecycle timestamps and the merged_into_identity_id
          pointer used to detect pending/resolved merges. The H-# golden index is
          protected by a dedicated guard-test set (PK integrity, ACTIVE->golden /
          MERGED->target invariants, dangling-golden relationship, and a snapshot
          immutability ledger for created_at + no-vanish)."
        config:
          loaded_at_field: updated_at
          # Evidence (DEV-4549): median gap ~72h, p95 ~298h.
          freshness:
            warn_after: { count: 168, period: hour }
            error_after: { count: 504, period: hour }  # ~21d
        columns:
          - name: identity_id
            description: "Immutable EMPI business identity ID (H-#) — primary key"
            # PK integrity for the H-# ledger: a duplicate or null H-# corrupts
            # the permanent identity index, so both are hard failures (error).
            tests:
              - unique:
                  config:
                    severity: error
              - not_null:
                  config:
                    severity: error
          - name: current_golden_id
            description: "Current golden_id this identity resolves to"
            # No dangling golden pointer. Set to warn (not error): at the
            # 2026-06-18 baseline 2,805 rows (2,761 MERGED + 44 ACTIVE) point at a
            # golden_id that no longer exists in empi_golden_records_raw — expected
            # drift as EMPI re-clusters/collapses goldens faster than the registry
            # re-points. Warn surfaces growth without redding the build; promote to
            # error once the ACTIVE backlog is driven to 0.
            tests:
              - relationships:
                  arguments:
                    to: source('healthcare', 'empi_golden_records_raw')
                    field: golden_id
                  config:
                    severity: warn
                    where: "current_golden_id is not null"
                    tags: ["referential_integrity", "empi", "identity"]
          - name: status
            description: "Identity status: ACTIVE or MERGED"
          - name: created_at
            description: "Immutable creation timestamp of the H-# (never changes)"
          - name: updated_at
            description: "Last lifecycle update timestamp (status / golden re-point)"
          - name: merged_into_identity_id
            description: "Target identity_id when this identity was merged"

      - name: empi_identity_merge_events
        description:
          "Append-only ledger of identity merge events (absorbed H-# into
          survivor H-#) written by empi_splink_matching_v2 before xref rewrite."

      - name: empi_identity_merge_xref_before
        description:
          "Append-only before-images of xref rows for absorbed identities
          captured at merge (and unmerge) time for audit / governed rollback."

      - name: empi_identity_must_not_link
        description:
          "Pairwise constraint preventing auto-merge of two identity_ids
          (canonical identity_id_a < identity_id_b). Written by governed unmerge."

      - name: empi_unmerge_requests
        description:
          "Governed unmerge request queue (PENDING/APPROVED/APPLIED/FAILED)
          with dry_run support; applied by empi_identity_unmerge notebook."

      - name: empi_unmerge_request_xrefs
        description:
          "Explicit (source_system, source_id) mappings to reassign for an
          approved unmerge request — only listed xrefs move back to absorbed."

      - name: empi_medicare_matches
        description:
          "Medicare Attribution matches linking MBIs to Athena patient IDs.
          Partitioned by attr_report_period. Used to identify MSSP-attributed
          patients who should NOT receive the MA coding intensity adjustment."
        # Drives the MEDICARE leg of patients.is_attributed. A stalled medicare
        # matcher silently freezes Medicare attribution, so keep freshness
        # visibility — but CMS-monthly cadence means a 96h hard error permanently
        # reds CD between matcher runs. Code deploys must not gate on that cadence.
        config:
          loaded_at_field: updated_at
          # Evidence (DEV-4549): CMS-monthly matcher; last batch was ~26d old at audit.
          # Prior 7d/30d still reds between monthly CMS files.
          freshness:
            warn_after: { count: 1080, period: hour }   # ~45d
            error_after: { count: 2160, period: hour }  # ~90d
        columns:
          - name: match_id
            description: "Unique match record identifier"
          - name: mbi
            description: "Medicare Beneficiary Identifier"
          - name: athena_patient_id
            description: "Matched Athena Patient ID"
          - name: golden_id
            description: "EMPI Golden Record ID"
          - name: attr_assignment_type
            description:
              "Medicare attribution type: CLAIMS_STEP_1, CLAIMS_STEP_3, or
              VOLUNTARY_ALIGNED_ONLY"
          - name: attr_report_period
            description: "Attribution report period (e.g., 2025-12)"
          - name: match_type
            description: "Match methodology (e.g., MBI_DETERMINISTIC)"
          - name: match_confidence
            description: "Match confidence score"
          - name: approval_status
            description: "Approval status: auto_approved, manually_approved, pending"

      - name: patient_identity
        description:
          "Patient identity dimension — cross-system identity bridge from
          EMPI golden records. Links Athena, Salesforce, and enterprise IDs."
        columns:
          - name: athena_id
            description: "Athena patient ID"
          - name: salesforce_id
            description: "Salesforce Account ID"
          - name: golden_id
            description: "EMPI Golden Record ID"
          - name: enterprise_id
            description: "Athena Enterprise ID"
          - name: provider_group_id
            description: "Athena Provider Group context ID"
          - name: chart_group_name
            description: "Athena chart group name"
          - name: medicare_beneficiary_id
            description: "Medicare Beneficiary Identifier (MBI)"
            config:
              meta:
                pii: true

      - name: empi_payor_matches
        description:
          "Payor attribution matches linking commercial payor member IDs to
          EMPI golden records. MBI deterministic for PAYOR_B/MSSP, probabilistic
          Splink for PAYOR_A/PAYOR_C/Payor Delta."
        # THE commercial attribution key feeding patients.is_attributed. A
        # stalled match pipeline silently freezes attribution, so add freshness
        # (this table is a daily pipeline and was fresh — ~3h — at audit time).
        config:
          loaded_at_field: updated_at
          # Evidence (DEV-4549): median gap ~35h, p95 ~176h.
          freshness:
            warn_after: { count: 72, period: hour }
            error_after: { count: 336, period: hour }
        tests:
          # Catch a sudden collapse/spike in match volume (pipeline regression).
          - elementary.volume_anomalies:
              arguments:
                timestamp_column: updated_at
                time_bucket:
                  period: day
                  count: 1
                sensitivity: 3
              config:
                severity: warn
                tags: ["elementary", "shift_guard"]
          # Catch an approval-mix shift (e.g. a surge in pending /
          # data_quality_issue, or a status-vocabulary change) that would
          # silently drop members from the approved-only crosswalks.
          - elementary.dimension_anomalies:
              arguments:
                dimensions: ["approval_status"]
                timestamp_column: updated_at
                time_bucket:
                  period: day
                  count: 1
              config:
                severity: warn
                tags: ["elementary", "dimension", "attribution"]
        columns:
          - name: match_id
            description: "Unique match record identifier"
          - name: golden_id
            description: "EMPI Golden Record ID from empi_golden_records"
          - name: payor
            description: "Payor name: PAYOR_B, MSSP, PAYOR_A, PAYOR_C, PAYOR_DELTA"
          - name: payor_source_table
            description: "Source raw table name (e.g., raw_uhc_members)"
          - name: payor_member_id
            description: "Member ID from the payor system"
          - name: athena_patient_id
            description: "Matched Athena Patient ID"
            # Approved matches should resolve to a real (non-test, non-deleted)
            # row in the patients dimension. Warn-only: many matches legitimately
            # point at inactive patients that the dimension still carries, and at
            # patients filtered out upstream — a spike in orphans signals a key
            # drift, not a hard contract.
            tests:
              - relationships:
                  arguments:
                    to: ref('patients')
                    field: patient_id
                  config:
                    severity: warn
                    where: "approval_status in ('auto_approved', 'manually_approved')"
                    tags: ["referential_integrity", "attribution"]
          - name: match_type
            description: "Match methodology: MBI_DETERMINISTIC or PROBABILISTIC"
          - name: match_confidence
            description:
              "Match confidence: 1.0 for MBI deterministic, 0.70-1.0 for
              probabilistic"
          - name: approval_status
            description: "Approval status: auto_approved, pending, data_quality_issue"

      - name: membership_members
        description: "Membership Platform member records synced by Prefect
          membership_member_activity_sync. One row per Membership patient with plan,
          billing, and status data."
        columns:
          - name: membership_patient_id
            description: "Membership patient UUID — joins to Salesforce
              Account.Membership_Patient_Id__c"
            tests:
              - unique
              - not_null
          - name: plan_name
            description:
              "Plan display name (always 'Her Membership' — not useful for plan
              differentiation)"
          - name: plan_rate_cents
            description:
              "Monthly plan rate in cents. 8333 = annual ($999.96/yr), 9999 =
              standard monthly ($99.99/mo)"
          - name: signup_page_slug
            description:
              "Membership signup page slug. 'Healthcare-legacy-member' for legacy,
              'her-membership' for standard"
          - name: total_invoiced_cents
            description:
              "Cumulative amount invoiced in cents. 0 = legacy free year (no
              billing yet)"
          - name: total_paid_cents
            description: "Cumulative amount paid in cents"
          - name: membership_status
            description: "Membership membership status: active, inactive, cancelled, etc."
          - name: member_since
            description: "Membership start date"

  # ============================================
  # BackendBaaS BIPlatform Source - AI_Outreach Outreach
  # ============================================

  - name: backendbaas_bi
    description: "BackendBaaS BIPlatform application database — operational application
      data federated into Databricks, including outreach and legacy membership"
    database: backendbaas_bi
    schema: public
    tables:
      - name: legacy_members
        description: >
          Canonical current-state store for legacy memberships. Salesforce
          controls routing through Account.Legacy_Member__c; this table is
          authoritative for whether a routed legacy membership is active.
        config:
          # DEV-4549 follow-up: legacy_members is a FOREIGN postgresql table (not
          # Delta), so delta_history_freshness (DESCRIBE HISTORY) raises
          # DELTA_ONLY_OPERATION. Use last_synced_at (Salesforce-to-BackendBaaS
          # projection time) as the freshness column instead.
          loaded_at_field: last_synced_at
          freshness:
            warn_after: { count: 48, period: hour }
            error_after: { count: 96, period: hour }
        columns:
          - name: salesforce_account_id
            description: "Salesforce Account ID; canonical cross-system identity."
            tests:
              - unique
              - not_null
          - name: is_active
            description: "Whether the legacy membership is currently active."
            tests:
              - not_null
          - name: legacy_effective_at
            description: "Timestamp when BackendBaaS became authoritative for this membership."
          - name: last_synced_at
            description: "Most recent successful Salesforce-to-BackendBaaS projection."
            tests:
              - not_null
      - name: legacy_membership_events
        description: >
          Append-only audit events for legacy membership sync and Membership offload.
          This is not a complete point-in-time lifecycle ledger and is not used
          to reconstruct historical active state.
        columns:
          - name: id
            tests:
              - unique
              - not_null
          - name: salesforce_account_id
            tests:
              - not_null
          - name: event_type
            tests:
              - not_null
      - name: ai_outreach_outreach_log
        description: "Real-time event log for AI_Outreach AWV scheduling outreach campaigns"
        config:
          loaded_at_field: "created_at"
          # Evidence (DEV-4549): median created_at batch gap ~24h, p95 ~120h.
          freshness:
            warn_after: { count: 144, period: hour }
            # fusion ignores error_after: null when parent would inherit; warn-only
            error_after: { count: 720, period: hour }
      - name: ai_outreach_webhooks
        description:
          "Raw AI_Outreach End of Sequence Report webhook payloads with per-call
          outreach array in raw_payload JSONB"
        config:
          loaded_at_field: "received_at"
          freshness:
            warn_after: { count: 72, period: hour }
            error_after: null


  - name: backendbaas_bi_midi
    description: >
      BackendBaaS BIPlatform `BIPlatform` schema — MIDI intake roster and document pipeline.
      Federated into Databricks as backendbaas_bi.BIPlatform.*. Authoritative write path
      is BackendBaaS (intake_roster_sheets_sync); dbt model intake_roster projects
      into healthcare for analytics joins.
    database: backendbaas_bi
    schema: BIPlatform
    tables:
      - name: intake_roster
        description: "MIDI intake roster visit grain — intake_status, consent, CPT"
        config:
          # Evidence (DEV-4549): row updated_at is a single full-refresh batch;
          # use Delta commit history. Keep bursty-source error pad at 7d.
          loaded_at_query: "{{ delta_history_freshness('backendbaas_bi', 'BIPlatform', 'intake_roster') }}"
          freshness:
            warn_after: { count: 48, period: hour }
            error_after: { count: 168, period: hour }
      - name: attribution_decisions
        description: >
          Human-reviewed (and EligibilityAPI-eligibility-seeded) dual-attribution
          decisions: which attributed payor is primary vs secondary for an
          identity. Keyed on identity_id (H-number) with athena_patient_id for
          census joins. snapshot_hash captures the attributed-payor set at
          decision time so patient_census can fall back to the roster default
          when a later payor file changes the attributed set.
        config:
          loaded_at_field: updated_at
          freshness:
            warn_after: { count: 168, period: hour }
            error_after: null
      - name: mdm_staff
        description: >
          MDM staff master (Entra + TriNet + Salesforce + Athena identity
          crosswalk). One row per employee with role, job_title, manager,
          team, and external IDs (salesforce_id, athena_user_id). Used to
          resolve "Laura's nurse team" for ADT validity gating in TCM /
          re-tiering. Federated into Databricks as backendbaas_bi.BIPlatform.mdm_staff.
        config:
          # Evidence (DEV-4549): row updated_at is a single batch — use Delta history.
          loaded_at_query: "{{ delta_history_freshness('backendbaas_bi', 'BIPlatform', 'mdm_staff') }}"
          freshness:
            warn_after: { count: 72, period: hour }
            error_after: null
        columns:
          - name: salesforce_id
            description: "Salesforce User Id — joins to Case.OwnerId for ADT ownership."
          - name: athena_user_id
            description: "Athena user id for the staff member (nullable)."
          - name: role
            description: "Functional role (e.g. Nurse, Operations, Engineering)."
          - name: manager
            description: "Direct manager display name (e.g. Laura Kahlbaugh)."
          - name: active
            description: "Whether the staff member is currently active."

  # ============================================
  # MDM Source - Master Data Management
  # ============================================

  - name: mdm
    description: "Master Data Management reference tables"
    # These tables are dbt-built and deep-cloned into the dev catalog, so reads
    # follow the target: `mdm` for prod, `databricks_dev` for dev. (Sources do
    # not run through generate_database_name, hence the inline target check.)
    database: "{{ 'databricks_dev' if target.name in ['dev', 'devcg'] else 'mdm' }}"
    schema: reference_data
    config:
      loaded_at_field: last_updated_at
      # Evidence (DEV-4549): mdm.patient median gap ~24h, p95 ~144h — 36h warn flaps.
      freshness:
        warn_after: { count: 72, period: hour }
        error_after: { count: 240, period: hour }
    tables:
      - name: provider
        description: "Master provider reference data"
        config:
          freshness: null
        columns:
          - name: provider_id
            description: "Athena Provider ID (Primary Key)"
            tests:
              - unique
              - not_null

      - name: patient
        description:
          "Master patient reference data with Salesforce appointment counts
          and EMPI golden IDs. Refreshed daily via MDM Patient job."
        columns:
          - name: patient_id
            description: "Athena Patient ID (Primary Key)"
            tests:
              - unique:
                  config:
                    severity: warn
                    warn_if: ">10"
              - not_null
          - name: golden_id
            description: "EMPI Golden Record ID for identity resolution across systems"
          - name: salesforce_account_id
