  # ============================================
  # Payor Source - PAYOR_A & PAYOR_B Data (SharePoint → Prefect → Databricks)
  # ============================================

  - name: payor
    description:
      "Raw payor files (PAYOR_A, PAYOR_B) loaded from SharePoint via Prefect.
      Schema auto-evolves."
    database: databricks_prod
    schema: payor
    config:
      freshness: null
    tables:
      - name: raw_payor_alpha_members
        description:
          "PAYOR_A member roster and cost data. 105 Excel columns + metadata.
          Contains EMPI demographics."
        # Roster feeds patients.is_attributed via empi_payor_matches. A stale
        # file silently freezes PAYOR_A attribution. Rosters are delivered on an
        # irregular monthly/quarterly cadence from SharePoint via Prefect, so a
        # hard error_after permanently reds `dbt source freshness` (and thus the
        # code deploy) between deliveries. Code deploys must NOT gate on payor
        # DATA cadence — data refresh is Prefect/ADF's job — so this is warn-only
        # (error_after: null). Staleness still surfaces as a warning here and in
        # elementary for monitoring. warn_after widened to ~monthly cadence so the
        # warning means "genuinely overdue", not "normal between deliveries".
        config:
          loaded_at_field: "CAST(loaded_at AS TIMESTAMP)"
          freshness:
            warn_after: { count: 1080, period: hour }  # ~45d (monthly cadence + slack)
            error_after: null
        tests:
          - raw_source_loader_grain:
              arguments:
                source_column: source
              config:
                severity: warn
                tags: ["payor", "reconciliation", "loader_grain"]
        columns:
          - name: patient_last_name
            description: "EMPI: Patient last name"
          - name: patient_first_name
            description: "EMPI: Patient first name"
          - name: patient_date_of_birth
            description: "EMPI: Date of birth"
          - name: patient_id
            description: "PAYOR_A-assigned patient identifier"
          - name: patient_gender
            description: "EMPI: Patient gender"
          - name: member_subscriber_id
            description: "PAYOR_A subscriber ID"
          - name: release_date
            description: "Reporting period extracted from filename"
          - name: loaded_at
            description: "UTC timestamp when row was loaded by Prefect"

      - name: raw_payor_alpha_claims
        description:
          "PAYOR_A claims data with diagnosis/procedure codes. 137 Excel columns
          + metadata."
        tests:
          - raw_source_loader_grain:
              arguments:
                source_column: source
              config:
                severity: warn
                tags: ["payor", "reconciliation", "loader_grain"]
        columns:
          - name: person_id
            description: "PAYOR_A person identifier (links to member)"
          - name: claim_nbr
            description: "Claim number"
          - name: svc_dt_fst
            description: "First service date"
          - name: diag_code1
            description: "Primary ICD diagnosis code"
          - name: proc_code
            description: "CPT procedure code"
          - name: release_date
            description: "Reporting period extracted from filename"

      - name: raw_uhc_members
        description:
          "PAYOR_B member roster data. Schema auto-evolves from Excel headers on
          first load."
        # Feeds patients.is_attributed (PAYOR_B leg) via empi_payor_matches.
        # Monthly cadence — warn-only (error_after: null) so the code deploy is
        # not blocked between deliveries. See raw_payor_alpha_members note for rationale.
        config:
          loaded_at_field: "CAST(loaded_at AS TIMESTAMP)"
          freshness:
            warn_after: { count: 1080, period: hour }  # ~45d (monthly cadence + slack)
            error_after: null
        tests:
          - raw_source_loader_grain:
              arguments:
                source_column: source
              config:
                severity: warn
                tags: ["payor", "reconciliation", "loader_grain"]
        columns:
          - name: release_date
            description: "Reporting period extracted from filename"
          - name: loaded_at
            description: "UTC timestamp when row was loaded by Prefect"

      - name: raw_uhc_revenue
        description: >
          PAYOR_B member-level revenue file — the PAYOR_B MMR-equivalent (not MOR).
          Carries per-member CMS gross revenue (operational Total MA Payment
          analogue), paid RAF A, optional Part A/B splits and RAF B on ECG
          pipe vintages (May 2026+), county/SCC, contract/PBP/segment, and CMS
          payment flags. Prefect UHC_REVENUE_COLUMN_MAP aligns Layout 6-1-like
          headers to PAYOR_A MMR names (parta_pmt/partb_pmt/risk_adjuster_factor_b);
          vendor TOTAL_MA_AMT is remapped to uhc_unvalidated_total_ma_amt because
          it does NOT equal CMS Total MA Payment (#65). All columns land as
          strings (raw passthrough).
        config:
          loaded_at_field: "CAST(release_date AS TIMESTAMP)"
          freshness:
            warn_after: { count: 45, period: day }
            error_after: null
        tests:
          - raw_source_loader_grain:
              arguments:
                source_column: source
              config:
                severity: warn
                tags: ["payor", "reconciliation", "loader_grain"]
        columns:
          - name: contract_nbr
            description: "PAYOR_B MA contract number (H-number) the member is enrolled under."
          - name: pbp
            description: "Plan Benefit Package id."
          - name: gross_revenue
            description: >
              Operational CMS Total MA Payment analogue (use as tot_ma_pmt).
              Correlates with Part A+B when those columns are present; do not
              confuse with uhc_unvalidated_total_ma_amt / legacy total_ma_amt.
          - name: risk_adjuster_factor_a
            description: "CMS-paid Part A/B risk score for the member."
          - name: release_date
            description: "Reporting period extracted from filename"
          - name: loaded_at
            description: "UTC timestamp when row was loaded by Prefect"

      - name: raw_uhc_claims
        description: >
          PAYOR_B member-level medical claim lines (the PAYOR_B cost feed; PAYOR_B analogue
          of raw_payor_alpha_claims). All columns land as strings. Files are CUMULATIVE
          rolling snapshots keyed by release_date: each monthly release restates
          prior service months as claims mature, so the latest release_date is
          the authoritative current view (mirrors PAYOR_A is_latest_release). DOS
          columns arrive as 'ddMMMyyyy' (e.g. 10FEB2026) on most vintages and
          'yyyy-MM-dd' on others. paid_amount is line-level and includes
          reversals/adjustments, so a straight SUM nets correctly (do NOT dedupe
          to a natural key — the offsetting reversal rows must be retained).
        config:
          loaded_at_field: "CAST(release_date AS TIMESTAMP)"
          freshness:
            warn_after: { count: 45, period: day }
            error_after: null
        tests:
          - raw_source_loader_grain:
              arguments:
                source_column: source
              config:
                severity: error
                tags: ["payor", "reconciliation", "loader_grain"]
        columns:
          - name: member_alt_id
            description: "PAYOR_B member id (joins int_payor__uhc_id_crosswalk.uhc_indv_id)."
          - name: mbi
            description: "Medicare Beneficiary Identifier for the member."
          - name: audit_no
            description: "PAYOR_B claim audit number (claim-ish identifier; not line-unique)."
          - name: detail_line_no
            description: "Claim detail line number."
          - name: begin_dos
            description: "Service start date ('ddMMMyyyy' or 'yyyy-MM-dd'; parse tolerantly)."
          - name: end_dos
            description: "Service end date."
          - name: paid_amount
            description: "Plan paid amount for the line (string; clean before use; includes reversals)."
          - name: claimed_amount
            description: "Billed/charged amount for the line (string)."
          - name: cpt_revenue_code
            description: "CPT/HCPCS or NUBC revenue code for the line."
          - name: pos_desc
            description: "Place-of-service description (e.g. OFFICE/CLINIC, ACUTE-CARE INPATIENT FACILITY)."
          - name: bill_type_code
            description: "NUBC type-of-bill code (may carry a trailing '.0' artifact)."
