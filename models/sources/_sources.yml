          - name: future_number
            description: "Number of future appointments (from Salesforce rollup)"
          - name: cancelled_number
            description: "Number of cancelled appointments (from Salesforce rollup)"
          - name: total_number
            description: "Total number of appointments (from Salesforce rollup)"
          - name: athena_enterprise_id
            description: "Athena Enterprise ID for multi-practice identification"

      - name: appointment_type
        description: "Appointment type reference with classification flags"
        config:
          freshness: null
        columns:
          - name: appointment_type_id
            description: "Athena Appointment Type ID"
            tests:
              - unique
              - not_null

      - name: insurance
        description: "Insurance package reference data"

      - name: location
        description: "Location/clinic reference data"
        config:
          freshness: null

      - name: department
        description: "Department/clinic mapping reference data"
        config:
          freshness: null

      - name: v_insurance_sync
        description:
          "Insurance sync view — joins Athena insurance packages with MDM
          classification. Source for sync_mdm_insurance incremental merge."

      - name: v_provider_sync
        description:
