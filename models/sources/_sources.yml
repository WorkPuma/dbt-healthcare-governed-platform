        description:
          "AHA (Payor Epsilon Health / Payor_Epsilon) attributed members roster. Medicare
          Advantage members with MBI, demographics, and risk scores."
        # AHA attribution roster (EMPI matcher input). Monthly cadence — warn-only
        # (error_after: null) so the code deploy is not blocked between deliveries.
        # See raw_payor_alpha_members rationale.
        config:
          loaded_at_field: "CAST(loaded_at AS TIMESTAMP)"
          freshness:
            warn_after: { count: 1080, period: hour }  # ~45d (monthly cadence + slack)
            error_after: null
        tests:
          - raw_source_loader_grain:
              arguments:
                source_column: source
              config:
                severity: warn
                tags: ["payor", "reconciliation", "loader_grain"]
        columns:
          - name: release_date
            description: "Reporting period extracted from filename"
          - name: loaded_at
            description: "UTC timestamp when row was loaded by Prefect"
