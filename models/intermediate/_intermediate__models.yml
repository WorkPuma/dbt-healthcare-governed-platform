          matches that month's payor set; otherwise a deterministic priority
          fallback (MEDICARE > PAYOR_C > PAYOR_B > PAYOR_A > PAYOR_DELTA > AHA >
          first listed) when a dual decision is pending — never null for
          attributed identity-months.
