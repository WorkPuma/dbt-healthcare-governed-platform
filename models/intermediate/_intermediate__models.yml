  - name: int_empi_golden_records_clean
    description: >
      Deduped, ServingDB-synced surface for the EMPI golden records landed by the
      Splink probabilistic-matching notebook. Materialised as an incremental-merge
      TABLE aliased `empi_golden_records` in the healthcare schema — it OWNS the
      relation ServingDB syncs to `empi_golden_records_synced`
      (PK=(source_system, source_id), TRIGGERED CDF). Reads
      `empi_golden_records_raw` and keeps one row per (source_system, source_id)
      (most recent updated_at). Do not key on source_id alone — that deletes
      legitimate cross-system rows (PREFECT-191).
    config:
      materialized: incremental
      incremental_strategy: merge
      unique_key: ["source_system", "source_id"]
      schema: healthcare
      alias: empi_golden_records
      tags: ["empi", "servingdb_candidate", "intermediate", "v3_synced"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - source_system
              - source_id
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
          config:
            severity: warn
            tags: ["elementary", "freshness"]
    columns:
      - name: source_id
        description: "Patient ID from the source system (part of composite PK)"
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: golden_id
        description: "Golden Record ID from Splink"
        tests:
