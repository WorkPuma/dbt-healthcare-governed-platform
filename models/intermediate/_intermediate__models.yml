        data_type: boolean
        description:
          "True when this roster_payor row is the identity's NET attributed payor
          for the target month. Filter is_net_primary = true (and pivot by
          net_attributed_payor) to count each patient once under one payor."

  - name: int_attribution_provider_match
    description: >
      Crosswalk that resolves the payor-supplied "Attributed Provider" string
      from each monthly roster (PAYOR_A, PAYOR_B, MEDICARE, AHA, PAYOR_C,
      Payor Delta) to a canonical MDM provider record. Two-tier match: (1)
      NPI exact join to providers.npi for payors that supply NPI (PAYOR_B,
      PAYOR_A-numeric, AHA, MEDICARE-when-numeric); (2) normalized-name join
      against providers.payor_match_keys for the rest. Unmatched inputs are kept
      with match_method='unmatched' so consumers can audit gaps. The MEDICARE
      leg is sourced from the VendorBlue MSSP Attribution Overview file filtered
      to Healthcare Org TIN (883504663) so non-Healthcare NPIs do not resolve to
      Healthcare's MDM provider directory. CMS beneficiary file (TIN-only) is
      attributed provider. Grain: one row per (payor, raw_npi, raw_name).
    config:
      tags: ["attribution", "mdm", "provider", "empi"]
    columns:
      - name: payor
        description: "Payor label: PAYOR_A, PAYOR_B, MEDICARE, AHA, PAYOR_C, PAYOR_DELTA"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  ["PAYOR_A", "PAYOR_B", "MEDICARE", "AHA", "PAYOR_C", "PAYOR_DELTA"]
      - name: raw_npi
        description: "Raw 10-digit NPI value supplied by the payor (null when absent)"
      - name: raw_name
        description: "Raw attributed-provider name string as supplied by the payor"
      - name: raw_name_key
        description: "Normalized form of raw_name produced by normalize_provider_name macro"
      - name: matched_provider_id
        description: "Resolved Athena provider_id (null when match_method = 'unmatched')"
      - name: matched_provider_name
        description: "Canonical MDM provider_name for the matched provider"
      - name: matched_npi
        description: "Canonical MDM NPI for the matched provider"
      - name: match_method
        description: >
          How the row was resolved: 'npi' (exact NPI join), 'name' (normalized
          full-name match against payor_match_keys), 'last_name' (single-token
          raw_name uniquely matched to one MDM provider's last name — mostly
          PAYOR_A rows where only provider_last_name was supplied), or 'unmatched'.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["npi", "name", "last_name", "unmatched"]

  - name: int_provider_by_contact
    description: >
