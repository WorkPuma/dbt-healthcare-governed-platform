source: CMS.gov ESRD-HCC Model Software E2425.86.T2 (2024/V28-era ESRD model)
model_version: ESRD (V24 HCC structure, 86 payment HCCs)
payment_year: 2026
note: >-
  The CMS-HCC ESRD payment model is a separate model from the community/
  institutional CMS-HCC V28 model. It is built on the V24 HCC structure
  (86 payment HCCs) and therefore ships its own ICD-10 -> HCC crosswalk,
  HCC hierarchy, HCC labels, and coefficients. Sub-models: DI (dialysis),
  GFA/GFN/GNPA/GNPN (functioning graft, community), GI (functioning graft,
  institutional), DNE/GNE (dialysis/graft new enrollee), TRANSPLANT
  (kidney transplant months 1-3), plus LTI and actuarial adjustments.
  Generated by data/cms_official/build_esrd_seeds.py (no values invented).
last_updated: '2026-06-04'
updated_by: data_engineering
files:
  cms_hcc_esrd__coefficients.csv:
    cms_source: D2423T2M.csv
    description: All ESRD coefficient types (demographic, disease, interaction) by
      ESRD sub-segment.
    expected_rows_min: 800
    expected_rows_max: 1000
  cms_hcc_esrd__icd10_mappings.csv:
    cms_source: F2425P1M.TXT (SAS format)
    description: ICD-10-CM to V24 HCC crosswalk used by the ESRD model.
    expected_rows_min: 9000
    expected_rows_max: 12000
  cms_hcc_esrd__hierarchy_exclusions.csv:
    cms_source: V24H86H1.TXT (SAS macro)
    description: V24 HCC hierarchy exclusion rules (parent HCC zeroes child HCC).
    expected_rows_min: 50
    expected_rows_max: 90
  cms_hcc_esrd__hcc_labels.csv:
    cms_source: V24H86L1.TXT (SAS macro)
    description: V24 HCC code labels for the 86 payment-model HCCs.
    expected_rows_min: 80
    expected_rows_max: 90
